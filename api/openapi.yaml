      x-required-permission: setup:view
      responses:
        "200": { description: "Clinic profile", content: { application/json: { schema: { $ref: "#/components/schemas/ClinicProfile" } } } }
    patch:
      tags: [Setup]
      summary: Update clinic profile
      x-required-permission: setup:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicProfileWrite" } } }
      responses:
        "200": { description: "Updated clinic profile", content: { application/json: { schema: { $ref: "#/components/schemas/ClinicProfile" } } } }

  /setup/charges:
    get:
      tags: [Setup]
      summary: Charge head / price master list
      x-required-permission: setup:view
      responses:
        "200": { description: "Charge catalogue", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ChargeHead" } } } } }
    post:
      tags: [Setup]
      summary: Add a charge head
      x-required-permission: setup:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChargeHeadWrite" } } }
      responses:
        "201": { description: "Created charge head", content: { application/json: { schema: { $ref: "#/components/schemas/ChargeHead" } } } }

  /setup/charges/{id}:
    patch:
      tags: [Setup]
      summary: Update a charge head
      x-required-permission: setup:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChargeHeadWrite" } } }
      responses:
        "200": { description: "Updated charge head", content: { application/json: { schema: { $ref: "#/components/schemas/ChargeHead" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /setup/charges/{id}/tax:
    patch:
      tags: [Setup]
      summary: >
        Set a charge head's tax class (FIN-009). Body `{ taxCategory: exempt|nil|taxable, sacHsn (4-8 digits), gstRate?, taxInclusive? }`.
        A taxable head needs a `gstRate` from the rates in force (422 rate-not-allowed otherwise); an exempt or nil head takes none. 422 invalid-sac-hsn
        for a malformed code. Writes audit `billing.charge_tax_set` and publishes the catalogue change. Response `{ id, taxCategory, sacHsn, gstRate,
        taxInclusive, allowedRates, preview: { baseMinor, taxableMinor, taxMinor, taxes } }`. The existing PATCH /setup/charges/{id} keeps its full-write body
        (that path cannot carry both bodies), so this is a sub-resource.
      x-required-permission: setup:edit
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: "The head's tax settings and a preview", content: { application/json: { schema: { type: object } } } }
        "403": { description: Forbidden }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "invalid-sac-hsn or rate-not-allowed" }

  /setup/policies:
    get:
      tags: [Setup]
      summary: Simple policy settings
      x-required-permission: setup:view
      responses:
        "200": { description: "Policies", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Policy" } } } } }

  /setup/policies/{key}:
    patch:
      tags: [Setup]
      summary: Update a policy value
      x-required-permission: setup:edit
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyWrite" } } }
      responses:
        "200": { description: "Updated policy", content: { application/json: { schema: { $ref: "#/components/schemas/Policy" } } } }
        "422": { description: "Value out of range (session.idle_lock_minutes must be a whole number 2-30)" }

  /settings/privacy/privacy-notice:
    get:
      tags: [Setup]
      summary: Privacy notice versions per language (IDC-003); the current version carries its text and locked clauses
      x-required-permission: setup:view
      responses:
        "200": { description: "Versions, newest first per language", content: { application/json: { schema: { $ref: "#/components/schemas/PrivacyNoticeVersions" } } } }
    put:
      tags: [Setup]
      summary: Publish a new notice version. The locked clauses of the template must stay verbatim and in order (422 mandatory-clause-locked); a stale baseVersion is 409 version-conflict
      x-required-permission: setup:edit
