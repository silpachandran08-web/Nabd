        "200":
          description: Compliance health
          content:
            application/json:
              schema:
                type: object
                required: [licences, items]
                properties:
                  licences:
                    type: object
                    required: [total, expiringSoon, expired]
                    properties: { total: { type: integer }, expiringSoon: { type: integer }, expired: { type: integer } }
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, label, status, detail, link]
                      properties:
                        kind: { type: string, enum: [licence, consent_template, retention] }
                        label: { type: string }
                        status: { type: string, enum: [ok, attention, expired] }
                        detail: { type: string }
                        link: { type: string, example: "/setup?tab=licences" }

