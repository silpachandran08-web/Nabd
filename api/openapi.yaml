openapi: 3.1.0
info:
  title: Nabd HMS API
  version: "1.0"
  description: >
    Foundation-layer contract (Auth, RBAC/Staff, Tenant/Branch, Patients, Audit).
    See README.md for conventions. Deny-by-default authorization: every
    operation below declares x-required-permission; the gateway rejects
    anything not explicitly granted.
servers:
  - url: https://api.nabd.health/v1
    description: production
  - url: https://api.staging.nabd.health/v1
    description: staging

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Owners
  - name: Staff
  - name: Realtime
  - name: Roles
  - name: Tenants
  - name: Setup
  - name: Patients
  - name: Queue
  - name: Audit
  - name: Clinical
  - name: Pharmacy
  - name: Billing
  - name: Nursing
  - name: Reports
  - name: Platform
  - name: Packages
  - name: Ops

paths:
  # ---------------------------------------------------------------- JWKS (PLT-002)
  /.well-known/jwks.json:
    servers:
      - url: /
    get:
      tags: [Auth]
      summary: "Public JWT verification keys: exactly 2 (active + next/previous kid), no private material"
      security: []
      x-required-permission: public
      responses:
        "200":
          description: JWKS, Cache-Control public max-age=300
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: object
                      required: [kid, kty, n, e, use, alg]
                      properties:
                        kid: { type: string }
                        kty: { type: string, enum: [RSA] }
                        n: { type: string }
                        e: { type: string }
                        use: { type: string, enum: [sig] }
                        alg: { type: string, enum: [RS256] }
  /.well-known/jwks/{population}.json:
    servers:
      - url: /
    parameters: [{ name: population, in: path, required: true, schema: { type: string, enum: [staff, owner, platform] } }]
    get:
      tags: [Auth]
      summary: "PLT-009. Public verification keys of one token population (staff, owner or platform): exactly 2 (active + next/previous kid), no private material. Each population has its own issuer (https://api.nabd.health/<population>) and keys; rotating one never touches another. The legacy /.well-known/jwks.json (and ?population=) serves the same sets, staff by default. The internal (service) population is not published: 404."
      security: []
      x-required-permission: public
      responses:
        "200":
          description: JWKS, Cache-Control public max-age=300
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, minItems: 2, maxItems: 2, items: { type: object, required: [kid, kty, n, e, use, alg] } }
        "404": { description: "Unknown or unpublished population" }
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: "PIN login (step 1 of 2 when MFA is enforced). NFR-06: no SSO, no hardware keys, no password — PIN/WhatsApp-OTP/authenticator app are the only three methods."
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug, email, pin]
              properties:
                tenantSlug: { type: string, description: "Clinic subdomain/code; disambiguates the same email across two tenants" }
                email: { type: string, format: email }
                pin: { type: string, pattern: "^[0-9]{4,8}$" }
      responses:
        "200":
          description: PIN accepted; MFA challenge issued if enforced for this role
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/MfaChallenge"
        "401":
          description: Invalid credentials (identical timing/body for unknown vs. wrong-PIN — no user enumeration)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "423":
          description: Account locked (exponential backoff in effect)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: "WhatsApp OTP login, step 1 — sends a 6-digit code. ponytail: delivery is mocked/logged until the Messaging Platform epic (E17) integrates the real WhatsApp Business API."
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug, mobilePhone]
              properties:
                tenantSlug: { type: string }
                mobilePhone: { type: string, pattern: "^\\+?[0-9](?:[ ()-]?[0-9]){7,14}$", description: "8-15 digits; local formats take the clinic's country code" }
      responses:
        "202":
          description: >
            PLT-006: the same body for every outcome (sent, limited, unknown clinic or number). Limits per number
            (HMAC of the normalised number): 3 sends per 15 min, 10 per 24 h, 60 s between sends; per tenant: the
            plan's otp_hourly_cap, else 200 per hour (hitting it publishes iam.otp_abuse.detected.v1). The code is
            generated and sent by the outbox (iam.otp.send.v1), so latency does not depend on the number existing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [sent_if_eligible] }
                  resendAfterSeconds: { type: integer, example: 60 }
        "400":
          description: VALIDATION - malformed phone only
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: WhatsApp OTP login, step 2 — also marks the staff member's mobile as verified (NB-041)
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug, mobilePhone, code]
              properties:
                tenantSlug: { type: string }
                mobilePhone: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: TokenPair, or an MfaChallenge if MFA is enforced for this role
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/MfaChallenge"
        "401":
          description: Wrong/expired code or unknown tenant+mobile (identical shape — no enumeration)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "423":
          description: Account locked (exponential backoff in effect)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete login with TOTP/SMS code, or mint a short-lived step-up token on an existing session
      security:
        - bearerAuth: []
        - {}
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, description: "Opaque signed token, not a UUID" }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: TokenPair (login flow) or a step-up token (already-authenticated flow)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/StepUpToken"
        "401":
          description: Wrong code, expired challenge, or 5th failed attempt (challenge burned)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Start MFA enrolment (PLT-001) - with the typ=mfa_setup token in the body at first login, or as a signed-in session
      description: Challenge tokens (mfa_pending, step_up, owner_select) are never accepted as Authorization bearer tokens anywhere; an mfa_setup token is only read from this body.
      security:
        - bearerAuth: []
        - {}
      x-required-permission: public
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                setupToken: { type: string, description: "typ=mfa_setup token from login; omit when signed in" }
                currentCode: { type: string, description: "PLT-004: live TOTP of the active authenticator; required to re-enrol when MFA is on (or send X-Step-Up-Token)" }
      parameters:
        - { name: X-Step-Up-Token, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Secret and otpauth URI; stored as a pending secret, the active one keeps working until /auth/mfa/confirm
          content: { application/json: { schema: { type: object } } }
        "403":
          description: step-up-required - MFA is on and neither a valid current code nor a step-up token was sent; active secret unchanged
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "401":
          description: No valid setup token or access session (token-type-not-allowed)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/mfa/recovery-verify:
    post:
      tags: [Auth]
      summary: Complete an MFA challenge with a single-use recovery code (PLT-004)
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, recoveryCode]
              properties:
                challengeToken: { type: string, description: "mfa_pending token from login" }
                recoveryCode: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Session issued, code consumed, audit auth.recovery_code_used written
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
                  remainingCodes: { type: integer }
        "401":
          description: challenge-invalid or recovery-code-invalid
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "423":
          description: account-locked
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/mfa/confirm:
    post:
      tags: [Auth]
      summary: Confirm MFA enrolment with a TOTP code (PLT-001) - setupToken in the body or a signed-in session
      security:
        - bearerAuth: []
        - {}
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
                setupToken: { type: string, description: "typ=mfa_setup token from login; omit when signed in" }
      responses:
        "200":
          description: Recovery codes
          content: { application/json: { schema: { type: object } } }
        "401":
          description: No valid setup token or access session, or wrong code
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access/refresh pair
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New pair issued; old refresh token invalidated
          content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } }
        "401":
          description: >
            Reused/revoked refresh token (entire session family revoked as a compromise signal), or PLT-007:
            Problem type TENANT_INACTIVE (clinic suspended/offboarded) or SESSION_MAX_AGE (refresh family older than
            app.auth.absolute-session-hours, 12 h; idle-lock unlock does not extend it)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      x-required-permission: authenticated
      responses:
        "204": { description: Session revoked }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List this user's active sessions (device, IP, last-seen)
      x-required-permission: authenticated
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Remotely revoke a specific session (e.g. lost device)
      x-required-permission: authenticated
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: "Revoked; denied within 60s per NB-032" }
        "404": { $ref: "#/components/responses/NotFound" }

  # PLT-012: break-glass = 30-minute, read-only emergency access (never Owner rights)
  /auth/break-glass/activate:
    post:
      tags: [Auth]
      summary: Start emergency read access (30 minutes)
      description: Token permissions are the caller's own plus clinical:view and patients:view; the token carries a `bg` claim and every non-GET call (except ending the grant) returns 403. Every Owner is alerted in-app and on WhatsApp.
      x-required-permission: clinical:breakGlass
      x-step-up: true
      parameters:
        - { name: X-Step-Up-Token, in: header, required: true, description: "Step-up token with purpose break_glass, bound to the caller's session", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, reasonText]
              properties:
                reasonCode: { type: string, enum: [unconscious_patient, life_threatening, no_treating_clinician_available, other] }
                reasonText: { type: string, minLength: 10, maxLength: 500, description: "Stored for the Owner review; never logged" }
                patientId: { type: string, format: uuid }
      responses:
        "201":
          description: Emergency access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  grantId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "403": { description: "FORBIDDEN (no clinical:breakGlass) or STEP_UP_REQUIRED (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "ALREADY_ACTIVE (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /auth/break-glass/{id}/deactivate:
    post:
      tags: [Auth]
      summary: End emergency access early (holder, or staff:edit)
      x-required-permission: authenticated
      x-permission-check: "holder of the grant OR staff:edit"
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Ended (idempotent); the elevated session is revoked" }
        "403": { description: Not the holder and no staff:edit }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/break-glass/active:
    get:
      tags: [Auth]
      summary: Active emergency-access grants in the tenant
      x-required-permission: staff:view
      responses:
        "200":
          description: Active grants (reason text is never returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        grantId: { type: string, format: uuid }
                        staffName: { type: string }
                        reasonCode: { type: string }
                        activatedAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }

  /auth/break-glass/alerts:
    get:
      tags: [Auth]
      summary: The caller's own in-app emergency-access alerts (Owners receive one per activation; no patient data)
      x-required-permission: authenticated
      responses:
        "200":
          description: Alerts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        grantId: { type: string, format: uuid }
                        message: { type: string }
                        createdAt: { type: string, format: date-time }

  /phi-read/alerts:
    get:
      tags: [Auth]
      summary: PLT-039 Owner's in-app read-volume alerts (one actor read more distinct patients in an hour than the limit; no patient data)
      x-required-permission: authenticated
      x-permission-check: owner
      responses:
        "200":
          description: Alerts for the caller's clinic, newest first (max 50)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        actorId: { type: string, format: uuid }
                        distinctPatients: { type: integer }
                        windowMinutes: { type: integer }
                        createdAt: { type: string, format: date-time }
        "403":
          description: Caller is not the clinic Owner

  # NB-046 (PIN reset & account recovery): specced, not yet implemented in the backend.
  /auth/pin-reset/request:
    post:
      tags: [Auth]
      summary: Start PIN reset (rate-limited, no enumeration) — NOT YET IMPLEMENTED
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "202": { description: "Always 202 regardless of whether the email exists" }

  /auth/pin-reset/confirm:
    post:
      tags: [Auth]
      summary: Complete PIN reset with the emailed token — NOT YET IMPLEMENTED
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPin]
              properties:
                token: { type: string }
                newPin: { type: string, pattern: "^[0-9]{6,8}$" }
      responses:
        "204": { description: PIN changed; all sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/unlock:
    post:
      tags: [Auth]
      summary: Unlock the idle screen with the PIN (failures count toward the account lockout shared with login/MFA)
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties: { pin: { type: string, pattern: "^[0-9]{4,8}$" } }
      responses:
        "204": { description: Unlocked }
        "401": { description: Incorrect PIN, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "423":
          description: Account locked; the PIN was not checked. Body carries retryAfterSeconds.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /me/preferences:
    get:
      tags: [Auth]
      summary: Current staff member's UI preferences (own row only; clinicDefaultLocale is the clinic-wide fallback)
      x-required-permission: authenticated
      responses:
        "200": { description: Preferences, content: { application/json: { schema: { $ref: "#/components/schemas/UiPreferencesRead" } } } }
        "401": { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    put:
      tags: [Auth]
      summary: Replace own UI preferences; the BFF mirrors uiLocale/uiTheme into the nabd_locale/nabd_theme cookies
      x-required-permission: authenticated
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UiPreferencesWrite" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/UiPreferences" } } } }
        "422": { description: UNSUPPORTED_LOCALE or unsupported theme / digit style, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /auth/pin/change:
    post:
      tags: [Auth]
      summary: Set a new 6-8 digit PIN. Forced after the policy upgrade - until done, every other call returns 403 pin-change-required (token claim pinChange).
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPin, newPin]
              properties:
                currentPin: { type: string, pattern: "^[0-9]{4,8}$" }
                newPin: { type: string, pattern: "^[0-9]{6,8}$" }
      responses:
        "204": { description: PIN changed; refresh the token to clear pinChange }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Current PIN incorrect, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "423": { description: Account locked, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  # ------------------------------------------------------------- Owners
  # Owner is a top-level account (owns Brand(s), each with Clinic(s)) — not a
  # row in any clinic's staff table. Login is a two-step handoff: PIN gets a
  # short-lived pendingToken scoped only to listing/selecting a workspace;
  # selecting a clinic mints a completely normal clinic access/refresh token
  # pair, reusing every other endpoint in this spec unchanged. Brand-wide
  # (multi-clinic) workspace selection isn't exposed yet — no dashboard
  # endpoint consumes it, though the RLS layer underneath is already in place
  # for when that lands.
  /owners/auth/login:
    post:
      tags: [Owners]
      summary: Owner PIN login, step 1 — issues a pendingToken, not a full session
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, pin]
              properties:
                email: { type: string, format: email }
                pin: { type: string, pattern: "^[0-9]{4,8}$" }
      responses:
        "200":
          description: >
            PIN accepted. PLT-005: an owner with MFA gets an MfaChallenge (answer at /owners/auth/mfa/verify); one without
            MFA gets an MfaSetupRequired token (enrol at /owners/auth/mfa/enroll + confirm). A PendingWorkspaceToken comes
            straight back only where app.auth.mfa.enforce-privileged=false (never in prod).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MfaChallenge"
                  - $ref: "#/components/schemas/MfaSetupRequired"
                  - $ref: "#/components/schemas/PendingWorkspaceToken"
        "401":
          description: Invalid credentials (identical shape for unknown vs. wrong-PIN — no enumeration)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "423":
          description: Account locked (exponential backoff in effect)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /owners/auth/mfa/verify:
    post:
      tags: [Owners]
      summary: Owner second factor before workspace selection (PLT-005)
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string, description: "challengeId from /owners/auth/login (owner mfa_pending token)" }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: workspaceToken (the owner_select token used by /owners/me/workspaces and /owners/workspaces/select)
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnerWorkspaceToken" } } }
        "401":
          description: mfa-failed (wrong or replayed code, expired or foreign challenge)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "423":
          description: account-locked
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /owners/auth/mfa/recovery-verify:
    post:
      tags: [Owners]
      summary: Answer the owner challenge with a single-use recovery code (PLT-005)
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, recoveryCode]
              properties:
                challengeToken: { type: string }
                recoveryCode: { type: string, maxLength: 32 }
      responses:
        "200":
          description: workspaceToken plus remainingRecoveryCodes; audit owner_auth.recovery_code_used
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnerWorkspaceToken" } } }
        "401":
          description: mfa-failed (challenge) or recovery-code-invalid
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "423":
          description: account-locked
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /owners/auth/mfa/enroll:
    post:
      tags: [Owners]
      summary: Owner enrolment, step 1 (PLT-005) - setupToken from login or invite accept
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken]
              properties:
                setupToken: { type: string }
      responses:
        "200":
          description: Pending secret stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  secretBase32: { type: string }
                  otpauthUri: { type: string }
        "401":
          description: token-type-not-allowed
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /owners/auth/mfa/confirm:
    post:
      tags: [Owners]
      summary: Owner enrolment, step 2 (PLT-005) - a code from the new secret turns MFA on
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken, code]
              properties:
                setupToken: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: 8 single-use recovery codes (shown once, stored hashed) and a workspaceToken to continue
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes: { type: array, items: { type: string } }
                  workspaceToken: { type: string }
                  expiresIn: { type: integer }
        "401":
          description: token-type-not-allowed or mfa-failed
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "423":
          description: account-locked
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /owners/me/workspaces:
    get:
      tags: [Owners]
      summary: List the caller's brands and the clinics under each
      description: Requires a pendingToken from /owners/auth/login — the purpose claim, checked server-side, gates this, not a module:action permission.
      x-required-permission: public
      x-permission-check: "pendingToken from /owners/auth/login (purpose claim)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceList" }
        "401":
          description: Missing, invalid, or wrong-purpose token
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /owners/workspaces/select:
    post:
      tags: [Owners]
      summary: Enter one clinic's workspace — mints a normal clinic access/refresh token pair
      description: >
        The owner must actually own this clinic (via one of their brands) or this 404s, same
        "don't confirm existence" rule as row-level scoping elsewhere in this spec. The resulting
        token is indistinguishable in shape from a staff member's — every other endpoint in this
        spec works unchanged from here on.
      x-required-permission: public
      x-permission-check: "pendingToken from /owners/auth/login (purpose claim)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinicId]
              properties:
                clinicId: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Missing, invalid, or wrong-purpose token
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "403":
          description: PLT-007 Problem type TENANT_INACTIVE - the clinic is suspended or offboarded
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- Staff
  /staff:
    get:
      tags: [Staff]
      summary: List staff for the caller's tenant
      x-required-permission: staff:view
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/StaffPage" }
    post:
      tags: [Staff]
      summary: Invite a new staff member (creates an invited/pending record, sends invite email)
      x-required-permission: staff:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffInviteRequest" }
      responses:
        "201": { $ref: "#/components/responses/StaffCreated" }
        "403": { description: "GRANT_EXCEEDS_CALLER (type grant-exceeds-caller) or OWNER_ROLE_RESTRICTED (type owner-role-restricted): the role, scope or field grants are richer than the caller holds (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Email already on this tenant, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /staff/roster:
    get:
      tags: [Staff]
      summary: Active clinicians (staff.clinician, PLT-016; never a role name) for queue/consult pickers — id, name and department name only
      x-required-permission: queue:view
      responses:
        "200":
          description: Active doctors ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, departmentName]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    departmentName: { type: [string, "null"], description: "REC-023: name of the doctor's department (staff.department_id); null when none is assigned" }

  /staff/clinician-review:
    get:
      tags: [Staff]
      summary: "PLT-016: staff the clinician backfill could not decide (registration number without a doctor-named role, or the reverse), for the owner to confirm with PATCH /staff/{id} clinician"
      x-required-permission: staff:view
      responses:
        "200":
          description: Unconfirmed rows ordered by name (a PATCH that sends clinician resolves the row)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [staffId, name, roleName, reason, clinician]
                  properties:
                    staffId: { type: string, format: uuid }
                    name: { type: string }
                    roleName: { type: string }
                    reason: { type: string, enum: [registration_without_doctor_role, doctor_role_without_registration] }
                    clinician: { type: boolean, description: "Current value, as the backfill set it" }

  /staff/{id}:
    get:
      tags: [Staff]
      x-required-permission: staff:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Staff", content: { application/json: { schema: { $ref: "#/components/schemas/Staff" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Staff]
      summary: Update role, scope (own-patients-only vs. all), or field-level grants
      x-required-permission: staff:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffPatch" } } }
      responses:
        "200": { description: "Staff", content: { application/json: { schema: { $ref: "#/components/schemas/Staff" } } } }
        "400": { description: "clinician-needs-registration: clinician=true without a registration number (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "GRANT_EXCEEDS_CALLER (type grant-exceeds-caller) or OWNER_ROLE_RESTRICTED (type owner-role-restricted): the role, scope or field grants are richer than the caller holds (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /staff/{id}/clinical-licence:
    get:
      tags: [Staff]
      summary: CLN-005. Whether this staff member is a registered clinician who may sign, and their licence dates. The registration number itself is on the staff record (hasRegistrationNo says whether one is on file).
      x-required-permission: staff:view
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StaffClinicalLicence" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Staff]
      summary: CLN-005. Mark (or unmark) a staff member as a registered clinician and record the licence expiry date (null = none recorded). isClinician true needs a registration number on file (400 registration-no-required). Audited (staff.clinical_licence_updated, the number is never in the audit row).
      x-required-permission: staff:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isClinician]
              properties:
                isClinician: { type: boolean }
                licenceExpiresOn: { type: [string, "null"], format: date }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StaffClinicalLicence" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /staff/{id}/clinical-licence/override:
    post:
      tags: [Staff]
      summary: CLN-005. The clinic Owner lets an expired licence keep signing until `until` (in the future, at most 30 days ahead, else 400 invalid-override-window). Owner only (403 owner-only). Audited (staff.licence_override_granted).
      x-required-permission: staff:edit
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StaffClinicalLicence" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden. owner-only (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /staff/{id}/suspend:
    post:
      tags: [Staff]
      summary: Immediately suspend staff and kill all live sessions
      x-required-permission: staff:delete
      x-step-up: true
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 3 } }
      responses:
        "204": { description: "Suspended; every session on every device revoked at once (iam.session.revoked.v1), audit event written" }
        "403": { description: "step-up-required, or STEP_UP_INVALID when the step-up token was minted in another session (PLT-007)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /staff/{id}/mfa/reset:
    post:
      tags: [Staff]
      summary: Owner resets a staff member's authenticator (PLT-004) - revokes sessions, forces enrolment at next sign-in, audit staff.mfa_reset
      x-required-permission: staff:edit
      x-step-up: true
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: X-Step-Up-Token, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, enum: [lost_device, left_clinic, other] }
                note: { type: string, maxLength: 500 }
      responses:
        "204": { description: "Reset; sessions revoked, recovery codes revoked" }
        "403": { description: "forbidden or step-up-required", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /staff/invitations/{token}/accept:
    post:
      tags: [Staff]
      summary: First-sign-in — accept invite, set PIN (accepting the link is the email-verification step), enrol MFA if required
      security: []
      x-required-permission: public
      parameters: [{ $ref: "#/components/parameters/PathToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties: { pin: { type: string, pattern: "^[0-9]{6,8}$" } }
      responses:
        "200":
          description: TokenPair, or (PLT-005) MfaSetupRequired when the role requires MFA - enrol at /auth/mfa/enroll before any session
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/MfaSetupRequired"
        "410": { description: "Invite expired (>72h) or already used", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  # --------------------------------------------------------------- Roles
  /roles:
    get:
      tags: [Roles]
      summary: List built-in and custom roles for the tenant
      x-required-permission: staff:view
      responses:
        "200": { description: "List of Role", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Role" } } } } }
    post:
      tags: [Roles]
      summary: Create a custom role from the permission matrix (module x action)
      x-required-permission: staff:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleWrite" } } }
      responses:
        "201": { description: "Role", content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }

  /roles/delegations:
    post:
      tags: [Roles]
      summary: Create a time-boxed delegation (PLT-014)
      description: Grantor's grantable set is their permanent role only. Target's sessions are revoked and role.delegation_created is audited.
      x-required-permission: staff:edit
      x-step-up: true
      parameters:
        - { name: X-Step-Up-Token, in: header, required: false, description: "Required when the delegated role is the built-in Owner", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, delegatedRoleId, reason, expiresAt]
              properties:
                staffId: { type: string, format: uuid }
                delegatedRoleId: { type: string, format: uuid }
                reason: { type: string }
                expiresAt: { type: string, format: date-time, description: "At most 30 days ahead" }
      responses:
        "201": { description: "Delegation created" }
        "403":
          description: "Problem type self-delegation, chained-delegation, grant-exceeds-base-role or step-up-required"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /roles/delegations/{id}:
    delete:
      tags: [Roles]
      summary: Revoke a delegation; target's sessions are revoked and role.delegation_revoked is audited (PLT-014)
      x-required-permission: staff:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Revoked" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles/{id}:
    get:
      tags: [Roles]
      x-required-permission: staff:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Role", content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Roles]
      x-required-permission: staff:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleWrite" } } }
      responses:
        "200": { description: "Role", content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "400":
          description: Attempted edit of a built-in role, or a grant beyond the editor's own permissions (privilege escalation blocked)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "422":
          description: mfa-required-by-policy (PLT-005) - mfaRequired=false on a role holding :approve or :refundDiscount
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /roles/{id}/reset-to-preset:
    post:
      tags: [Roles]
      summary: "PLT-016: reset a preset role to its current definition (grants and presetVersion); Owner only; audited (role.reset_to_preset)"
      x-required-permission: staff:edit
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: "Role", content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "403": { description: "OWNER_ONLY (type owner-only): the caller is not the Owner (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "NOT_A_PRESET (type not-a-preset): a custom role (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  # ------------------------------------------------------------ Tenants
  /tenants/{id}:
    get:
      tags: [Tenants]
      summary: Tenant profile (region, plan, residency)
      x-required-permission: setup:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Tenant", content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenants/{id}/branches:
    get:
      tags: [Tenants]
      x-required-permission: setup:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "List of Branch", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Branch" } } } } }
    post:
      tags: [Tenants]
      x-required-permission: setup:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BranchWrite" } } }
      responses:
        "201": { description: "Branch", content: { application/json: { schema: { $ref: "#/components/schemas/Branch" } } } }

  # --------------------------------------------------------------- Setup
  /setup/dpa:
    get:
      tags: [Setup]
      summary: ADM-002 current DPA text for the clinic's market, acceptance status and data gate
      x-required-permission: setup:view
      responses:
        "200": { description: "Status", content: { application/json: { schema: { $ref: "#/components/schemas/DpaStatus" } } } }

  /setup/dpa/otp:
    post:
      tags: [Setup]
      summary: ADM-002 send a one-time code to the owner's registered mobile (WhatsApp) to sign the DPA
      x-required-permission: setup:edit
      responses:
        "200": { description: "Challenge", content: { application/json: { schema: { $ref: "#/components/schemas/DpaOtpChallenge" } } } }
        "400": { description: "NO_MOBILE", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "NOT_OWNER", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { description: "OTP_RATE_LIMITED", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /setup/dpa/accept:
    post:
      tags: [Setup]
      summary: ADM-002 accept the DPA with the one-time code; opens the data gate when the clinic also has a plan
      description: >
        Owner only (the clinic's built-in Owner role) with setup:edit. Idempotency-Key required; a replay of an accepted
        version returns the same acceptance. At most 5 wrong codes per challenge. eSignRef is reserved: a value is refused.
      x-required-permission: setup:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DpaAcceptRequest" } } }
      responses:
        "201": { description: "Accepted", content: { application/json: { schema: { $ref: "#/components/schemas/DpaAcceptResponse" } } } }
        "400": { description: "OTP_INVALID or ESIGN_NOT_SUPPORTED", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "NOT_OWNER", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "VERSION_SUPERSEDED", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /setup/dpa/acceptances/{id}/pdf:
    get:
      tags: [Setup]
      summary: ADM-002 the signed DPA as a PDF
      x-required-permission: setup:view
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "PDF", content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { description: "Not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /setup/checklist:
    get:
      tags: [Setup]
      summary: Clinic setup wizard checklist
      x-required-permission: setup:view
      responses:
        "200": { description: "Checklist items", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SetupChecklistItem" } } } } }

  /setup/checklist/{step}/skip:
    post:
      tags: [Setup]
      summary: Mark a wizard step as skipped
      x-required-permission: setup:edit
      parameters: [{ name: step, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetupProgressUpdate" } } }
      responses:
        "204": { description: "Step skipped" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /setup/checklist/{step}/complete:
    post:
      tags: [Setup]
      summary: Mark a wizard step as done
      x-required-permission: setup:edit
      parameters: [{ name: step, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetupProgressUpdate" } } }
      responses:
        "204": { description: "Step completed" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /regions:
    get:
      tags: [Setup]
      summary: OPS-061. Supported regions and their rules (non-PHI reference data from the regions table); any authenticated staff (operators use /platform/regions).
      x-required-permission: authenticated
      responses:
        "200":
          description: Active regions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, enum: [IN, AE, SA, QA] }
                        name: { type: string }
                        currency: { type: string, description: "ISO 4217" }
                        minorUnits: { type: integer }
                        taxRegime: { type: string, description: "GST, VAT or NONE" }
                        standardTaxRate: { type: [number, "null"], description: "Headline rate in percent; null where there is no single rate (India GST)" }
                        regulator: { type: string }
                        defaultTimezone: { type: string }
                        phoneRules:
                          type: object
                          properties:
                            countryCode: { type: string }
                            nsnLength: { type: array, items: { type: integer } }
                        cell: { type: string }

  /platform/regions:
    get:
      tags: [Platform]
      summary: OPS-061. Supported regions and their rules (non-PHI reference data from the regions table); any authenticated staff or operator.
      x-required-permission: authenticated
      responses:
        "200":
          description: Active regions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, enum: [IN, AE, SA, QA] }
                        name: { type: string }
                        currency: { type: string, description: "ISO 4217" }
                        minorUnits: { type: integer }
                        taxRegime: { type: string, description: "GST, VAT or NONE" }
                        standardTaxRate: { type: [number, "null"], description: "Headline rate in percent; null where there is no single rate (India GST)" }
                        regulator: { type: string }
                        defaultTimezone: { type: string }
                        phoneRules:
                          type: object
                          properties:
                            countryCode: { type: string }
                            nsnLength: { type: array, items: { type: integer } }
                        cell: { type: string }

