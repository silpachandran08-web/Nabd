      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LicenceWrite" } } }
      responses:
        "200": { description: "Updated licence", content: { application/json: { schema: { $ref: "#/components/schemas/Licence" } } } }
