  # ------------------------------------------------------------ Patients
  /patients:
    get:
      tags: [Patients]
      summary: List/search patients (row-scoped — a doctor with "own patients only" sees only their own)
      x-required-permission: patients:view
      parameters:
        - name: q
          in: query
          description: Free-text match on name (any script), phone, MRN or token
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/PatientPage" }
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Patients]
      summary: Register a patient
      x-required-permission: patients:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatientWrite" } } }
      responses:
        "201": { description: "Patient", content: { application/json: { schema: { $ref: "#/components/schemas/Patient" } } } }
        "400": { description: "validation-failed, guardian-required, guardian-not-found, or guardian-consent-required (guardianId without a valid guardianConsent)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409":
          description: >
            Likely-duplicate match found (same phone digits, or same DOB + similar name) — client should
            offer merge instead of blind create, or resend with confirmedNotDuplicate=true after review.
            Each candidate carries matchScore (0..1) and matchedFields.
          content: { application/json: { schema: { type: object, properties: { candidates: { type: array, items: { $ref: "#/components/schemas/PatientMatchCandidate" } } } } } }

  /patients/registry:
    get:
      tags: [Patients]
      summary: Patient Registry rows with per-filter counts, search and paging (REC-040)
      description: >
        Rows for the selected filter, narrowed by `q` (name, MRN, 3+ mobile digits, or today's token
        such as `T-12`), ordered by name then id. Consent- and row-scope-gated like every patient read.
        `total` and `counts` ignore `q` and paging; `matchedTotal` is the number of rows matching filter + q
        before paging. Paging is additive: a call without `limit`/`cursor` returns the first 200 rows exactly
        as before. `cursor` is opaque (an offset into the ordered result); pass `page.nextCursor` back
        unchanged with the same `q`/`filter`. Flags and counts are computed for at most 3000 patients per clinic.
      x-required-permission: patients:view
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: filter, in: query, required: false, schema: { type: string, enum: [all, recent, followup, package, balance, duplicate, archived], default: all } }
        - { name: limit, in: query, required: false, description: "1..100 when sent; when omitted the registry returns up to 200 rows (no paging UI yet)", schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Registry page
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: "Non-archived patients (same as counts.all)" }
                  counts: { type: object, additionalProperties: { type: integer }, description: "One count per filter key" }
                  rows: { type: array, items: { $ref: "#/components/schemas/PatientRegistryRow" } }
                  matchedTotal: { type: integer, description: "Rows matching filter + q before paging (REC-040)" }
                  hasMore: { type: boolean, description: "True when page.nextCursor fetches another page (REC-040)" }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400":
          description: Invalid filter (`invalid-filter`) or malformed cursor (`invalid-cursor`)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Patient 360 (identity, allergies, active packages, balance, last visit)
      x-required-permission: patients:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "PatientDetail", content: { application/json: { schema: { $ref: "#/components/schemas/PatientDetail" } } } }
        "404":
          description: >
            Not found OR exists but out of the caller's row-level scope
            (e.g. another doctor's patient) — always 404, never 403, so an
            ID probe can't be used to confirm a patient exists (NB-041).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    patch:
      tags: [Patients]
      summary: Partial update — absent properties are left unchanged, explicit null clears guardianId/address/nationalId
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatientPatch" } } }
      responses:
        "200": { description: "Patient", content: { application/json: { schema: { $ref: "#/components/schemas/Patient" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{id}/merge:
    post:
      tags: [Patients]
      summary: Merge a duplicate into this patient (supervisor action, reversible for 30 days)
      x-required-permission: patients:delete
      x-step-up: true
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicatePatientId]
              properties:
                duplicatePatientId: { type: string, format: uuid }
      responses:
        "200": { description: "PatientDetail", content: { application/json: { schema: { $ref: "#/components/schemas/PatientDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/merges/{mergeId}/undo:
    post:
      tags: [Patients]
      summary: Reverse a merge — only within its 30-day window (NB-072)
      x-required-permission: patients:delete
      x-step-up: true
      parameters:
        - name: mergeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Reversed }
        "404": { description: "Merge doesn't exist, already reversed, or past the 30-day window", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /patients/{id}/guardian:
    delete:
      tags: [Patients]
      summary: Revoke the patient's guardian — clears guardian_id and withdraws guardian_access consent only; address and national ID are untouched (CGV-001)
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Revoked (also returned when no guardian was on file)" }
        "400": { description: "guardian-required: the patient is still a minor", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{id}/guardian/review:
    post:
      tags: [Patients]
      summary: Age-18 guardian review outcome "keep proxy" — marks the review done (patient leaves guardian-reviews-due), keeps guardian and consent; audited patient.guardian_review_kept (CGV-002). Revoke is DELETE /patients/{id}/guardian.
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [keep] }
      responses:
        "200": { description: "Refreshed patient detail incl. guardianReviewKeptAt", content: { application/json: { schema: { $ref: "#/components/schemas/PatientDetail" } } } }
        "400": { description: "validation, or guardian-review-not-due (still a minor / no guardian on file)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{id}/consent/withdraw:
    post:
      tags: [Patients]
      summary: Withdraw a consent — removes the patient from every consent-gated read path immediately (NB-053)
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                consentType: { type: string, enum: [treatment, data_processing, messaging], default: data_processing }
      responses:
        "204": { description: Withdrawn }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- Queue
  /doctors/{id}/working-hours:
    get:
      tags: [Queue]
      summary: Weekly recurring availability template for a doctor
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Working hours", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkingHours" } } } } }
    post:
      tags: [Queue]
      x-required-permission: "self (caller is doctor {id}) or setup:edit"
      description: "DOC-R7: allowed when the caller IS doctor {id} (JWT subject), or holds setup:edit. queue:edit alone is not enough for another doctor's hours. Audited."
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHoursWrite" } } }
      responses:
        "201": { description: "Working hours block created", content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHours" } } } }
        "400": { description: "Validation error; type ends in hours-overlap when the block overlaps another block of this doctor on the same weekday (blocks are half-open, so 09:00-12:00 and 12:00-14:00 do not overlap), or invalid-time-range when endTime is not after startTime", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Caller is neither doctor {id} nor holds setup:edit" }

  /doctors/{id}/working-hours/{hoursId}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - { name: hoursId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Queue]
      summary: Replace one working-hours block of this doctor
      x-required-permission: "self (caller is doctor {id}) or setup:edit"
      description: "DOC-R7: allowed when the caller IS doctor {id} (JWT subject), or holds setup:edit. queue:edit alone is not enough for another doctor's hours. Audited."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHoursWrite" } } }
      responses:
        "200": { description: "Updated block", content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHours" } } } }
        "400": { description: "Validation error; type ends in hours-overlap when the block overlaps another block of this doctor on the same weekday (blocks are half-open, so 09:00-12:00 and 12:00-14:00 do not overlap), or invalid-time-range when endTime is not after startTime", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Caller is neither doctor {id} nor holds setup:edit" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Queue]
      summary: Delete one working-hours block of this doctor (existing appointments are not touched)
      x-required-permission: "self (caller is doctor {id}) or setup:edit"
      description: "DOC-R7: allowed when the caller IS doctor {id} (JWT subject), or holds setup:edit. queue:edit alone is not enough for another doctor's hours. Audited."
      responses:
        "204": { description: Deleted }
        "403": { description: "Caller is neither doctor {id} nor holds setup:edit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /doctors/{id}/leave:
    get:
      tags: [Queue]
      summary: Blocked date ranges for a doctor (leave)
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Leave ranges", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DoctorLeave" } } } } }
    post:
      tags: [Queue]
      summary: "Block a date range; existing bookings in that range are not auto-cancelled (NB-074 — reschedule flagging deferred)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DoctorLeaveWrite" } } }
      responses:
        "201": { description: "Leave recorded", content: { application/json: { schema: { $ref: "#/components/schemas/DoctorLeave" } } } }

  /doctors/{id}/delay:
    get:
      tags: [Queue]
      summary: "Delay history (latest 20); a delay from an earlier clinic day is listed with active=false (lapsed) (ACC-001)"
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Delays", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DoctorDelay" } } } } }
    post:
      tags: [Queue]
      summary: "Announce a doctor delay, active until cleared or the clinic day ends (ACC-001)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DelayAnnounceRequest" } } }
      responses:
        "201": { description: "Delay announced", content: { application/json: { schema: { $ref: "#/components/schemas/DoctorDelay" } } } }
        "400": { description: "Problem `validation-failed`: delayMinutes outside 1..240, reason over 200 chars", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Problem `delay-already-active`: a concurrent announcement for the same doctor and clinic day won", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /doctors/{id}/delay/clear:
    post:
      tags: [Queue]
      summary: Clear today's active delay (audited)
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Cleared" }
        "400": { description: "Problem `no-active-delay` (none, or only a lapsed one from an earlier day)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /doctors/{id}/availability:
    get:
      tags: [Queue]
      summary: Bookable slots for a doctor on a given date (working hours minus leave minus already-booked slots)
      x-required-permission: queue:view
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Available slot start times
          content: { application/json: { schema: { type: array, items: { type: string, format: date-time } } } }

  /appointments:
    get:
      tags: [Queue]
      x-required-permission: queue:view
      parameters:
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
                  page: { $ref: "#/components/schemas/PageMeta" }
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Queue]
      summary: "Book a slot — concurrency-safe: a DB constraint, not an app-level check, prevents double-booking (NB-067)"
      x-required-permission: queue:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentWrite" } } }
      responses:
        "201": { description: "Booked", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { description: "patient-not-found or doctor-not-found (unknown id or another clinic's)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Slot no longer available", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /appointments/{id}:
    get:
      tags: [Queue]
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Appointment", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /appointments/{id}/cancel:
    post:
      tags: [Queue]
      summary: "Reason mandatory; slot released immediately (NB-072)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } }
      responses:
        "200": { description: "Cancelled", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /appointments/{id}/reschedule:
    post:
      tags: [Queue]
      summary: Cancels the original and books a new slot atomically
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [newStartTime], properties: { newStartTime: { type: string, format: date-time } } }
      responses:
        "200": { description: "New appointment", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "New slot no longer available", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /departments/{id}/flow:
    get:
      tags: [Queue]
      summary: "Resolved ordered step types; the default flow (vitals, consultation) when no workflow is picked (QA-08)"
      description: "Bare array, so there is no isDefault flag; GET /departments/{id}/workflow has templateCode null when the default applies."
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: "Flow steps in order"
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { stepType: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /waitlist:
    get:
      tags: [Queue]
      summary: A doctor's waitlist, oldest join first (waiting, offered and expired entries; NB-099)
      description: Lapsed offers are closed and re-offered to the next waiting patient on read.
      x-required-permission: queue:view
      parameters:
        - { name: doctorId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Entries", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WaitlistEntry" } } } } }
    post:
      tags: [Queue]
      summary: Put a patient on a doctor's waitlist
      x-required-permission: queue:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [doctorId, patientId], properties: { doctorId: { type: string, format: uuid }, patientId: { type: string, format: uuid } } }
      responses:
        "201": { description: "Joined", content: { application/json: { schema: { $ref: "#/components/schemas/WaitlistEntry" } } } }
        "404": { description: "patient-not-found or doctor-not-found (unknown id or another clinic's)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "already-waitlisted", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /waitlist/{id}/accept:
    post:
      tags: [Queue]
      summary: Accept the offered slot, or book the entry into a slot the front desk chose (REC-028)
      description: >
        Without a body (or with slotStart null) this accepts the slot the entry was offered, exactly as
        before: 409 `offer-expired` if the 15-minute offer lapsed or was used. With `slotStart` set, the
        entry (status waiting, offered or expired) is booked into that slot after the same checks as
        POST /appointments: 400 `slot-in-past`, 400 `clinic-holiday`, 409 `session-full`, 409
        `slot-unavailable` (doctor already booked then). A slot currently offered to another waitlisted
        patient is refused with 409 `slot-on-offer`; a booked/removed entry is 409 `waitlist-entry-closed`.
        slotStart equal to the entry's own live offer is the plain accept. If the entry held a live offer of
        a different slot, that slot is offered to the next waiting patient. Audited as
        `waitlist.booked_chosen_slot` (ids and slot only).
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slotStart: { type: [string, "null"], format: date-time, description: "Chosen slot start; omit to accept the offered slot" }
      responses:
        "200": { description: "Booked entry (status booked, bookedAppointmentId set)", content: { application/json: { schema: { $ref: "#/components/schemas/WaitlistEntry" } } } }
        "400": { description: "slot-in-past or clinic-holiday", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "offer-expired, slot-unavailable, slot-on-offer, session-full or waitlist-entry-closed", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /waitlist/{id}:
    delete:
      tags: [Queue]
      summary: Remove a waiting or offered entry from the waitlist
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Removed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /queue/check-in:
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Queue]
      summary: "Issues a token — scheduled (appointmentId given) or walk-in (patientId + doctorId only) (NB-068)"
      x-required-permission: queue:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CheckInRequest" } } }
      responses:
        "201": { description: "Queue entry created", content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "404": { description: "Problem `patient-not-found`, `doctor-not-found` (unknown or other-tenant id) or `not-found` (appointment mismatch, resolved, or already checked in)" }
        "409": { description: "Problem `session-full` (walk-in only): the doctor's session covering now has reached maxPatients. Occupancy = scheduled + completed appointments starting in the block + walk-in/transfer entries created in it (except no_show). Serialized per doctor-day with booking. Also `appointment-not-today` (scheduled only): the appointment's date in the clinic timezone is not today's clinic date (ACC-001); nothing is created.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /queue:
    get:
      tags: [Queue]
      summary: Today's queue (Arrivals screen)
      x-required-permission: queue:view
      parameters:
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: "Queue entries", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QueueEntry" } } } } }

  /queue/{id}/status:
    patch:
      tags: [Queue]
      summary: "State machine transition — illegal transitions rejected, every transition audited (NB-069)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [waiting, vitals_pending, vitals_done, in_consult, checkout_pending, completed, no_show] } }
      responses:
        "200": { description: "Updated", content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "400": { description: "Illegal transition", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /queue/{id}/transfer:
    post:
      tags: [Queue]
      summary: "Close this leg (transferred_out) and open a new one in another department (REC-021)"
      description: "reason is required (400 transfer-reason-required) when toDepartmentId differs from the entry's current department. Stored on the new leg and audited as queue.transfer. Queue position uses POST /queue/{id}/reorder."
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toDepartmentId, doctorId]
              properties:
                toDepartmentId: { type: string, format: uuid }
                doctorId: { type: string, format: uuid }
                reason: { type: string, enum: [wrong_department, doctor_unavailable, patient_request, other] }
                reasonNote: { type: string, maxLength: 200 }
      responses:
        "200":
          description: "Both legs"
          content:
            application/json:
              schema:
                type: object
                properties:
                  closedLeg: { $ref: "#/components/schemas/QueueEntry" }
                  newLeg: { $ref: "#/components/schemas/QueueEntry" }
        "400": { description: "transfer-reason-required / transfer-not-allowed / illegal-transition", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /queue/{id}/reorder:
    post:
      tags: [Queue]
      summary: "Priority flag with mandatory reason; reorders the queue (NB-068/NB-092)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority, reason]
              properties: { priority: { type: boolean }, reason: { type: string, minLength: 3 } }
      responses:
        "200": { description: "Updated", content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- Audit
  /audit-events:
    get:
      tags: [Audit]
      summary: Search the immutable audit trail (Owner-facing, read-only)
      x-required-permission: compliance:view
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
                  page: { $ref: "#/components/schemas/PageMeta" }

  # ------------------------------------------------- Clinical (allergies, Rx)
  /clinical/encounters:
    get:
      tags: [Clinical]
      summary: The calling doctor's own encounters (visits that reached consultation), newest first (DOC-005)
      description: >
        Read-only, tenant-scoped, restricted to queue entries where doctor_id is the caller. `state`
        filters on the clinical note (none = no note yet, draft, signed, unsigned = none or draft).
        `from`/`to` filter on the clinic calendar day of the visit. Outputs are derived from the note,
        prescription and clinical documents tables; no clinical free text is returned.
      x-required-permission: clinical:view
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [none, draft, signed, unsigned] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        queueEntryId: { type: string, format: uuid }
                        patientId: { type: string, format: uuid }
                        patientName: { type: string }
                        patientMrn: { type: string }
                        queueDate: { type: string, format: date }
                        occurredAt: { type: string, format: date-time }
                        visitStatus: { type: string, enum: [in_consult, checkout_pending, completed] }
                        noteState: { type: string, enum: [none, draft, signed] }
                        noteSignedAt: { type: [string, "null"], format: date-time }
                        amendmentCount: { type: integer }
                        rxStatus: { type: string, enum: [none, draft, signed] }
                        rxItemCount: { type: integer }
                        documentsDraft: { type: integer }
                        documentsIssued: { type: integer }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /appointments/follow-ups:
    get:
      tags: [Appointments]
      summary: The calling doctor's own follow-up appointments (appointments.is_follow_up), soonest first (DOC-006)
      description: >
        Read-only, tenant-scoped, caller's own appointments only. No booking reason or reminder data exists in
        the schema; `cancelReason` is set on cancelled rows (QA-06). `from`/`to` filter on the clinic calendar day of the start time.
      x-required-permission: queue:view
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [scheduled, cancelled, completed, no_show] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        appointmentId: { type: string, format: uuid }
                        patientId: { type: string, format: uuid }
                        patientName: { type: string }
                        patientMrn: { type: string }
                        startTime: { type: string, format: date-time }
                        status: { type: string, enum: [scheduled, cancelled, completed, no_show] }
                        cancelReason: { type: string, nullable: true, description: "QA-06: set only when cancelled" }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/patients/{patientId}/allergies:
    parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: Allergy register of a patient. Active entries by default; includeInactive=true also returns removed entries (active=false, with deactivatedReason/deactivatedAt/deactivatedByName), active ones first.
      x-required-permission: clinical:view
      parameters: [{ name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Allergy" } } } } }
    post:
      tags: [Clinical]
      summary: Add an allergy (fast add). Severity is mandatory; audited.
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AllergyWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Allergy" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/allergies/{id}:
    patch:
      tags: [Clinical]
      summary: Correct an allergy (partial update). A reason is mandatory; the original is kept in the append-only history. Corrections of the same allergy are serialised (row lock), so a concurrent correction can never write back an older severity; each applied correction has its own history row. An empty category is not accepted (omit the field to leave it unchanged).
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AllergyCorrection" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Allergy" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/allergies/{id}/deactivate:
    patch:
      tags: [Clinical]
      summary: Remove an allergy from the active register. A reason is mandatory (400 reason-required without one; the 500-character cap is validated, 400 validation-failed); the row and its history are kept.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        "200": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/patients/{patientId}/allergies/history:
    get:
      tags: [Clinical]
      summary: Append-only allergy history (added, corrected, removed, documented none) with reasons and actors
      x-required-permission: clinical:view
      parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AllergyEvent" } } } } }
  /clinical/patients/{patientId}/allergies/status:
    parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: "Allergy status: recorded, none_documented or not_assessed (nothing recorded is NOT the same as none)"
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AllergyStatus" } } } }
    put:
      tags: [Clinical]
      summary: Document "no known allergies" (who and when are stamped by the server; audited)
      x-required-permission: clinical:edit
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AllergyStatus" } } } }
  /clinical/patients/{patientId}/pregnancy-status:
    parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: "Pregnancy / lactation status. not_documented (nobody has recorded it) is NEVER the same as not_pregnant"
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PregnancyStatus" } } } }
        "404": { description: Patient not found }
    put:
      tags: [Clinical]
      summary: Record an explicit status (who and when are stamped by the server; appended to the history and audited). Never set automatically. A recorded pregnant or lactating status escalates the prescription pregnancy warning (severity severe, a fresh decision is required); other statuses leave the existing rule unchanged. Re-sending the status and date already recorded is a no-op (no history event, no audit row, recorded by / at unchanged; the current state is returned).
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [not_pregnant, pregnant, lactating, unknown] }
                expectedDeliveryDate: { type: [string, "null"], format: date, description: "Only with status pregnant" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PregnancyStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/patients/{patientId}/pregnancy-status/history:
    get:
      tags: [Clinical]
      summary: Append-only history of recorded pregnancy / lactation statuses, newest first
      x-required-permission: clinical:view
      parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    before: { type: [object, "null"], description: "{status, expectedDeliveryDate}; null for the first statement" }
                    after: { type: object }
                    actorId: { type: string, format: uuid }
                    actorName: { type: [string, "null"] }
                    occurredAt: { type: string, format: date-time }
  /clinical/drugs/search:
    get:
      tags: [Clinical]
      summary: "DOC-033. Drug name type-ahead for the prescription pad, built only from this tenant's pharmacy item master (active stocked items) and names it has prescribed before. Returns [] for q shorter than 2 characters. Names only, no PII. Not a clinical formulary; free-text entry always remains possible."
      x-required-permission: clinical:view (or clinical:edit)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 8, minimum: 1, maximum: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DrugSuggestion" } } } } }
  /clinical/rx-sets:
    get:
      tags: [Clinical]
      summary: "DOC-035. Favourite Rx sets visible to the caller: their own, other doctors' shared sets, and clinic standards. scope is relative to the caller. Each item carries stale (true = the tenant has an active pharmacy item master and neither drug nor brand is in it; null = no master to compare with, nothing guessed)."
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FavouriteRxSet" } } } } }
    post:
      tags: [Clinical]
      summary: "Save a set. scope mine (default) | shared | standard; standard needs clinical:approve (403 rx-set-owner-only). Items keep brand, sig, route and quantity. Audited (rx_set.created)."
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, items]
              properties:
                name: { type: string, maxLength: 120 }
                scope: { type: string, enum: [mine, shared, standard] }
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PrescriptionItemWrite" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FavouriteRxSet" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: standard without clinical:approve (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/rx-sets/{setId}:
    parameters: [{ name: setId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Clinical]
      summary: "DOC-035. Rename, switch scope, or replace the items (omitted fields unchanged). Only the owner or a clinical:approve holder (clinic standards: approve only); otherwise 403 rx-set-owner-only. Another doctor's PRIVATE set is 404 for everyone, clinical:approve holders included (approve reaches shared and standard sets only). Audited (rx_set.updated)."
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                scope: { type: string, enum: [mine, shared, standard] }
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PrescriptionItemWrite" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FavouriteRxSet" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: not the owner and no clinical:approve (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Clinical]
      summary: "DOC-035. Delete a set (owner or clinical:approve; same 403 rule; another doctor's private set is 404 for everyone). Prescriptions already built from it are unaffected. Audited (rx_set.deleted)."
      x-required-permission: clinical:edit
      responses:
        "204": { description: Deleted }
        "403": { description: "Forbidden (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /clinical/prescriptions/{queueEntryId}/apply-set/{setId}:
    post:
      tags: [Clinical]
      summary: "Replace the draft with the set's items, keeping brand, sig, route and quantity. The safety checks run on every applied line (drug AND brand) exactly as for typed lines. Stamps the set's lastUsedAt. 404 for another doctor's private set."
      x-required-permission: clinical:edit
      parameters:
        - { name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: setId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}/repeat-last:
    post:
      tags: [Clinical]
      summary: "DOC-035 / DOC-R2 Repeat last prescription. Replaces the draft with the lines of this patient's most recent SIGNED prescription from another visit, keeping brand, sig, route and quantity. Earlier warning decisions are not carried over; every safety check re-runs against the current register. 404 no-previous-prescription when there is none; 409 prescription-signed when this visit's Rx is already signed. Audited (prescription.repeated_last)."
      x-required-permission: clinical:edit
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}:
    parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: Prescription with structured safety warnings per line
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
    patch:
      tags: [Clinical]
      summary: Replace the draft items. A line may carry overrides (named reason per warning kind); an omitted override for the same drug and warning is kept, never silently cleared. Anyone with clinical:edit may prepare the draft, but RECORDING a decision (an override) is limited to the visit's doctor or a holder of clinical:approve (403 not-prescriber otherwise). The save is serialised with sign and with allergy-register writes (row lock), so it can never change a signed prescription.
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/PrescriptionItemWrite" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden. 403 not-prescriber when an override is sent by someone who is neither the visit's doctor nor a clinical:approve holder (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}/print-header:
    parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: Header data for printing a SIGNED prescription (clinic, prescriber of record, professional registration number). 409 prescription-not-signed for a draft. The registration number is null when none is on file; the printout must then omit it.
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PrescriptionPrintHeader" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Prescription not signed (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}/sign:
    post:
      tags: [Clinical]
      summary: Sign. Only the visit's doctor or a holder of clinical:approve may sign (403 not-prescriber otherwise). Re-checks every warning server-side against the CURRENT register while holding the prescription row lock; 409 warning-unresolved while any allergy/pregnancy/controlled warning that needs a decision has none. After signing, the items cannot change (also enforced by a database trigger). DOC-R3 - the allergy statement checked at that moment is stored as allergySnapshot in the same update and never changes afterwards. Audited.
      x-required-permission: clinical:edit
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Signed, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden. 403 not-prescriber: caller is neither the visit's doctor nor a clinical:approve holder (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/visits/{queueEntryId}/documents:
    get:
      tags: [Clinical]
      summary: Clinical documents (visit summary, referral letter, certificate) of a visit, oldest first
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ClinicalDocument" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Clinical]
      summary: Create a DRAFT document for the visit. body holds only the labelled fields of that type, as typed by the doctor (unknown keys are 400); blank values are dropped. The server fills nothing in.
      x-required-permission: clinical:edit
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocumentCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/visits/{queueEntryId}/documents/summary-prefill:
    get:
      tags: [Clinical]
      summary: Starting values for a visit summary, read from the visit's SIGNED note (diagnosis, assessment, plan) and SIGNED prescription (one line per medicine). Unsigned sources contribute nothing (noteSigned / prescriptionSigned say which). Nothing is stored; the doctor edits then creates the document.
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocumentSummaryPrefill" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/documents/{id}:
    get:
      tags: [Clinical]
      summary: One clinical document (header snapshot present once issued)
      x-required-permission: clinical:view
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Clinical]
      summary: Replace the fields of a DRAFT document (a request with no body field leaves the draft unchanged). 409 document-issued once issued.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocumentUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Conflict. 409 document-issued (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/documents/{id}/issue:
    post:
      tags: [Clinical]
      summary: Issue a draft. Requires the type's required fields (referral - referredTo, reason; certificate - purpose; visit_summary - at least one field; certificate period must not end before it starts) else 400 document-incomplete. Takes a snapshot of clinic / doctor / patient / visit values into header, stamps issuedBy / issuedAt, and from then on the document is immutable (also enforced by a database trigger). header.doctor.registrationNumber is the visit doctor's professional registration number at issue time (null when none is recorded). Only the visit's doctor or a holder of clinical:approve may issue (403 not-prescriber), as for signing a prescription; creating and editing drafts stays clinical:edit. Audited (clinical_document.issued; no clinical text in the audit row).
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Issued, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden. not-prescriber: caller is neither the visit's doctor nor holds clinical:approve (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Conflict. 409 document-issued (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/note-templates:
    get:
      tags: [Clinical]
      summary: The calling doctor's own note templates (favourites first, then by name). Other doctors' templates are never returned. Nothing is pre-loaded - the list is empty until the doctor saves one.
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NoteTemplate" } } } } }
    post:
      tags: [Clinical]
      summary: Save a note template owned by the caller. Name 1-80 chars; each section at most 4000 chars (refused, never truncated); up to 10 doctor-defined tags of at most 30 chars (trimmed, case-insensitive duplicates dropped). At most 100 templates per doctor (409 note-template-limit).
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplateCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplate" } } } }
        "400": { description: "Bad request. 400 invalid-note-template (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Conflict. 409 note-template-limit (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/note-templates/{id}:
    patch:
      tags: [Clinical]
      summary: Change one of the caller's templates. A field that is absent or null is left unchanged (send "" or [] to clear). Used to rename, edit text, edit tags and to mark or unmark a favourite. 404 for another doctor's template.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplateUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplate" } } } }
        "400": { description: "Bad request. 400 invalid-note-template (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Clinical]
      summary: Delete one of the caller's templates (notes already written from it are unaffected). 404 for another doctor's template.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/vitals/{queueEntryId}:
    get:
      tags: [Clinical]
      summary: Vitals recorded for a visit
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Vitals" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Clinical]
      summary: >
        Record or correct a visit's vitals. A field that is absent or null keeps the stored value; a measurement is
        corrected by sending the new value and cannot be blanked. At least one measurement is required
        (400 no-measurement); blood pressure is a pair (400 incomplete-blood-pressure) and systolic must exceed
        diastolic (400 invalid-blood-pressure). Values outside the plausibility bounds below are 400 validation-failed
        and are never altered. A change to an already-recorded value is audited as vitals.corrected with old and new values.
        REC-060: recording needs clinical:create or clinical:edit. Changing a value that is already recorded for the visit
        (a non-null field sent with a different value) needs clinical:edit, else 403 vitals-correction-forbidden; filling a
        still-empty field or re-sending the same value is not a correction.
      x-required-permission: "clinical:create or clinical:edit (correcting a recorded value: clinical:edit)"
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VitalsWrite" } } }
      responses:
        "200": { description: The vitals as stored, content: { application/json: { schema: { $ref: "#/components/schemas/Vitals" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Caller holds neither clinical:create nor clinical:edit, or changes an already-recorded value without clinical:edit (vitals-correction-forbidden)" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/vitals/patient/{patientId}/previous:
    get:
      tags: [Clinical]
      summary: A patient's vitals across visits, newest first (NUR-022). The caller drops the current visit. 404 for an unknown patient.
      x-required-permission: clinical:view
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 5, minimum: 1, maximum: 20 }, description: Values above 20 are capped at 20. }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/VitalsHistory" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/patients/{patientId}/dose-calculator:
    get:
      tags: [Clinical]
      summary: >
        Weight-based dose suggestion (decision support, not a prescription). total = latest recorded weight x the
        clinician-supplied mgPerKg. The rule is a named formula with no per-drug formulary, so no per-dose or daily
        maximum is returned. 400 no-weight-recorded when the patient has no recorded weight (a weight is never estimated).
        422 adult-patient when the patient is 18 or older (mg/kg dosing is out of scope). weightStale flags an old weight.
      x-required-permission: clinical:view
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mgPerKg, in: query, required: true, schema: { type: number } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DoseCalculation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { description: adult-patient (18 or older), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  # ------------------------------------------------------------ Pharmacy (Hybrid mode)
  /pharmacy/settings:
    get:
      tags: [Pharmacy]
      summary: The tenant's pharmacy mode
      x-required-permission: pharmacy:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySettings" } } } }
    patch:
      tags: [Pharmacy]
      summary: Set the pharmacy mode (external or hybrid). Items and stock are only managed in hybrid mode.
      description: >-
        PHA-006. Changing the mode requires `reason` (3-200 chars, trimmed) else 400 reason-required, and is audited as
        `pharmacy.mode_changed` (before {mode}, after {mode, reason}). Sending the current mode is a no-op (no reason needed).
        Switching to `in_house` returns 400 mode-not-available (Phase 3, not built) unless the tenant is already in_house.
      x-required-permission: pharmacy:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySettingsWrite" } } }
      responses:
        "200": { description: The settings, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /pharmacy/items:
    get:
      tags: [Pharmacy]
      summary: Pharmacy (stocked) catalogue items, active and inactive
      x-required-permission: pharmacy:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PharmacyItem" } } } } }
    post:
      tags: [Pharmacy]
      summary: Add a stocked item. `stockQty` is the opening stock and is logged as the first stock movement. 400 pharmacy-mode-not-hybrid outside Hybrid mode.
      x-required-permission: pharmacy:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItemWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /pharmacy/items/{id}:
    patch:
      tags: [Pharmacy]
      summary: Edit an item's name, price, tax, Rx flag and HSN. `stockQty` in the body is ignored; use POST /pharmacy/items/{id}/stock-adjustments to change stock.
      x-required-permission: pharmacy:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItemWrite" } } }
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pharmacy/dispensing-queue:
    get:
      tags: [Pharmacy]
      summary: Signed prescriptions waiting to be dispensed (live query)
      x-required-permission: pharmacy:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DispensingQueueEntry" } } } } }
  /billing/otc-charges:
    get:
      tags: [Billing]
      summary: >
        Chargeable catalogue for counter sales. Each charge carries `stockQty` (PHA-011).
        409 `otc-not-available` when the pharmacy mode is `external` (hybrid and in_house are allowed; PHA-010).
      x-required-permission: billing:view
      responses:
        "409": { description: Pharmacy mode is external (problem type otc-not-available) }
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { currency: { type: string }, charges: { type: array, items: { $ref: "#/components/schemas/BillingCharge" } } } } } } }
  /billing/otc-checkout:
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Billing]
      summary: >
        Counter sale (standalone invoice, no patient/queue entry). 409 `otc-not-available` when the pharmacy mode is `external`
        (PHA-010). Lines whose `chargeCode` is in the catalogue are priced SERVER-side (QA-OI-2): name, category, tax and unit price
        come from the catalogue and the client's values are silently ignored (no 400 on mismatch); a catalogue entry flagged
        doctorOverride keeps the client's unitPrice. Lines with no catalogue entry use the client's values (chargeName required,
        unitPrice and taxRatePercent >= 0, else 400 validation-failed). Non-zero discount needs billing.discount (403 discount-not-permitted).
      x-required-permission: billing:create
      responses:
        "200": { description: The invoice (lineItems show the price actually charged), content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
        "409": { description: otc-not-available, item-inactive, insufficient-stock or day-closed }
  /billing/checkout/{queueEntryId}:
    post:
      tags: [Billing]
      summary: >
        Bill a visit at a billing checkpoint. Catalogue lines are priced server-side exactly as in otc-checkout (QA-OI-2); a
        Consultation line uses the catalogue followUpAmount instead of baseAmount when the patient had a completed visit with the
        same doctor in the last 14 days (the same rule as `followUpEligible` in the checkout context). Not gated by pharmacy mode.
      x-required-permission: billing:create
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The invoice, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
        "409": { description: Conflict }
  /billing/day-close:
    get:
      tags: [Billing]
      summary: >
        Day-close summary for one clinic day (default today). Only the OWN-019 fields are spelled out here; the rest of
        the body (totals, methods, outstanding, pendingCheckouts, unbilled, taxBands, splitPaymentBills, close) is unchanged.
        voidedCount / voidedTotal count invoices whose voided_at (Sprint 3 void flow) falls within that clinic day,
        whenever the invoice was raised; voidedTotal sums their total. Voided bills are already excluded from totals.billed.
        Payment-gateway failures are not recorded anywhere, so there is no failed field.
      x-required-permission: billing:view
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  voidedCount: { type: integer, description: "Invoices voided on this clinic day (by voided_at)" }
                  voidedTotal: { type: number, description: "Sum of those invoices' total" }
                additionalProperties: true
        "403": { description: Forbidden }
  /billing/invoices/{id}/void:
    post:
      tags: [Billing]
      summary: >
        Void an invoice that has taken no payment and restore its pharmacy stock (PHA-011). One transaction: invoice
        status becomes `void`, one immutable `restock` stock movement per stocked item, audit event `billing.invoice_voided`.
        Needs billing:edit and the `billing.discount` (refund/discount) grant, else 403 void-not-permitted.
        400 reason-required; 409 invoice-already-void; 409 invoice-has-payments (refund flow does not exist yet); 409 day-closed.
        Over-selling is rejected at checkout / otc-checkout with 400 insufficient-stock (unchanged, covered by tests).
      x-required-permission: billing:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1 } } } } }
      responses:
        "200": { description: The voided invoice (status `void`), content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Conflict }
  /pharmacy/items/{id}/stock-adjustments:
    post:
      tags: [Pharmacy]
      summary: >
        Change an item's stock by hand: send exactly one of `delta` (relative, +/-) or `setTo` (counted total after a stock-take),
        and a mandatory `reason`. The item row is locked, the new count is computed from the locked value, and an immutable
        stock-movement row plus an audit event (pharmacy.stock_adjusted) record who, when and why. This is the only way to change
        stock by hand: PATCH /pharmacy/items/{id} ignores `stockQty` (it edits name, price, tax, Rx flag and HSN only).
        400 insufficient-stock when the result would be below zero; 400 no-change when the count would not change;
        400 pharmacy-mode-not-hybrid outside Hybrid mode. A missing or blank `reason` is 400 validation-failed (bean validation).
      x-required-permission: pharmacy:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyStockAdjustment" } } }
      responses:
        "200": { description: The item with its new stock count, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pharmacy/items/{id}/status:
    patch:
      tags: [Pharmacy]
      summary: Activate or deactivate an item (idempotent; audited as pharmacy.item_activated / pharmacy.item_deactivated). An inactive item no longer appears at checkout; its history and stock count stay.
      x-required-permission: pharmacy:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
                reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pharmacy/items/{id}/stock-movements:
    get:
      tags: [Pharmacy]
      summary: Immutable stock-movement log of an item (manual adjustments and checkout dispenses), newest first, last 200
      x-required-permission: pharmacy:view
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PharmacyStockMovement" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------- Nursing (vaccine record, record-only)
  /nursing/vaccine-records:
    post:
      tags: [Nursing]
      summary: Record a vaccine given. Record-only and append-only - stores what the nurse entered (free-text vaccine name, dose, route, site, lot). There is no immunisation schedule, so nothing is validated or computed against one. Audited as nursing.vaccine_recorded. 400 queue-entry-mismatch if queueEntryId belongs to another patient.
      x-required-permission: nursing:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaccineRecordWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/VaccineRecord" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /nursing/vaccine-records/today:
    get:
      tags: [Nursing]
      summary: Vaccines recorded today (clinic day), newest first. There is no due list because no vaccine schedule reference data exists.
      x-required-permission: nursing:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VaccineRecord" } } } } }

  /nursing/worklist:
    get:
      tags: [Nursing]
      summary: "NUR-019 - the nurse worklist in one call: exactly the entries GET /queue returns with no parameters (today's clinic day, all doctors/departments, priority=false), in the same order, each with its patient and vitals. Rows are never dropped. patient is the GET /patients/{id} body, or null when the caller lacks patients:view, is not fully verified (verification-required on that endpoint) or the patient is not visible to them (consent / own-patients scope). vitals is the GET /clinical/vitals/{queueEntryId} body, or null when none are recorded or the caller lacks clinical:view. Patients and vitals are batch-loaded (IN lists); guardian fields are still read per patient that has a guardian."
      x-required-permission: queue:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NursingWorklist" } } } }
        "403": { description: Caller lacks queue:view }

  # ------------------------------------------------------------- Reports
  /reports/money:
    get:
      tags: [Reports]
      summary: "Reports - Today's money (OWN-01) for a period of clinic days, inclusive; from/to both default to today. 400 invalid-period when from is after to or the range exceeds a year."
      x-required-permission: reports:view
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MoneyReport" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /reports/sources:
    get:
      tags: [Reports]
      summary: "Visits by source tag (OWN-024). Bare array; each row carries revenue (invoice totals of that source's visits) and the report-wide untaggedCount (visits with no source tag; 0 today as source is NOT NULL)."
      x-required-permission: reports:view
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    source: { type: string }
                    visitCount: { type: integer, format: int64 }
                    revenue: { type: number, description: "Sum of invoice totals for the visits in this source" }
                    untaggedCount: { type: integer, format: int64, description: "Report-wide count of untagged visits, repeated on every row" }
  /reports/packages:
    get:
      tags: [Reports]
      summary: >
        Packages report (OWN-026) for a period of clinic days (from/to inclusive; else the last `days` days to today; same
        400 invalid-period rule as /reports/money). salesByDay: every day in the period, zero-filled; count = package
        instances sold (created) that clinic day, amount = sum of their sale invoices' total (incl. tax); later refunds are
        not subtracted. redemption: over instances sold in the period (any status), sessionsSold = sum of item
        quantity_total, sessionsRedeemed = sum of quantity_consumed to date; units are all item types, the same unit as
        /packages/liability sessionsOwed. expiredWithValue: instances still `active` whose validity_end is in the period and
        today > validity_end + grace_days (the instance's computed `expired` status) with units left; expiredOn = validity_end;
        remainingValue = sum of unconsumed units x allocated per-unit price (the liability formula), rounded to 2 dp.
        Revenue recognition (deferred vs earned) is NOT provided: an accounting decision is pending.
      x-required-permission: reports:view
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  salesByDay:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }
                        amount: { type: number }
                  redemption:
                    type: object
                    properties:
                      sessionsRedeemed: { type: integer, format: int64 }
                      sessionsSold: { type: integer, format: int64 }
                  expiredWithValue:
                    type: array
                    items:
                      type: object
                      properties:
                        instanceId: { type: string, format: uuid }
                        patientName: { type: string }
                        packageName: { type: string }
                        expiredOn: { type: string, format: date }
                        remainingValue: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
  /reports/staff-performance:
    get:
      tags: [Reports]
      summary: "Per-staff performance (OWN-025). own_patients_only staff get only their own row (see scopeNote)."
      x-required-permission: reports:view
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopeNote: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        staffId: { type: string, format: uuid }
                        staffName: { type: string }
                        collected: { type: number }
                        paymentCount: { type: integer, format: int64 }
                        handledCount: { type: integer, format: int64, description: "Distinct visits: completed as doctor plus billed by this staff member" }
                        discountCount: { type: integer, format: int64, description: "Invoices raised with a discount" }
                        overrideCount: { type: integer, format: int64, description: "Prescription safety overrides/acknowledgements from audit_log" }
  # ------------------------------------------------- Packages: instances (DOC-R6; rest of E14 documented in code)
  /packages/instances:
    get:
      tags: [Packages]
      summary: Sold package instances for the caller's tenant, newest first. Optional patientId filters server-side (tenant-scoped; another tenant's patient id returns []). Absent = every instance in the tenant.
      x-required-permission: packages:view
      parameters:
        - { name: patientId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Package instances (InstanceResponse, without per-item lines)", content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "403": { description: "Forbidden: no packages:view" }
  # ------------------------------------------------- Platform console: fleet summary (LIVE-07)
  /platform/tenants/summary:
    get:
      tags: [Platform]
      summary: Fleet KPI counts. live = tenants with status 'active' (trialing excluded); trialing counted separately; byStatus has every status.
      x-required-permission: clinics_fleet:view
      responses:
        "200":
          description: Fleet summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: "Every tenant, any status" }
                  live: { type: integer, description: "Tenants whose status is 'active'" }
                  trialing: { type: integer, description: "Tenants whose status is 'trialing'" }
                  byStatus: { type: object, additionalProperties: { type: integer } }
                  regions: { type: array, items: { type: string } }
        "403": { description: "Forbidden: no clinics_fleet:view (sre)" }
  # ------------------------------------------------- Platform console: audit (PLT-028)
  /platform/audit-log:
    get:
      tags: [Platform]
      description: >
        LIVE-08 platform operator events. Platform scope (tenantId null) - platform_auth.signed_in (after.mfa),
        platform_auth.sign_in_failed (after.reason: invalid_credentials | inactive_account | unknown_account; actorId
        null for unknown_account; never the PIN or typed email), platform_auth.mfa_challenged, platform_auth.mfa_failed,
        platform_auth.signed_out, platform_auth.session_revoked, platform_auth.refresh_reuse_detected,
        platform_plan.created, platform_plan.updated (before/after plan terms), platform_provisioning.job_created
        (no owner contact details), platform_provisioning.job_approved, platform_provisioning.step_run, audit_log.export
        (when platform rows or no rows are exported). Tenant scope - platform_tenant.lifecycle_changed (fromStatus,
        toStatus, reason; also written by billing dunning transitions), platform_billing.subscription_created,
        platform_billing.subscription_updated, platform_billing.discount_requested, platform_billing.discount_auto_approved,
        platform_billing.discount_approved, platform_billing.discount_rejected, platform_ticket.status_changed (status
        only), support_access.grant, support_access.revoke, patient.support_view, audit_log.export.
      summary: Cross-tenant audit log search for platform operators (search_audit_log, V16/V85). Oldest first (ascending id), cursor = last id. All filters optional and additive (AND). createdAfter/createdBefore are inclusive ISO-8601 instants; createdAfter later than createdBefore is 400 invalid-date-range.
      x-required-permission: audit_compliance:view
      parameters:
        - $ref: "#/components/parameters/PlatformAuditTenantId"
        - $ref: "#/components/parameters/PlatformAuditAction"
        - $ref: "#/components/parameters/PlatformAuditEntityType"
        - $ref: "#/components/parameters/PlatformAuditCreatedAfter"
        - $ref: "#/components/parameters/PlatformAuditCreatedBefore"
        - $ref: "#/components/parameters/PlatformAuditActorId"
        - $ref: "#/components/parameters/PlatformAuditActorType"
        - $ref: "#/components/parameters/PlatformAuditActorRole"
        - $ref: "#/components/parameters/PlatformAuditActorName"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlatformAuditEntry" } }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: no audit_compliance:view (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /platform/audit-log/export:
    get:
      tags: [Platform]
      summary: >
        CSV export of the filtered platform audit log (same filters and same columns as GET /platform/audit-log;
        before/after are the stored JSON text). Bounded at 10,000 rows; above that it is refused with 400
        export-too-large rather than truncated. Text cells that a spreadsheet would treat as a formula are
        prefixed with an apostrophe. Audited as audit_log.export (actor = the operator, entityType audit_log),
        written once into the audit trail of every tenant whose rows the file contains, with filters (the
        actor-name search text is recorded only as actorNameFilter=true), rowCount, totalRowCount and tenantCount.
        Platform-scope rows (tenantId null) in the file, and an export matching no rows, are recorded once in the
        platform chain (V126).
      x-required-permission: audit_compliance:view
      parameters:
        - $ref: "#/components/parameters/PlatformAuditTenantId"
        - $ref: "#/components/parameters/PlatformAuditAction"
        - $ref: "#/components/parameters/PlatformAuditEntityType"
        - $ref: "#/components/parameters/PlatformAuditCreatedAfter"
        - $ref: "#/components/parameters/PlatformAuditCreatedBefore"
        - $ref: "#/components/parameters/PlatformAuditActorId"
        - $ref: "#/components/parameters/PlatformAuditActorType"
        - $ref: "#/components/parameters/PlatformAuditActorRole"
        - $ref: "#/components/parameters/PlatformAuditActorName"
      responses:
        "200":
          description: >
            CSV (Content-Disposition attachment, audit-log-YYYY-MM-DD-utc.csv, UTC date). Header row
            id,createdAt,tenantId,tenantName,tenantSlug,actorType,actorId,actorName,actorRole,ipAddress,action,entityType,entityId,before,after
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: no audit_compliance:view (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token. Carries tenantId, staffId, roleId and permission set as
        claims — the server trusts only these, never client-supplied
        tenant/role headers.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        PLT-026. A UUID (the web client sends a UUIDv7) that is new for each user action and reused unchanged when that action is
        retried. Same key + same request replays the stored 2xx response with `Idempotent-Replayed: true` (no second side effect);
        same key + different request: 422 `IDEMPOTENCY_KEY_REUSED`; the first attempt still running: 409 `IDEMPOTENCY_IN_PROGRESS`;
        header missing or not a UUID: 400 `IDEMPOTENCY_KEY_REQUIRED`. Scoped to (tenant, staff member); only 2xx responses are kept
        (a 4xx/5xx releases the key so the retry runs again); stored responses are encrypted and purged after 24 h.
        Also required on POST /billing/invoices/{id}/payments, POST /packages/instances/items/{itemId}/book,
        POST /packages/instances/{id}/refund and POST /packages/refunds/{id}/approve.
      schema: { type: string, format: uuid }
    PlatformAuditTenantId:
      name: tenantId
      in: query
      schema: { type: string, format: uuid }
    PlatformAuditAction:
      name: action
      in: query
      description: Exact action, e.g. patient.create
      schema: { type: string }
    PlatformAuditEntityType:
      name: entityType
      in: query
      schema: { type: string }
    PlatformAuditCreatedAfter:
      name: createdAfter
      in: query
      description: Inclusive lower bound (ISO-8601 instant, e.g. 2026-10-01T00:00:00Z)
      schema: { type: string, format: date-time }
    PlatformAuditCreatedBefore:
      name: createdBefore
      in: query
      description: Inclusive upper bound (ISO-8601 instant)
      schema: { type: string, format: date-time }
    PlatformAuditActorId:
      name: actorId
      in: query
      description: Exact actor id (staff id or operator id)
      schema: { type: string, format: uuid }
    PlatformAuditActorType:
      name: actorType
      in: query
      description: Any other value is 400 invalid-actor-type
      schema: { type: string, enum: [staff, operator, system] }
    PlatformAuditActorRole:
      name: actorRole
      in: query
      description: Case-insensitive exact match on the role label snapshot (e.g. Doctor, super_admin)
      schema: { type: string }
    PlatformAuditActorName:
      name: actorName
      in: query
      description: Case-insensitive substring of the actor name snapshot; % and _ match literally. audit_log stores no actor email.
      schema: { type: string }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    DbUnavailable:
      description: >-
        OPS-003. Any endpoint can return this: the database cancelled the request (code DB_TIMEOUT, statement
        timeout 5 s / lock timeout 3 s) or no connection was free within 3 s (code DB_UNAVAILABLE). Safe to retry.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Not found (or out of scope — see per-endpoint note)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    BadRequest:
      description: Validation failed
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    StaffPage:
      description: Page of staff
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Staff" } }
              page: { $ref: "#/components/schemas/PageMeta" }
    StaffCreated:
      description: Invite created
      content: { application/json: { schema: { $ref: "#/components/schemas/Staff" } } }
    PatientPage:
      description: Page of patients
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Patient" } }
              page: { $ref: "#/components/schemas/PageMeta" }

  schemas:
    ClinicalDocumentCreate:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [visit_summary, referral, certificate] }
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
    NoteTemplate:
      type: object
      required: [id, name, subjective, objective, assessment, plan, tags, favourite, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subjective: { type: string }
        objective: { type: string }
        assessment: { type: string }
        plan: { type: string }
        tags: { type: array, items: { type: string } }
        favourite: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteTemplateCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        subjective: { type: [string, "null"], maxLength: 4000 }
        objective: { type: [string, "null"], maxLength: 4000 }
        assessment: { type: [string, "null"], maxLength: 4000 }
        plan: { type: [string, "null"], maxLength: 4000 }
        tags: { type: [array, "null"], maxItems: 10, items: { type: string, maxLength: 30 } }
        favourite: { type: [boolean, "null"] }
    NoteTemplateUpdate:
      type: object
      properties:
        name: { type: [string, "null"], maxLength: 80 }
        subjective: { type: [string, "null"], maxLength: 4000 }
        objective: { type: [string, "null"], maxLength: 4000 }
        assessment: { type: [string, "null"], maxLength: 4000 }
        plan: { type: [string, "null"], maxLength: 4000 }
        tags: { type: [array, "null"], maxItems: 10, items: { type: string, maxLength: 30 } }
        favourite: { type: [boolean, "null"] }
    ClinicalDocumentUpdate:
      type: object
      properties:
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
    ClinicalDocumentBody:
      type: object
      description: >
        Plain text fields typed by the doctor, max 4000 characters each. Allowed keys per type -
        visit_summary - diagnosis, assessment, plan, medicines, patientInstructions;
        referral - referredTo, department, reason, findings, notes;
        certificate - purpose, findings, restFrom (yyyy-mm-dd), restTo (yyyy-mm-dd), remarks.
      additionalProperties: { type: string }
    ClinicalDocumentSummaryPrefill:
      type: object
      properties:
        noteSigned: { type: boolean }
        prescriptionSigned: { type: boolean }
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
    ClinicalDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        type: { type: string, enum: [visit_summary, referral, certificate] }
        status: { type: string, enum: [draft, issued] }
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
        header:
          type: [object, "null"]
          description: Snapshot taken at issue time; null while a draft. Never changes afterwards.
          properties:
            clinic: { type: object, properties: { name: { type: [string, "null"] }, region: { type: [string, "null"] } } }
            doctor: { type: object, properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } } }
            patient: { type: object, properties: { name: { type: string }, mrn: { type: string }, dob: { type: string, format: date }, gender: { type: string } } }
            visit: { type: object, properties: { queueEntryId: { type: string, format: uuid }, date: { type: string, format: date } } }
            issuedBy: { type: object, properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } } }
        issuedBy: { type: [string, "null"], format: uuid }
        issuedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VaccineRecordWrite:
      type: object
      required: [patientId, vaccineName, dose, route]
      properties:
        patientId: { type: string, format: uuid }
        queueEntryId: { type: [string, "null"], format: uuid }
        vaccineName: { type: string, maxLength: 200 }
        dose: { type: string, maxLength: 100 }
        route: { type: string, enum: [IM, IV, SC, infusion, oral, topical] }
        site: { type: [string, "null"], maxLength: 100 }
        lotNumber: { type: [string, "null"], maxLength: 100 }
        expiryDate: { type: [string, "null"], format: date }
        notes: { type: [string, "null"], maxLength: 1000 }
    VaccineRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        queueEntryId: { type: [string, "null"], format: uuid }
        vaccineName: { type: string }
        dose: { type: string }
        route: { type: string }
        site: { type: [string, "null"] }
        lotNumber: { type: [string, "null"] }
        expiryDate: { type: [string, "null"], format: date }
        notes: { type: [string, "null"] }
        recordedByName: { type: string }
        administeredAt: { type: string, format: date-time }
    Allergy:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        substance: { type: string }
        category: { type: [string, "null"], enum: [drug, food, environmental, other, null] }
        severity: { type: string, enum: [mild, moderate, severe] }
        reaction: { type: [string, "null"] }
        source: { type: [string, "null"], enum: [clinician, patient_reported, outside_record, null] }
        active: { type: boolean }
        recordedBy: { type: string, format: uuid }
        recordedByName: { type: [string, "null"] }
        recordedAt: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        deactivatedReason: { type: [string, "null"], description: "Why the entry was removed; null while active" }
        deactivatedAt: { type: [string, "null"], format: date-time }
        deactivatedByName: { type: [string, "null"] }
    AllergyWrite:
      type: object
      required: [substance, severity]
      properties:
        substance: { type: string, maxLength: 200 }
        category: { type: string, enum: [drug, food, environmental, other] }
        severity: { type: string, enum: [mild, moderate, severe] }
        reaction: { type: string, maxLength: 500 }
        source: { type: string, enum: [clinician, patient_reported, outside_record] }
    AllergyCorrection:
      type: object
      required: [reason]
      properties:
        substance: { type: string, maxLength: 200 }
        category: { type: string, enum: [drug, food, environmental, other] }
        severity: { type: string, enum: [mild, moderate, severe] }
        reaction: { type: string, maxLength: 500 }
        source: { type: string, enum: [clinician, patient_reported, outside_record] }
        reason: { type: string, maxLength: 500 }
    AllergyEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        allergyId: { type: [string, "null"], format: uuid }
        event: { type: string }
        substance: { type: [string, "null"] }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }
        reason: { type: [string, "null"] }
        actorId: { type: string, format: uuid }
        actorName: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
    AllergyStatus:
      type: object
      properties:
        state: { type: string, enum: [recorded, none_documented, not_assessed] }
        activeCount: { type: integer }
        documentedBy: { type: [string, "null"], format: uuid }
        documentedByName: { type: [string, "null"] }
        documentedAt: { type: [string, "null"], format: date-time }
    PregnancyStatus:
      type: object
      properties:
        status: { type: string, enum: [not_documented, not_pregnant, pregnant, lactating, unknown] }
        expectedDeliveryDate: { type: [string, "null"], format: date }
        recordedBy: { type: [string, "null"], format: uuid }
        recordedByName: { type: [string, "null"] }
        recordedAt: { type: [string, "null"], format: date-time }
    RxWarningDecision:
      type: object
      required: [kind, reasonCode]
      properties:
        kind: { type: string, enum: [allergy, pregnancy, controlled] }
        reasonCode: { type: string, description: One of the codes offered in the warning's reasonOptions }
        note: { type: string, maxLength: 500 }
    PrescriptionItemWrite:
      type: object
      required: [drugName]
      properties:
        drugName: { type: string }
        dosage: { type: string }
        frequency: { type: string }
        duration: { type: string }
        instructions: { type: string }
        overrides: { type: array, items: { $ref: "#/components/schemas/RxWarningDecision" } }
        brandName: { type: [string, "null"], maxLength: 200, description: "DOC-033. Brand/product text. The safety checks (allergy, pregnancy, controlled) run on drugName AND brandName." }
        sigPattern: { type: [string, "null"], maxLength: 40, description: "DOC-033. Morning-noon-night pattern as entered, e.g. 1-0-1. `frequency` stays the free-text sig." }
        route: { type: [string, "null"], maxLength: 40, description: "DOC-033. Route as entered (oral, topical, ...); not interpreted by the server." }
        quantity: { type: [number, "null"], exclusiveMinimum: 0, description: "DOC-033. Quantity to dispense, as entered by the doctor; never derived or converted by the server." }
        quantityUnit: { type: [string, "null"], maxLength: 40, description: "DOC-033. Unit of quantity as entered (tablets, ml, ...); never converted." }
    DrugSuggestion:
      type: object
      description: "DOC-033. A type-ahead suggestion from the tenant's own data. Not a clinical formulary: no dose, strength or class."
      properties:
        name: { type: string }
        source: { type: string, enum: [pharmacy, history], description: "pharmacy = the tenant's pharmacy item master; history = a name this tenant has prescribed before" }
        code: { type: [string, "null"], description: "Pharmacy item code (pharmacy only)" }
        inStock: { type: [boolean, "null"] }
        prescriptionOnly: { type: [boolean, "null"] }
    FavouriteRxSet:
      type: object
      description: "DOC-035. scope is relative to the caller. staleCheckAvailable false = the tenant has no active pharmacy items, so staleness is unknown (staleItemCount 0 does not mean up to date)."
      properties:
        id: { type: string, format: uuid }
        doctorId: { type: [string, "null"], format: uuid, description: "null = clinic standard" }
        ownerName: { type: [string, "null"] }
        name: { type: string }
        scope: { type: string, enum: [mine, shared, standard] }
        shared: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        staleCheckAvailable: { type: boolean }
        staleItemCount: { type: integer }
        canEdit: { type: boolean, description: "caller is the owner or holds clinical:approve" }
        items:
          type: array
          items:
            type: object
            properties:
              drugName: { type: string }
              dosage: { type: [string, "null"] }
              frequency: { type: [string, "null"] }
              duration: { type: [string, "null"] }
              instructions: { type: [string, "null"] }
              brandName: { type: [string, "null"] }
              sigPattern: { type: [string, "null"] }
              route: { type: [string, "null"] }
              quantity: { type: [number, "null"] }
              quantityUnit: { type: [string, "null"] }
              stale: { type: [boolean, "null"] }
    RxWarning:
      type: object
      properties:
        kind: { type: string, enum: [allergy, pregnancy, controlled] }
        severity: { type: string, description: "mild|moderate|severe for allergies, caution otherwise" }
        message: { type: string }
        matched: { type: [string, "null"] }
        requiresDecision: { type: boolean }
        resolved: { type: boolean }
        reasonOptions:
          type: array
          items: { type: object, properties: { code: { type: string }, label: { type: string } } }
        decision:
          type: [object, "null"]
          properties:
            kind: { type: string }
            reasonCode: { type: string }
            reasonLabel: { type: string }
            note: { type: [string, "null"] }
            by: { type: string, format: uuid }
            byName: { type: [string, "null"] }
            at: { type: string, format: date-time }
    PrescriptionWarning:
      type: object
      required: [itemIndex, kind, severity, message]
      properties:
        itemIndex: { type: integer, minimum: 0, description: "0-based index into the response's items" }
        kind: { type: string, enum: [allergy, pregnancy, controlled], description: "pregnancy also covers lactation. Each kind that requires a decision uses the same items[].overrides[] reason flow and is audited with warningKind (DOC-032)." }
        severity: { type: string, enum: [mild, moderate, severe, caution], description: "mild|moderate|severe for allergies; caution for pregnancy/controlled (severe when raised by a recorded pregnant/lactating status)" }
        message: { type: string }
    PrescriptionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        drugName: { type: string }
        dosage: { type: [string, "null"] }
        frequency: { type: [string, "null"] }
        duration: { type: [string, "null"] }
        instructions: { type: [string, "null"] }
        allergyOverrideReason: { type: [string, "null"] }
        displayOrder: { type: integer }
        allergyWarning: { type: [string, "null"] }
        pregnancyWarning: { type: [string, "null"] }
        controlledSubstanceWarning: { type: [string, "null"] }
        warnings: { type: array, items: { $ref: "#/components/schemas/RxWarning" } }
        brandName: { type: [string, "null"] }
        sigPattern: { type: [string, "null"] }
        route: { type: [string, "null"] }
        quantity: { type: [number, "null"] }
        quantityUnit: { type: [string, "null"] }
    PharmacySettings:
      type: object
      properties:
        mode: { type: string, enum: [external, hybrid, in_house] }
    PharmacySettingsWrite:
      type: object
      properties:
        mode: { type: string, enum: [external, hybrid, in_house] }
        reason: { type: string, minLength: 3, maxLength: 200, description: Required when mode changes. }
    PharmacyItemWrite:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1 }
        isRx: { type: boolean }
        hsnCode: { type: [string, "null"] }
        price: { type: number, minimum: 0 }
        taxRatePercent: { type: [number, "null"], minimum: 0, description: Defaults to 0 }
        stockQty: { type: [integer, "null"], minimum: 0, description: Opening stock on POST; ignored on PATCH }
    BillingCharge:
      type: object
      description: Row of the checkout / OTC charge lists (ChargeResponse).
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        baseAmount: { type: number }
        followUpAmount: { type: [number, "null"] }
        taxRatePercent: { type: number }
        stockQty: { type: [integer, "null"], description: "Units on hand; null when the item is not stock-tracked. PHA-011." }

    DispensingQueueEntry:
      type: object
      properties:
        prescriptionId: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        doctorName: { type: string }
        signedAt: { type: string, format: date-time }
        token: { type: integer, description: "The visit's queue token number (same value as QueueEntry.tokenNumber). PHA-003." }
        items:
          type: array
          items:
            type: object
            properties:
              stockQty:
                type: [integer, "null"]
                description: "Current stock of the active pharmacy item whose name equals drugName (case-insensitive); null when no stocked item matches. Prescription items carry no catalogue link, so this is a name match. PHA-003."
              drugName: { type: string }
              dosage: { type: [string, "null"] }
              frequency: { type: [string, "null"] }
              duration: { type: [string, "null"] }
              instructions: { type: [string, "null"] }
    VitalsWrite:
      type: object
      description: Every field optional; null or absent keeps the stored value. Bounds are plausibility limits, not clinical normal ranges.
      properties:
        heightCm: { type: [number, "null"], minimum: 20, maximum: 250 }
        weightKg: { type: [number, "null"], minimum: 0.2, maximum: 400 }
        bpSystolic: { type: [integer, "null"], minimum: 20, maximum: 300 }
        bpDiastolic: { type: [integer, "null"], minimum: 10, maximum: 200 }
        pulseBpm: { type: [integer, "null"], minimum: 20, maximum: 300 }
        tempCelsius: { type: [number, "null"], minimum: 20, maximum: 45 }
        spo2Percent: { type: [integer, "null"], minimum: 1, maximum: 100 }
        bloodSugar: { type: [number, "null"], exclusiveMinimum: 0, maximum: 9999.99, description: "Display unit mg/dL is a UI constant, not stored (needs clinical sign-off). No clinical range is enforced." }
        painScore: { type: [integer, "null"], minimum: 0, maximum: 10, description: "0-10 numeric rating scale; outside 0-10 is 400." }
    NursingWorklist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [entry, patient, vitals]
            properties:
              entry: { $ref: "#/components/schemas/QueueEntry" }
              patient: { oneOf: [{ $ref: "#/components/schemas/PatientDetail" }, { type: "null" }] }
              vitals: { oneOf: [{ $ref: "#/components/schemas/Vitals" }, { type: "null" }] }
    Vitals:
      type: object
      properties:
        id: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        heightCm: { type: [number, "null"] }
        weightKg: { type: [number, "null"] }
        bpSystolic: { type: [integer, "null"] }
        bpDiastolic: { type: [integer, "null"] }
        pulseBpm: { type: [integer, "null"] }
        tempCelsius: { type: [number, "null"] }
        spo2Percent: { type: [integer, "null"] }
        bloodSugar: { type: [number, "null"] }
        painScore: { type: [integer, "null"], minimum: 0, maximum: 10 }
        recordedBy: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
        abnormalFlags: { type: array, items: { type: string } }
    VitalsHistory:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Vitals" } }
    DoseCalculation:
      type: object
      properties:
        weightKg: { type: number }
        mgPerKg: { type: number }
        totalDoseMg: { type: number }
        ruleSource: { type: string }
        weightRecordedAt: { type: [string, "null"], format: date-time, description: When the weight used was recorded. Null when unknown (weight saved before the date was tracked); never estimated from the visit row time. Clients should treat null as stale. }
        weightStale: { type: boolean, description: "True when the weight is older than the policy window (30 days under 2 years of age, 90 days otherwise; CSO to confirm) or its date is unknown." }
    PharmacyItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isRx: { type: boolean }
        hsnCode: { type: [string, "null"] }
        price: { type: number }
        taxRatePercent: { type: number }
        stockQty: { type: integer, minimum: 0 }
        active: { type: boolean }
    PharmacyStockAdjustment:
      type: object
      required: [reason]
      description: Exactly one of delta or setTo.
      properties:
        delta: { type: [integer, "null"], minimum: -1000000, maximum: 1000000, description: Relative change; negative removes units }
        setTo: { type: [integer, "null"], minimum: 0, maximum: 10000000, description: Counted total after a stock-take }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PharmacyStockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [adjustment, dispense, restock] }
        delta: { type: integer }
        qtyBefore: { type: integer }
        qtyAfter: { type: integer }
        reason: { type: string }
        actorId: { type: [string, "null"], format: uuid }
        actorName: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
    PrescriptionPrintHeader:
      type: object
      properties:
        prescriptionId: { type: string, format: uuid }
        signedAt: { type: [string, "null"], format: date-time }
        clinicName: { type: string }
        clinicRegion: { type: string, enum: [IN, KSA] }
        clinicPhone: { type: [string, "null"], description: "Clinic WhatsApp number from clinic setup" }
        prescriberId: { type: [string, "null"], format: uuid, description: "Who signed (the visit's doctor or a clinical:approve holder)" }
        prescriberName: { type: [string, "null"] }
        professionalRegistrationNo: { type: [string, "null"], description: "From the staff record; null when not set" }
    Prescription:
      type: object
      properties:
        id: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        signedAt: { type: [string, "null"], format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/PrescriptionItem" } }
        unresolvedWarnings: { type: integer }
        warnings:
          type: array
          description: >-
            DOC-031. Flat structured allergy matches across all lines (same check as items[].warnings and the legacy
            allergyWarning strings, which are kept). Recomputed on every read. Pregnancy/lactation and controlled-substance
            warnings (DOC-032) are included too, with severity "caution"; the decision state (requiresDecision, resolved, reasonOptions, decision) is on items[].warnings.
            A severe match still blocks signing (409 warning-unresolved) until an override reason is recorded.
          items: { $ref: "#/components/schemas/PrescriptionWarning" }
        allergySnapshot:
          description: >-
            DOC-R3: the allergy statement captured when this prescription was signed (what the sign gate checked).
            Never recomputed, so later allergy-register changes do not alter it. Null for a draft, and null for a
            prescription signed before this snapshot existed (migration V79); a signed prescription with a null
            snapshot must be shown as "allergy status at signing not recorded", never filled from the current register.
          oneOf:
            - { $ref: "#/components/schemas/PrescriptionAllergySnapshot" }
            - { type: "null" }
    PrescriptionAllergySnapshot:
      type: object
      required: [state, allergies]
      properties:
        state:
          type: string
          enum: [recorded, none_documented, not_assessed]
          description: Same meaning as AllergyStatus.state, at the moment of signing.
        allergies:
          type: array
          description: Active register entries at signing (empty unless state is recorded).
          items:
            type: object
            properties:
              substance: { type: string }
              severity: { type: string }
              reaction: { type: [string, "null"] }
        documentedBy: { type: [string, "null"], format: uuid, description: "Who documented no known allergies; null unless none_documented" }
        documentedByName: { type: [string, "null"] }
        documentedAt: { type: [string, "null"], format: date-time }
    Problem:
      type: object
      description: RFC 7807
      properties:
        type: { type: string, format: uri, example: "https://api.nabd.health/errors/validation-failed" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        traceId: { type: string }
        retryAfterSeconds: { type: integer, description: "423 account-locked only" }
        code: { type: string, description: "Stable machine code on 503s (DB_TIMEOUT, DB_UNAVAILABLE); absent elsewhere", example: DB_TIMEOUT }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PlatformAuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: [string, "null"], format: uuid, description: "null = platform-scope event (no single clinic; V126 platform chain)" }
        tenantName: { type: [string, "null"] }
        tenantSlug: { type: [string, "null"] }
        actorType: { type: string, enum: [staff, operator, system] }
        actorId: { type: [string, "null"], format: uuid }
        actorName: { type: string }
        actorRole: { type: string }
        ipAddress: { type: [string, "null"] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, "null"], format: uuid }
        before: { description: Prior state as stored (JSON), null for a create }
        after: { description: New state as stored (JSON), null for a delete }
        createdAt: { type: string, format: date-time }
    PageMeta:
      type: object
      properties:
        nextCursor: { type: [string, "null"] }
        limit: { type: integer }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }

    PendingWorkspaceToken:
      type: object
      description: Not a session — only usable against /owners/me/workspaces and /owners/workspaces/select.
      properties:
        pendingToken: { type: string }
        expiresIn: { type: integer, example: 300 }

    ClinicSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        region: { type: string, enum: [IN, KSA] }
        status: { type: string, enum: [provisioning, trialing, active, overdue, suspended, offboarding, offboarded] }

    BrandWorkspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        clinics: { type: array, items: { $ref: "#/components/schemas/ClinicSummary" } }

    WorkspaceList:
      type: object
      properties:
        brands: { type: array, items: { $ref: "#/components/schemas/BrandWorkspace" } }

    MfaChallenge:
      type: object
      properties:
        challengeId: { type: string, description: "Opaque signed token, not a UUID" }
        method: { type: string, enum: [totp, sms] }
        expiresIn: { type: integer, example: 300 }

    StepUpToken:
      type: object
      properties:
        stepUpToken: { type: string }
        expiresIn: { type: integer, example: 300 }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        device: { type: string }
        ip: { type: string }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }

    StaffInviteRequest:
      type: object
      required: [email, name, mobilePhone, roleId]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        mobilePhone: { type: string, description: "Required for WhatsApp OTP login and mobile verification (NB-041)" }
        roleId: { type: string, format: uuid }
        scope: { type: string, enum: [own_patients_only, all_clinic_patients], default: all_clinic_patients }

    StaffPatch:
      type: object
      properties:
        roleId: { type: string, format: uuid }
        scope: { type: string, enum: [own_patients_only, all_clinic_patients] }
        fieldGrants:
          type: array
          items: { type: string, example: "no_financial_fields" }
        departmentId: { type: [string, "null"], format: uuid }
        professionalRegistrationNo:
          type: [string, "null"]
          pattern: "^$|^[A-Za-z0-9][A-Za-z0-9 ./-]{0,39}$"
          description: "DOC-N1. Omitted/null = unchanged; empty string = clear; otherwise 1-40 characters of letters, digits, space . / -. Audited (the audit row records set/changed/cleared, not the value). Requires staff:edit."

    Staff:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        mobilePhone: { type: [string, "null"] }
        roleId: { type: string, format: uuid }
        status: { type: string, enum: [invited, active, suspended] }
        scope: { type: string, enum: [own_patients_only, all_clinic_patients] }
        emailVerified: { type: boolean }
        mobileVerified: { type: boolean, description: "Patient data is unreachable until both this and emailVerified are true (NB-041)" }
        lastSeenAt: { type: [string, "null"], format: date-time }
        professionalRegistrationNo: { type: [string, "null"], description: "DOC-N1. Medical council / SCFHS registration number; null when not set" }
        loginMethod:
          type: string
          readOnly: true
          enum: [owner_account, invite_pending, authenticator, authenticator_setup_required, pin_or_whatsapp_otp, pin, whatsapp_otp, none]
          description: >
            OWN-034. Derived from stored credentials, first match wins: owner_account (Owner-linked row; signs in
            through /owners/auth/login with the Owner's email + PIN), invite_pending (invite not accepted), authenticator
            (MFA enrolled; every sign-in ends with a TOTP code), authenticator_setup_required (role requires MFA, not yet
            enrolled; next sign-in forces enrolment), then the first factors available: pin_or_whatsapp_otp, pin,
            whatsapp_otp, none. Which first factor was actually used at a sign-in is not recorded, so it is never guessed.
            Independent of status (a suspended account keeps its method but cannot sign in).
        loginFactors:
          type: array
          readOnly: true
          items: { type: string, enum: [pin, whatsapp_otp, authenticator] }
          description: "OWN-034. Factors this staff row can use: pin (PIN set), whatsapp_otp (mobile on file), authenticator (MFA enrolled). Empty for invite_pending and owner_account."

    RoleWrite:
      type: object
      required: [name, grants]
      properties:
        name: { type: string }
        grants:
          type: array
          description: One entry per module the role touches
          items: { $ref: "#/components/schemas/ModuleGrant" }

    Role:
      allOf:
        - $ref: "#/components/schemas/RoleWrite"
        - type: object
          properties:
            id: { type: string, format: uuid }
            builtIn: { type: boolean }

    ModuleGrant:
      type: object
      required: [module]
      properties:
        module:
          type: string
          enum: [patients, queue, clinical, billing, packages, pharmacy, reports, staff, setup, compliance]
        view: { type: boolean, default: false }
        create: { type: boolean, default: false }
        edit: { type: boolean, default: false }
        delete: { type: boolean, default: false }
        approve: { type: boolean, default: false }
        refundDiscount:
          type: boolean
          default: false
          description: On the billing module this also puts the string `billing.discount` in the JWT/session permissions list; POST /v1/billing/checkout/{queueEntryId} and /v1/billing/otc-checkout return 403 (discount-not-permitted) for a non-zero discount without it.
        export: { type: boolean, default: false }
        breakGlass: { type: boolean, default: false, description: "Only on module clinical: puts clinical:breakGlass in the permissions list (PLT-012)" }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        region: { type: string, enum: [IN, KSA] }
        plan: { type: string }
        status: { type: string, enum: [provisioning, trialing, active, overdue, suspended, offboarding, offboarded] }

    BranchWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }

    Branch:
      allOf:
        - $ref: "#/components/schemas/BranchWrite"
        - type: object
          properties: { id: { type: string, format: uuid } }

    PatientWrite:
      type: object
      required: [name, phone, dob, gender]
      properties:
        name: { type: string, description: "Stored/searched as-entered; any script" }
        phone: { type: string }
        dob: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        guardianId: { type: [string, "null"], format: uuid, description: "Required if patient is a minor" }
        address: { type: string }
        nationalId:
          type: [string, "null"]
          description: "Aadhaar/Iqama — column-level encrypted at rest (NB-140), never returned in list responses"
        confirmedNotDuplicate:
          type: [boolean, "null"]
          description: "Set after staff reviewed the 409 duplicate candidates and confirmed this is a different person; skips the duplicate check"
        guardianConsent:
          type: object
          description: >
            CGV-005. Required whenever guardianId is supplied, else 400 `guardian-consent-required`
            (also when confirmed is not true or channel is not one of the listed values). Stored with the
            guardian_access consent (captured_by = calling staff, capture_channel, granted_at) and audited
            in `patient.guardian_grant` (consentChannel). PATCH guardian changes are unchanged.
          required: [confirmed, channel]
          properties:
            confirmed: { type: boolean, description: "Must be true" }
            channel: { type: string, enum: [in_person, phone, written] }

    PatientPatch:
      type: object
      description: >
        True partial update. Only properties present in the body are written; absent ones are left
        unchanged (so revoking a guardian is {"guardianId": null} and cannot touch address/nationalId).
        guardianId, address and nationalId accept an explicit null to clear. name/phone/dob/gender
        cannot be null. A minor (computed from the resulting dob) must keep a guardian.
        A blank ("" or whitespace) address or nationalId is 400 validation-failed: clear with an explicit null, never with an empty string.
      properties:
        name: { type: string }
        phone: { type: string }
        dob: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        guardianId: { type: [string, "null"], format: uuid }
        address: { type: [string, "null"] }
        nationalId: { type: [string, "null"], description: "Column-level encrypted at rest; never returned" }

    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        mrn: { type: string }
        name: { type: string }
        phone: { type: string }
        dob: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        status: { type: string, enum: [active, merged] }

    PatientDetail:
      allOf:
        - $ref: "#/components/schemas/Patient"
        - type: object
          properties:
            allergies: { type: array, items: { type: string } }
            chronicConditions: { type: array, items: { type: string } }
            activePackages: { type: integer }
            outstandingBalance: { type: number }
            lastVisit: { type: [string, "null"], format: date, description: "LIVE-03: last visit, SAME definition as PatientRegistryRow.lastVisit — the latest queue_date (tenant-local day) of any queue entry for this patient whose status is not no_show (a visit in progress today counts). Omitted when the patient has no such entry. Use this for display." }
            lastVisitAt: { type: [string, "null"], format: date-time, deprecated: true, description: "NB-074, deprecated by LIVE-03: updated_at of the latest COMPLETED queue entry — a different definition from lastVisit / the registry; do not display alongside the registry value." }
            guardianReviewKeptAt: { type: [string, "null"], format: date-time, description: "CGV-002: when staff chose keep-proxy at the age-18 review; cleared if the guardian changes" }

    PatientRegistryRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        mrn: { type: string }
        name: { type: string }
        phone: { type: string }
        age: { type: integer }
        gender: { type: string }
        minor: { type: boolean }
        lastVisit: { type: [string, "null"], format: date, description: "LIVE-03: latest queue_date (tenant-local day) of any queue entry for this patient whose status is not no_show; same definition as PatientDetail.lastVisit" }
        nextAppointment: { type: [string, "null"], format: date-time }
        nextDoctorName: { type: [string, "null"] }
        nextDoctorId: { type: [string, "null"], format: uuid }
        nextAppointmentId: { type: [string, "null"], format: uuid }
        nextAppointmentToday: { type: boolean }
        packageSessionsUsed: { type: [integer, "null"] }
        packageSessionsTotal: { type: [integer, "null"] }
        condition: { type: [string, "null"] }
        followUpDue: { type: boolean }
        allergy: { type: [string, "null"] }
        balanceDue: { type: boolean }
        duplicate: { type: boolean }
        archived: { type: boolean }
        queueToken: { type: [integer, "null"] }
        queueStatus: { type: [string, "null"] }
        tags: { type: array, items: { type: string, enum: [recent, followup, package, balance, duplicate, archived] } }

    PatientMatchCandidate:
      type: object
      description: >
        A likely duplicate returned with the 409 on registration. Never carries the national ID
        (it is not compared and not returned).
      properties:
        patientId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        matchScore:
          type: number
          minimum: 0
          maximum: 1
          description: >
            0..1, not a percentage. 1.0 when the mobile number matches (digits only); otherwise the
            trigram similarity of the names when the date of birth matches. Candidates are returned
            highest score first (at most 5).
        matchedFields:
          type: array
          description: >
            REC-038: which compared fields agreed, in this order: phone (same digits), dob (same date),
            name (trigram similarity above 0.3). Only these three fields are compared.
          items: { type: string, enum: [phone, dob, name] }

    WorkingHoursWrite:
