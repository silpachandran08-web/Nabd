      responses:
        "200": { description: "Import job", content: { application/json: { schema: { $ref: "#/components/schemas/ImportJob" } } } }

  /setup/import-jobs/{id}/mapping:
    put:
      tags: [Setup]
      summary: Save the column mapping and re-run the dry run (ADM-012)
      description: Only while the job is at the review step (status dry_run), else 409 DIFF_STALE. 422 REQUIRED_FIELD_UNMAPPED unless name, mobile, dob and sex are mapped. Nothing is written to patients.
      x-required-permission: setup:edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ImportMappingRequest" } } }
      responses:
        "200": { description: "Dry-run diff and a sample", content: { application/json: { schema: { $ref: "#/components/schemas/ImportMappingResponse" } } } }

  /setup/import-jobs/{id}/commit:
    post:
      tags: [Setup]
      summary: Commit the dry-run result (ADM-012)
      description: Runs in the background in chunks of 500, each chunk one transaction, resumable. Possible duplicates without a decision are skipped. 409 DIFF_STALE unless the job is at the review step or a decision names a row that is not a duplicate.
      x-required-permission: setup:edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ImportCommitRequest" } } }
      responses:
        "202": { description: "Accepted", content: { application/json: { schema: { $ref: "#/components/schemas/ImportCommitResponse" } } } }

  /setup/import-jobs/{id}/duplicates:
    get:
      tags: [Setup]
      summary: Possible duplicates of the dry run, keyed by file row (ADM-012)
      x-required-permission: setup:edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: afterRow, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: "Page of possible duplicates", content: { application/json: { schema: { $ref: "#/components/schemas/ImportDuplicatePage" } } } }

  /setup/import-jobs/{id}/errors.csv:
    get:
      tags: [Setup]
      summary: Download the error report of the dry run (row, code, reason) (ADM-012)
      x-required-permission: setup:edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "CSV", content: { text/csv: { schema: { type: string } } } }

  /setup/export-jobs:
    get:
      tags: [Setup]
      summary: List recent export jobs
      x-required-permission: setup:view
      responses:
        "200": { description: "Export jobs", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ExportJob" } } } } }
    post:
      tags: [Setup]
      summary: Create a self-serve export job
      x-required-permission: setup:view
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExportJobRequest" } } }
      responses:
        "201": { description: "Created export job", content: { application/json: { schema: { $ref: "#/components/schemas/ExportJob" } } } }

  /setup/licences:
    get:
      tags: [Setup]
      summary: Facility & clinician licence registry
      x-required-permission: setup:view
      responses:
        "200": { description: "Licences", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Licence" } } } } }
    post:
      tags: [Setup]
      summary: Add a licence
      x-required-permission: setup:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LicenceWrite" } } }
      responses:
        "201": { description: "Created licence", content: { application/json: { schema: { $ref: "#/components/schemas/Licence" } } } }

  /compliance/health:
    get:
      tags: [Setup]
      summary: Compliance health (licence counts and attention items)
      description: Built only from licence_registry (expiringSoon = expiry within 30 days inclusive, expired = past expiry, judged at read time). Consent-template and retention items are not returned until those tables exist.
      x-required-permission: setup:view
      responses:
        "200":
          description: Compliance health
          content:
            application/json:
              schema:
                type: object
                required: [licences, items]
                properties:
                  licences:
                    type: object
                    required: [total, expiringSoon, expired]
                    properties: { total: { type: integer }, expiringSoon: { type: integer }, expired: { type: integer } }
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, label, status, detail, link]
                      properties:
                        kind: { type: string, enum: [licence, consent_template, retention] }
                        label: { type: string }
                        status: { type: string, enum: [ok, attention, expired] }
                        detail: { type: string }
                        link: { type: string, example: "/setup?tab=licences" }

  /setup/licences/{id}:
    patch:
      tags: [Setup]
      summary: Update a licence
      x-required-permission: setup:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LicenceWrite" } } }
      responses:
        "200": { description: "Updated licence", content: { application/json: { schema: { $ref: "#/components/schemas/Licence" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /setup/staff:
    get:
      tags: [Setup]
      summary: Active staff list helper for shift/licence forms
      x-required-permission: setup:view
      responses:
        "200": { description: "Active staff", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StaffSummary" } } } } }

  # ------------------------------------------------------------ Patients
  /patients:
    get:
      tags: [Patients]
      summary: List/search patients (row-scoped — a doctor with "own patients only" sees only their own)
      x-required-permission: patients:view
      parameters:
        - name: q
          in: query
          description: >
            OPS-009 index-assisted search: phone prefix (national number, e.g. 98123 for +91 98123 45678), MRN (exact, or
            prefix from 3 characters) or name (any script; Arabic diacritics and alef/yaa/taa-marbuta variants fold).
            Ranked phone, MRN, name; top-N, no cursor. limit is 1..50 when q is given.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/PatientPage" }
        "400": { description: "With q: code QUERY_TOO_SHORT (under 3 characters and not an exact MRN) or INVALID_LIMIT (limit outside 1..50)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Patients]
      summary: Register a patient
      x-required-permission: patients:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatientWrite" } } }
      responses:
        "201": { description: "Patient", content: { application/json: { schema: { $ref: "#/components/schemas/Patient" } } } }
        "400": { description: "validation-failed (incl. ACC-028 phone: not a valid number for the clinic country, `errors[{field: phone}]`, code INVALID_PHONE), guardian-required, guardian-not-found, or guardian-consent-required (guardianId without a valid guardianConsent)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409":
          description: >
            Likely-duplicate match found (same phone digits, or same DOB + similar name) — client should
            offer merge instead of blind create, or resend with confirmedNotDuplicate=true after review.
            Each candidate carries matchScore (0..1) and matchedFields.
          content: { application/json: { schema: { type: object, properties: { candidates: { type: array, items: { $ref: "#/components/schemas/PatientMatchCandidate" } } } } } }

  /patients/data-quality:
    get:
      tags: [Patients]
      summary: Records needing correction (ACC-028)
      description: >
        issue=phone lists active patients whose stored phone failed per-country validation (phone_invalid, set by the
        ACC-028 re-normalisation job); rawPhone is the stored value unchanged. Saving a valid phone (PATCH) removes the
        row. Consent- and row-scope-gated like every patient read; ordered by patientId; `nextCursor` is opaque.
      x-required-permission: patients:edit
      parameters:
        - { name: issue, in: query, required: true, schema: { type: string, enum: [phone] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Data-quality page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [patientId, displayName, rawPhone]
                      properties:
                        patientId: { type: string, format: uuid }
                        displayName: { type: string }
                        rawPhone: { type: string }
                  nextCursor: { type: string, nullable: true }
        "400":
          description: Unknown issue or limit (`validation-failed` / `validation`), malformed cursor (`invalid-cursor`)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /patients/registry:
    get:
      tags: [Patients]
      summary: Patient Registry rows with per-filter counts, search and paging (REC-040)
      description: >
        Rows for the selected filter, narrowed by `q` (name, MRN, 3+ mobile digits, or today's token
        such as `T-12`), ordered by name then id. Consent- and row-scope-gated like every patient read.
        `total` and `counts` ignore `q` and paging; `matchedTotal` is the number of rows matching filter + q
        before paging. A call without `limit`/`cursor` returns the first 200 rows. `cursor` is an opaque keyset
        on (name, id) (OPS-008): pass `page.nextCursor` back unchanged with the same `q`/`filter`; rows registered
        between pages are never repeated or skipped. Read from the patient_registry_summary read model (no cap):
        a write shows within seconds; a duplicate partner's flag is set by the nightly duplicate job.
      x-required-permission: patients:view
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: filter, in: query, required: false, schema: { type: string, enum: [all, recent, followup, package, balance, duplicate, archived], default: all } }
        - { name: limit, in: query, required: false, description: "1..200, default 200; out of range is a 400 validation problem with code INVALID_LIMIT", schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Registry page
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: "Non-archived patients (same as counts.all)" }
                  counts: { type: object, additionalProperties: { type: integer }, description: "One count per filter key" }
                  rows: { type: array, items: { $ref: "#/components/schemas/PatientRegistryRow" } }
                  matchedTotal: { type: integer, description: "Rows matching filter + q before paging (REC-040)" }
                  hasMore: { type: boolean, description: "True when page.nextCursor fetches another page (REC-040)" }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400":
          description: Invalid filter (`invalid-filter`), limit outside 1..200 (`validation`, code `INVALID_LIMIT`) or malformed cursor (`invalid-cursor`)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /patients/batch:
    get:
      tags: [Patients]
      summary: Patient 360 for up to 100 ids in one call (FEF-016); unknown or out-of-scope ids are absent
      x-required-permission: patients:view
      parameters:
        - { name: ids, in: query, required: true, schema: { type: array, maxItems: 100, items: { type: string, format: uuid } }, style: form, explode: false }
      responses:
        "200": { description: "PatientDetail list", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PatientDetail" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Patient 360 (identity, allergies, active packages, balance, last visit)
      x-required-permission: patients:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "PatientDetail", content: { application/json: { schema: { $ref: "#/components/schemas/PatientDetail" } } } }
        "404":
          description: >
            Not found OR exists but out of the caller's row-level scope
            (e.g. another doctor's patient) — always 404, never 403, so an
            ID probe can't be used to confirm a patient exists (NB-041).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    patch:
      tags: [Patients]
      summary: Partial update — absent properties are left unchanged, explicit null clears guardianId/address/nationalId
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PatientPatch" } } }
      responses:
        "200": { description: "Patient", content: { application/json: { schema: { $ref: "#/components/schemas/Patient" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{patientId}/messages:
    get:
      tags: [Patients]
      summary: Message history with delivery status, newest first (COM-006). Template name, plain-language purpose, status, time, failure reason; never the rendered body or the phone number. PHI read logged.
      x-required-permission: patients:view
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        channel: { type: string, enum: [whatsapp] }
                        purpose: { type: string }
                        templateName: { type: string }
                        status: { type: string, enum: [scheduled, queued, sending, sent, delivered, read, failed, blocked, cancelled, expired] }
                        statusAt: { type: string, format: date-time }
                        failureReason: { type: string, nullable: true, description: "Plain words, e.g. Not on WhatsApp, Opted out, Template paused by Meta; only for failed or blocked" }
                        fallbackOf: { type: string, format: uuid, nullable: true, description: "Reserved for the SMS fallback (COM-027)" }
                  nextCursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{id}/merge:
    post:
      tags: [Patients]
      summary: Merge a duplicate into this patient (supervisor action, reversible for 30 days)
      x-required-permission: patients:delete
      x-step-up: true
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicatePatientId]
              properties:
                duplicatePatientId: { type: string, format: uuid }
      responses:
        "200": { description: "PatientDetail", content: { application/json: { schema: { $ref: "#/components/schemas/PatientDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/merges/{mergeId}/undo:
    post:
      tags: [Patients]
      summary: Reverse a merge — only within its 30-day window (NB-072)
      x-required-permission: patients:delete
      x-step-up: true
      parameters:
        - name: mergeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Reversed }
        "404": { description: "Merge doesn't exist or was already reversed", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "UNDO_WINDOW_PASSED: the merge is older than 30 days (ACC-030)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /patients/by-phone:
    get:
      tags: [Patients]
      summary: Household lookup — patients with this phone plus patients whose guardian has it (ACC-029)
      x-required-permission: patients:view
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Household
          content:
            application/json:
              schema:
                type: object
                required: [household]
                properties:
                  household:
                    type: array
                    items:
                      type: object
                      required: [patientId, displayName, age, sex, relation]
                      properties:
                        patientId: { type: string, format: uuid }
                        displayName: { type: string }
                        age: { type: integer }
                        sex: { type: string }
                        relation: { type: string, enum: [guardian, child, member] }
                        lastVisitAt: { type: string, format: date-time, nullable: true }
                        guardianId: { type: string, format: uuid, nullable: true }
        "400": { description: "INVALID_PHONE", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /patients/duplicate-suggestions:
    get:
      tags: [Patients]
      summary: Likely duplicate pairs with the fields that matched (ACC-030)
      x-required-permission: patients:delete
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Suggestions page (a page may be empty while nextCursor is set)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  nextCursor: { type: string, nullable: true }
                  items:
                    type: array
                    items:
                      type: object
                      required: [suggestionId, a, b, score, matchedFields]
                      properties:
                        suggestionId: { type: string }
                        a: { $ref: "#/components/schemas/DuplicateBrief" }
                        b: { $ref: "#/components/schemas/DuplicateBrief" }
                        score: { type: number }
                        matchedFields: { type: array, items: { type: string, enum: [phone, name, dob] } }

  /patients/merges:
    get:
      tags: [Patients]
      summary: Merges still inside the 30-day undo window (ACC-030)
      x-required-permission: patients:delete
      responses:
        "200":
          description: Recent merges, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [mergeId, mergedAt, undoUntil, duplicate, survivor]
                      properties:
                        mergeId: { type: string, format: uuid }
                        mergedAt: { type: string, format: date-time }
                        undoUntil: { type: string, format: date-time }
                        duplicate: { $ref: "#/components/schemas/DuplicateBrief" }
                        survivor: { $ref: "#/components/schemas/DuplicateBrief" }

  /patients/duplicate-suggestions/{id}/dismiss:
    post:
      tags: [Patients]
      summary: Dismiss a suggestion until a matched field changes (ACC-030)
      x-required-permission: patients:delete
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Dismissed }
        "404": { description: "No longer a suggestion", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /patients/{id}/guardian:
    delete:
      tags: [Patients]
      summary: Revoke the patient's guardian — clears guardian_id and withdraws guardian_access consent only; address and national ID are untouched (CGV-001)
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Revoked (also returned when no guardian was on file)" }
        "400": { description: "guardian-required: the patient is still a minor", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{id}/guardian/review:
    post:
      tags: [Patients]
      summary: Age-18 guardian review outcome "keep proxy" — marks the review done (patient leaves guardian-reviews-due), keeps guardian and consent; audited patient.guardian_review_kept (CGV-002). Revoke is DELETE /patients/{id}/guardian.
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [keep] }
      responses:
        "200": { description: "Refreshed patient detail incl. guardianReviewKeptAt", content: { application/json: { schema: { $ref: "#/components/schemas/PatientDetail" } } } }
        "400": { description: "validation, or guardian-review-not-due (still a minor / no guardian on file)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patients/{id}/consent/withdraw:
    post:
      tags: [Patients]
      summary: Withdraw a consent — removes the patient from every consent-gated read path immediately (NB-053)
      x-required-permission: patients:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                consentType: { type: string, enum: [treatment, data_processing, messaging], default: data_processing }
      responses:
        "204": { description: Withdrawn }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- Queue
  /doctors/{id}/working-hours:
    get:
      tags: [Queue]
      summary: Weekly recurring availability template for a doctor
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Working hours", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkingHours" } } } } }
    post:
      tags: [Queue]
      x-required-permission: "hasAuthority('setup:edit') or authentication.name == #id.toString()"
      description: "DOC-R7: allowed when the caller IS doctor {id} (JWT subject), or holds setup:edit. queue:edit alone is not enough for another doctor's hours. Audited."
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHoursWrite" } } }
      responses:
        "201": { description: "Working hours block created", content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHours" } } } }
        "400": { description: "Validation error; type ends in hours-overlap when the block overlaps another block of this doctor on the same weekday (blocks are half-open, so 09:00-12:00 and 12:00-14:00 do not overlap), or invalid-time-range when endTime is not after startTime", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Caller is neither doctor {id} nor holds setup:edit" }

  /doctors/{id}/working-hours/{hoursId}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - { name: hoursId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Queue]
      summary: Replace one working-hours block of this doctor
      x-required-permission: "hasAuthority('setup:edit') or authentication.name == #id.toString()"
      description: "DOC-R7: allowed when the caller IS doctor {id} (JWT subject), or holds setup:edit. queue:edit alone is not enough for another doctor's hours. Audited."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHoursWrite" } } }
      responses:
        "200": { description: "Updated block", content: { application/json: { schema: { $ref: "#/components/schemas/WorkingHours" } } } }
        "400": { description: "Validation error; type ends in hours-overlap when the block overlaps another block of this doctor on the same weekday (blocks are half-open, so 09:00-12:00 and 12:00-14:00 do not overlap), or invalid-time-range when endTime is not after startTime", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Caller is neither doctor {id} nor holds setup:edit" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Queue]
      summary: Delete one working-hours block of this doctor (existing appointments are not touched)
      x-required-permission: "hasAuthority('setup:edit') or authentication.name == #id.toString()"
      description: "DOC-R7: allowed when the caller IS doctor {id} (JWT subject), or holds setup:edit. queue:edit alone is not enough for another doctor's hours. Audited."
      responses:
        "204": { description: Deleted }
        "403": { description: "Caller is neither doctor {id} nor holds setup:edit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /doctors/{id}/session:
    get:
      tags: [Queue]
      summary: "The doctor's session state today (ACC-015): in, paused or out"
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "State; sessionId and since are null when no session was started today", content: { application/json: { schema: { $ref: "#/components/schemas/DoctorSession" } } } }

  /doctors/{id}/session/{action}:
    post:
      tags: [Queue]
      summary: "Start, pause, resume or end the doctor's session (ACC-015)"
      x-required-permission: "hasAuthority('queue:edit') and (authentication.name == #id.toString() or hasAuthority('setup:edit'))"
      description: "Own doctor with queue:edit, or a caller who also holds setup:edit (queue:manage does not exist). Audited; publishes scheduling.doctor_status.changed.v1. The first in_consult of the day starts a session implicitly."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/PathId" }
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, pause, resume, end] } }
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { reasonCode: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" } } } } }
      responses:
        "200": { description: "New state", content: { application/json: { schema: { $ref: "#/components/schemas/DoctorSession" } } } }
        "403": { description: "Not the own doctor and no setup:edit" }
        "409": { description: "Problem `invalid-session-state` (code INVALID_SESSION_STATE)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /doctors/{id}/leave:
    get:
      tags: [Queue]
      summary: Blocked date ranges for a doctor (leave)
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Leave ranges", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DoctorLeave" } } } } }
    post:
      tags: [Queue]
      summary: "Block a date range; existing bookings in that range are not auto-cancelled (NB-074 — reschedule flagging deferred)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DoctorLeaveWrite" } } }
      responses:
        "201": { description: "Leave recorded", content: { application/json: { schema: { $ref: "#/components/schemas/DoctorLeave" } } } }

  /doctors/{id}/delay:
    get:
      tags: [Queue]
      summary: "Delay history (latest 20); a delay from an earlier clinic day is listed with active=false (lapsed) (ACC-001)"
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Delays", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DoctorDelay" } } } } }
    post:
      tags: [Queue]
      summary: "Announce a doctor delay, active until cleared or the clinic day ends (ACC-001)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DelayAnnounceRequest" } } }
      responses:
        "201": { description: "Delay announced", content: { application/json: { schema: { $ref: "#/components/schemas/DoctorDelay" } } } }
        "400": { description: "Problem `validation-failed`: delayMinutes outside 1..240, reason over 200 chars", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Problem `delay-already-active`: a concurrent announcement for the same doctor and clinic day won", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /doctors/{id}/delay/clear:
    post:
      tags: [Queue]
      summary: Clear today's active delay (audited)
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Cleared" }
        "400": { description: "Problem `no-active-delay` (none, or only a lapsed one from an earlier day)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /doctors/{id}/availability:
    get:
      tags: [Queue]
      summary: Bookable slots for a doctor on a given date (working hours minus leave minus already-booked slots)
      x-required-permission: queue:view
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Available slot start times
          content: { application/json: { schema: { type: array, items: { type: string, format: date-time } } } }

  /appointments:
    get:
      tags: [Queue]
      x-required-permission: queue:view
      parameters:
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
                  page: { $ref: "#/components/schemas/PageMeta" }
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Queue]
      summary: "Book a slot — concurrency-safe: a DB constraint, not an app-level check, prevents double-booking (NB-067)"
      x-required-permission: queue:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentWrite" } } }
      responses:
        "201": { description: "Booked", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { description: "patient-not-found or doctor-not-found (unknown id or another clinic's)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "400": { description: "Problem `in-past`, `clinic-closed`, `doctor-on-leave`, `outside-hours` or `off-grid` (each also carries code IN_PAST, CLINIC_CLOSED, DOCTOR_ON_LEAVE, OUTSIDE_HOURS, OFF_GRID)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Problem `slot-taken` (code SLOT_TAKEN; overlapping range, DB exclusion constraint) or `session-full`", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /appointments/{id}:
    get:
      tags: [Queue]
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: "Appointment", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /appointments/{id}/cancel:
    post:
      tags: [Queue]
      summary: "Reason mandatory; slot released immediately (NB-072)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } }
      responses:
        "200": { description: "Cancelled", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Problem `appointment-arrived` (code APPOINTMENT_ARRIVED, ACC-003): the patient has checked in", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /appointments/{id}/reschedule:
    post:
      tags: [Queue]
      summary: Cancels the original and books a new slot atomically
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [newStartTime], properties: { newStartTime: { type: string, format: date-time } } }
      responses:
        "200": { description: "New appointment", content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { description: "Problem `in-past`, `clinic-closed`, `doctor-on-leave`, `outside-hours` or `off-grid` (each also carries code IN_PAST, CLINIC_CLOSED, DOCTOR_ON_LEAVE, OUTSIDE_HOURS, OFF_GRID)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Problem `slot-taken` (code SLOT_TAKEN) or `session-full`", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /departments/{id}/flow:
    get:
      tags: [Queue]
      summary: "Resolved ordered step types; the default flow (vitals, consultation) when no workflow is picked (QA-08)"
      description: "Bare array, so there is no isDefault flag; GET /departments/{id}/workflow has templateCode null when the default applies."
      x-required-permission: queue:view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: "Flow steps in order"
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { stepType: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /waitlist:
    get:
      tags: [Queue]
      summary: A doctor's waitlist, oldest join first (waiting, offered and expired entries; NB-099)
      description: Lapsed offers are closed and re-offered to the next waiting patient on read.
      x-required-permission: queue:view
      parameters:
        - { name: doctorId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Entries", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WaitlistEntry" } } } } }
    post:
      tags: [Queue]
      summary: Put a patient on a doctor's waitlist
      x-required-permission: queue:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [doctorId, patientId], properties: { doctorId: { type: string, format: uuid }, patientId: { type: string, format: uuid } } }
      responses:
        "201": { description: "Joined", content: { application/json: { schema: { $ref: "#/components/schemas/WaitlistEntry" } } } }
        "404": { description: "patient-not-found or doctor-not-found (unknown id or another clinic's)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "already-waitlisted", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /waitlist/{id}/accept:
    post:
      tags: [Queue]
      summary: Accept the offered slot, or book the entry into a slot the front desk chose (REC-028)
      description: >
        Without a body (or with slotStart null) this accepts the slot the entry was offered, exactly as
        before: 409 `offer-expired` if the 15-minute offer lapsed or was used. With `slotStart` set, the
        entry (status waiting, offered or expired) is booked into that slot after the same checks as
        POST /appointments: 400 `in-past`, `clinic-closed`, `doctor-on-leave`, `outside-hours`, `off-grid`, 409 `session-full`, 409
        `slot-taken` (doctor already booked then). A slot currently offered to another waitlisted
        patient is refused with 409 `slot-on-offer`; a booked/removed entry is 409 `waitlist-entry-closed`.
        slotStart equal to the entry's own live offer is the plain accept. If the entry held a live offer of
        a different slot, that slot is offered to the next waiting patient. Audited as
        `waitlist.booked_chosen_slot` (ids and slot only).
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slotStart: { type: [string, "null"], format: date-time, description: "Chosen slot start; omit to accept the offered slot" }
      responses:
        "200": { description: "Booked entry (status booked, bookedAppointmentId set)", content: { application/json: { schema: { $ref: "#/components/schemas/WaitlistEntry" } } } }
        "400": { description: "in-past, clinic-closed, doctor-on-leave, outside-hours or off-grid", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "offer-expired, slot-taken, slot-on-offer, session-full or waitlist-entry-closed", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /waitlist/{id}:
    delete:
      tags: [Queue]
      summary: Remove a waiting or offered entry from the waitlist
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: "Removed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /queue/check-in:
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Queue]
      summary: "Issues a token — scheduled (appointmentId given) or walk-in (patientId + doctorId only) (NB-068)"
      x-required-permission: queue:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CheckInRequest" } } }
      responses:
        "201": { description: "Queue entry created", content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "404": { description: "Problem `patient-not-found`, `doctor-not-found` (unknown or other-tenant id) or `not-found` (appointment mismatch, cancelled/completed)" }
        "409": { description: "Problem `session-full` (walk-in only): the doctor's session covering now has reached maxPatients. Occupancy = scheduled + arrived + completed appointments starting in the block + walk-in/transfer entries created in it (except no_show). Serialized per doctor-day with booking. Also `already-checked-in` (code ALREADY_CHECKED_IN, ACC-003): the appointment is already arrived (a second desk or a retry); extra members tokenNumber, queueEntryId, checkedInAt name the first check-in; no second token is issued. Also `appointment-not-today` (scheduled only): the appointment's date in the clinic timezone is not today's clinic date (ACC-001); nothing is created.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /events:
    get:
      tags: [Realtime]
      summary: "Server-sent events for staff screens (ACC-021): snapshot on connect, then {type, id, v, topic, fields} deltas, heartbeat every 25 s"
      description: |
        `event: snapshot` (data `{type, id, v, topics}`; load the boards through the normal reads, `id` is the cursor deltas continue from),
        `event: delta` (data `{type, id, v, topic, fields}`; apply when `v` is newer; the SSE `id` is the resume cursor),
        `event: heartbeat` every 25 s. Reconnect with `Last-Event-ID` within 5 minutes to replay missed deltas without a new snapshot.
        The stream ends when the access token expires, when the user's role/status changes or a session is revoked; reconnect with the current token.
        Deltas carry ids, statuses and versions only, never names.
        Per topic: queue, doctor-status, exceptions need queue:view; messages (COM-006, delivery ticks) needs patients:view; nursing needs nursing:view; requests needs scheduling:review (403 TOPIC_FORBIDDEN otherwise).
      x-required-permission: authenticated
      parameters:
        - name: topics
          in: query
          required: false
          description: "Comma list of queue, nursing, doctor-status, requests, exceptions, messages. Omitted = every topic the caller may see."
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200": { description: "text/event-stream", content: { text/event-stream: { schema: { type: string } } } }
        "400": { description: "Unknown topic (type INVALID_TOPIC)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "A requested topic needs a permission the caller lacks (type TOPIC_FORBIDDEN)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { description: "Too many open streams for this user or pod (type TOO_MANY_STREAMS)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /queue:
    get:
      tags: [Queue]
      summary: Today's queue (Arrivals screen)
      x-required-permission: queue:view
      parameters:
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: "Queue entries", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QueueEntry" } } } } }

  /queue/{id}/status:
    patch:
      tags: [Queue]
      summary: "State machine transition — illegal transitions rejected, every transition audited (NB-069)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [waiting, vitals_pending, vitals_done, in_consult, checkout_pending, no_show], description: "completed is not accepted here: only billing checkout completes a visit" }
                expectedStatus: { type: string, description: "The status the caller's screen shows (compare-and-set). Omitted only by legacy clients; the server then guards against the row it just read." }
      responses:
        "200": { description: "Updated", content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "400": { description: "Illegal transition (type illegal-transition), e.g. no_show from in_consult", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "status=completed (type completion-reserved-for-billing)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Stale screen (type stale-status): the visit is no longer in expectedStatus; the Problem carries currentStatus", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /queue/{id}/transfer:
    post:
      tags: [Queue]
      summary: "Close this leg (transferred_out) and open a new one in another department (REC-021)"
      description: "reason is required (400 transfer-reason-required) when toDepartmentId differs from the entry's current department. Stored on the new leg and audited as queue.transfer. Queue position uses POST /queue/{id}/reorder."
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toDepartmentId, doctorId]
              properties:
                toDepartmentId: { type: string, format: uuid }
                doctorId: { type: string, format: uuid }
                reason: { type: string, enum: [wrong_department, doctor_unavailable, patient_request, other] }
                reasonNote: { type: string, maxLength: 200 }
      responses:
        "200":
          description: "Both legs"
          content:
            application/json:
              schema:
                type: object
                properties:
                  closedLeg: { $ref: "#/components/schemas/QueueEntry" }
                  newLeg: { $ref: "#/components/schemas/QueueEntry" }
        "400": { description: "transfer-reason-required / transfer-not-allowed / illegal-transition", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /queue/{id}/extend:
    post:
      tags: [Queue]
      summary: "Extend the current consult by 5, 10 or 15 minutes (ACC-015); an event the ETA reads"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [minutes], properties: { minutes: { type: integer, enum: [5, 10, 15] } } } } }
      responses:
        "200": { description: "Recorded", content: { application/json: { schema: { type: object, properties: { queueEntryId: { type: string, format: uuid }, extendedBy: { type: integer } } } } } }
        "400": { description: "minutes is not 5, 10 or 15", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Problem `not-in-consult` (code NOT_IN_CONSULT)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /queue/{id}/reorder:
    post:
      tags: [Queue]
      summary: "Priority flag with mandatory reason; reorders the queue (NB-068/NB-092)"
      x-required-permission: queue:edit
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority, reason]
              properties: { priority: { type: boolean }, reason: { type: string, minLength: 3 } }
      responses:
        "200": { description: "Updated", content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- Audit
  /audit-events:
    get:
      tags: [Audit]
      summary: Search the immutable audit trail (Owner-facing, read-only)
      x-required-permission: compliance:view
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
                  page: { $ref: "#/components/schemas/PageMeta" }

  # ------------------------------------------------- Clinical (allergies, Rx)
  /clinical/encounters:
    get:
      tags: [Clinical]
      summary: The calling doctor's own encounters (visits that reached consultation), newest first (DOC-005)
      description: >
        Read-only, tenant-scoped, restricted to queue entries where doctor_id is the caller. `state`
        filters on the clinical note (none = no note yet, draft, signed, unsigned = none or draft).
        `from`/`to` filter on the clinic calendar day of the visit. Outputs are derived from the note,
        prescription and clinical documents tables; no clinical free text is returned.
        IDC-001: patients with withdrawn data_processing consent are excluded in the SQL; an unverified caller gets 403 verification-required.
      x-required-permission: clinical:view
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [none, draft, signed, unsigned] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        queueEntryId: { type: string, format: uuid }
                        patientId: { type: string, format: uuid }
                        patientName: { type: string }
                        patientMrn: { type: string }
                        queueDate: { type: string, format: date }
                        occurredAt: { type: string, format: date-time }
                        visitStatus: { type: string, enum: [in_consult, checkout_pending, completed] }
                        noteState: { type: string, enum: [none, draft, signed] }
                        noteSignedAt: { type: [string, "null"], format: date-time }
                        amendmentCount: { type: integer }
                        rxStatus: { type: string, enum: [none, draft, signed] }
                        rxItemCount: { type: integer }
                        documentsDraft: { type: integer }
                        documentsIssued: { type: integer }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "verification-required (caller email or mobile not verified) or missing permission (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /appointments/follow-ups:
    get:
      tags: [Appointments]
      summary: The calling doctor's own follow-up appointments (appointments.is_follow_up), soonest first (DOC-006)
      description: >
        Read-only, tenant-scoped, caller's own appointments only. No booking reason or reminder data exists in
        the schema; `cancelReason` is set on cancelled rows (QA-06). `from`/`to` filter on the clinic calendar day of the start time.
      x-required-permission: queue:view
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [scheduled, arrived, cancelled, completed, no_show] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        appointmentId: { type: string, format: uuid }
                        patientId: { type: string, format: uuid }
                        patientName: { type: string }
                        patientMrn: { type: string }
                        startTime: { type: string, format: date-time }
                        status: { type: string, enum: [scheduled, arrived, cancelled, completed, no_show] }
                        cancelReason: { type: string, nullable: true, description: "QA-06: set only when cancelled" }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/patients/{patientId}/timeline:
    get:
      tags: [Clinical]
      summary: "Completed visits of a patient, newest first, 5-year window (NB-115). IDC-001: consent, verification and own-patients gated"
      description: >
        Gated in SQL by ClinicalReadScope (withdrawn data_processing consent, own_patients_only via appointments OR queue
        entries). staff.field_grants without `diagnosis` return diagnosis: null on every item.
      x-required-permission: clinical:view
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        queueEntryId: { type: string, format: uuid }
                        occurredAt: { type: string, format: date-time }
                        doctorId: { type: string, format: uuid }
                        diagnosis: { type: [string, "null"], description: "null when field_grants exclude diagnosis" }
                        assessment: { type: [string, "null"] }
                        medications: { type: [string, "null"] }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "404": { $ref: "#/components/responses/PatientNotFound" }
  /clinical/notes/{queueEntryId}:
    get:
      tags: [Clinical]
      summary: "SOAP note of a visit (NB-103). IDC-001: gated through queue_entries.patient_id; diagnosis null when field_grants exclude it"
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  queueEntryId: { type: string, format: uuid }
                  patientId: { type: string, format: uuid }
                  doctorId: { type: string, format: uuid }
                  subjective: { type: [string, "null"] }
                  objective: { type: [string, "null"] }
                  assessment: { type: [string, "null"] }
                  plan: { type: [string, "null"] }
                  diagnosis: { type: [string, "null"] }
                  status: { type: string, enum: [draft, signed] }
                  signedAt: { type: [string, "null"], format: date-time }
                  updatedAt: { type: string, format: date-time }
        "404": { description: "patient-not-found (gated, see PatientNotFound) or not-found (no note yet for a visible visit)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/patients/{patientId}/allergies:
    parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: Allergy register of a patient. Active entries by default; includeInactive=true also returns removed entries (active=false, with deactivatedReason/deactivatedAt/deactivatedByName), active ones first.
      x-required-permission: clinical:view
      parameters: [{ name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Allergy" } } } } }
        "404": { $ref: "#/components/responses/PatientNotFound" }
    post:
      tags: [Clinical]
      summary: Add an allergy (fast add). Severity is mandatory; audited.
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AllergyWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Allergy" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/allergies/{id}:
    patch:
      tags: [Clinical]
      summary: Correct an allergy (partial update). A reason is mandatory; the original is kept in the append-only history. Corrections of the same allergy are serialised (row lock), so a concurrent correction can never write back an older severity; each applied correction has its own history row. An empty category is not accepted (omit the field to leave it unchanged).
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AllergyCorrection" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Allergy" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/allergies/{id}/deactivate:
    patch:
      tags: [Clinical]
      summary: Remove an allergy from the active register. A reason is mandatory (400 reason-required without one; the 500-character cap is validated, 400 validation-failed); the row and its history are kept.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        "200": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/patients/{patientId}/allergies/history:
    get:
      tags: [Clinical]
      summary: Append-only allergy history (added, corrected, removed, documented none) with reasons and actors
      x-required-permission: clinical:view
      parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AllergyEvent" } } } } }
        "404": { $ref: "#/components/responses/PatientNotFound" }
  /clinical/patients/{patientId}/allergies/status:
    parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: "Allergy status: recorded, none_documented or not_assessed (nothing recorded is NOT the same as none)"
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AllergyStatus" } } } }
        "404": { $ref: "#/components/responses/PatientNotFound" }
    put:
      tags: [Clinical]
      summary: Document "no known allergies" (who and when are stamped by the server; audited)
      x-required-permission: clinical:edit
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AllergyStatus" } } } }
  /clinical/patients/{patientId}/pregnancy-status:
    parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: "Pregnancy / lactation status. not_documented (nobody has recorded it) is NEVER the same as not_pregnant"
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PregnancyStatus" } } } }
        "404": { $ref: "#/components/responses/PatientNotFound" }
    put:
      tags: [Clinical]
      summary: Record an explicit status (who and when are stamped by the server; appended to the history and audited). Never set automatically. A recorded pregnant or lactating status escalates the prescription pregnancy warning (severity severe, a fresh decision is required); other statuses leave the existing rule unchanged. Re-sending the status and date already recorded is a no-op (no history event, no audit row, recorded by / at unchanged; the current state is returned).
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [not_pregnant, pregnant, lactating, unknown] }
                expectedDeliveryDate: { type: [string, "null"], format: date, description: "Only with status pregnant" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PregnancyStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /clinical/patients/{patientId}/pregnancy-status/history:
    get:
      tags: [Clinical]
      summary: Append-only history of recorded pregnancy / lactation statuses, newest first
      x-required-permission: clinical:view
      parameters: [{ name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    before: { type: [object, "null"], description: "{status, expectedDeliveryDate}; null for the first statement" }
                    after: { type: object }
                    actorId: { type: string, format: uuid }
                    actorName: { type: [string, "null"] }
                    occurredAt: { type: string, format: date-time }
  /clinical/drugs/search:
    get:
      tags: [Clinical]
      summary: "DOC-033. Drug name type-ahead for the prescription pad, built only from this tenant's pharmacy item master (active stocked items) and names it has prescribed before. Returns [] for q shorter than 2 characters. Names only, no PII. Not a clinical formulary; free-text entry always remains possible."
      x-required-permission: "clinical:view | clinical:edit"
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 8, minimum: 1, maximum: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DrugSuggestion" } } } } }
  /clinical/rx-sets:
    get:
      tags: [Clinical]
      summary: "DOC-035. Favourite Rx sets visible to the caller: their own, other doctors' shared sets, and clinic standards. scope is relative to the caller. Each item carries stale (true = the tenant has an active pharmacy item master and neither drug nor brand is in it; null = no master to compare with, nothing guessed)."
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FavouriteRxSet" } } } } }
    post:
      tags: [Clinical]
      summary: "Save a set. scope mine (default) | shared | standard; standard needs clinical:approve (403 rx-set-owner-only). Items keep brand, sig, route and quantity. Audited (rx_set.created)."
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, items]
              properties:
                name: { type: string, maxLength: 120 }
                scope: { type: string, enum: [mine, shared, standard] }
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PrescriptionItemWrite" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FavouriteRxSet" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: standard without clinical:approve (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/rx-sets/{setId}:
    parameters: [{ name: setId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Clinical]
      summary: "DOC-035. Rename, switch scope, or replace the items (omitted fields unchanged). Only the owner or a clinical:approve holder (clinic standards: approve only); otherwise 403 rx-set-owner-only. Another doctor's PRIVATE set is 404 for everyone, clinical:approve holders included (approve reaches shared and standard sets only). Audited (rx_set.updated)."
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                scope: { type: string, enum: [mine, shared, standard] }
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PrescriptionItemWrite" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FavouriteRxSet" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: not the owner and no clinical:approve (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Clinical]
      summary: "DOC-035. Delete a set (owner or clinical:approve; same 403 rule; another doctor's private set is 404 for everyone). Prescriptions already built from it are unaffected. Audited (rx_set.deleted)."
      x-required-permission: clinical:edit
      responses:
        "204": { description: Deleted }
        "403": { description: "Forbidden (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /clinical/prescriptions/{queueEntryId}/apply-set/{setId}:
    post:
      tags: [Clinical]
      summary: "Replace the draft with the set's items, keeping brand, sig, route and quantity. The safety checks run on every applied line (drug AND brand) exactly as for typed lines. Stamps the set's lastUsedAt. 404 for another doctor's private set."
      x-required-permission: clinical:edit
      parameters:
        - { name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: setId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}/repeat-last:
    post:
      tags: [Clinical]
      summary: "DOC-035 / DOC-R2 Repeat last prescription. Replaces the draft with the lines of this patient's most recent SIGNED prescription from another visit, keeping brand, sig, route and quantity. Earlier warning decisions are not carried over; every safety check re-runs against the current register. 404 no-previous-prescription when there is none; 409 prescription-signed when this visit's Rx is already signed. Audited (prescription.repeated_last)."
      x-required-permission: clinical:edit
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}:
    parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: Prescription with structured safety warnings per line
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
    patch:
      tags: [Clinical]
      summary: Replace the draft items. A line may carry overrides (named reason per warning kind); an omitted override for the same drug and warning is kept, never silently cleared. Anyone with clinical:edit may prepare the draft, but RECORDING a decision (an override) is limited to the visit's doctor or a holder of clinical:approve (403 not-prescriber otherwise). The save is serialised with sign and with allergy-register writes (row lock), so it can never change a signed prescription.
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/PrescriptionItemWrite" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden. 403 not-prescriber when an override is sent by someone who is neither the visit's doctor nor a clinical:approve holder (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}/print-header:
    parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: Header data for printing a SIGNED prescription (clinic, prescriber of record, professional registration number). 409 prescription-not-signed for a draft. The registration number is null when none is on file; the printout must then omit it.
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PrescriptionPrintHeader" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Prescription not signed (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/prescriptions/{queueEntryId}/sign:
    post:
      tags: [Clinical]
      summary: Sign. Only the visit's doctor or a holder of clinical:approve may sign (403 not-prescriber otherwise). CLN-005 - the caller must also be a registered clinician (staff isClinician + a registration number on file, else 403 not-licensed-clinician) with an in-date licence or an owner's unexpired override (else 403 licence-expired) and hold clinical:edit (else not-prescriber; an approve-only caller is let past the permission check so it gets the specific code). A break-glass session is refused with 403 break-glass-cannot-sign and an audit row (prescription.sign_refused). The signer and the registration number signed under are stored (signedBy, signedByRegistrationNo) and clinical.prescription.signed.v1 is published. Re-checks every warning server-side against the CURRENT register while holding the prescription row lock; 409 warning-unresolved while any allergy/pregnancy/controlled warning that needs a decision has none. After signing, the items cannot change (also enforced by a database trigger). DOC-R3 - the allergy statement checked at that moment is stored as allergySnapshot in the same update and never changes afterwards. Audited.
      x-required-permission: "clinical:edit | clinical:approve | clinical:view"
      x-permission-check: "visit doctor or clinical:approve, plus clinical:edit and CLN-005 licence (see summary)"
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Signed, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden (problem+json). not-prescriber, not-licensed-clinician, licence-expired or break-glass-cannot-sign, see summary", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Conflict (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/safety-dictionary:
    get:
      tags: [Clinical]
      summary: "CLN-004. The safety dictionary version active for the caller's tenant region (shown under Rx warnings as 'Source - <source> <label>'). No PHI. source is 'Nabd CSO dictionary' when a CSO approval is recorded for the version, else 'Nabd baseline dictionary (no CSO approval recorded)' (the v0 seed of the pre-CLN-004 code lists)."
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SafetyDictionaryActive" } } } }
        "503": { description: "No active dictionary for the region (safety-dictionary-unavailable, problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /notification-requests/{id}:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (comms-gateway service token)" }]
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Messaging]
      summary: "COM-004. Claim check: render params and recipient of a pending notification request, for the Comms Gateway (header X-Internal-Token; the tenant comes from the request row). 410 code SUBJECT_GONE when the request was cancelled (appointment cancelled or moved), blocked for missing consent, or its params were purged."
      x-required-permission: public
      parameters: [{ name: X-Internal-Token, in: header, required: true, schema: { type: string } }]
      responses:
        "200": { description: "OK: { requestId, tenantId, purpose, templateKey, language, params[], recipient{phoneE164, patientId?}, consentClass, notBefore?, notAfter? }", content: { application/json: { schema: { type: object } } } }
        "401": { description: "Missing or wrong service token (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: "SUBJECT_GONE (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /tenants/{tid}/availability:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (Patient Access Edge service token)" }]
    parameters: [{ name: tid, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Queue]
      summary: "ACC-038. Authoritative availability for the Edge projection: per doctor, one session per working-hours block per day, mode slots (free slot starts) or tokens (places left of a capped session). specialtyCode is accepted but not applied (Core has no specialty data yet). Service token aud=internal (iss https://api.nabd.health/internal) naming the tenant in its tenants claim, behind a client certificate; another tenant is 403."
      x-required-permission: authenticated
      parameters:
        - { name: doctorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: specialtyCode, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: "At most 14 days after from" }
      responses:
        "200": { description: "{ doctors: [{ doctorId, sessions: [{ id, date, mode, slots?, tokensLeft? }] }], v }", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "No client certificate, or not an aud=internal service token (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "This service identity may not act for that tenant (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /tenants/{tid}/households/{phoneHash}:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (Patient Access Edge service token)" }]
    parameters:
      - { name: tid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: phoneHash, in: path, required: true, description: "SHA-256, lower-case hex, of the verified phone's E.164 digits without +", schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    get:
      tags: [Patients]
      summary: "ACC-038. Household of a WhatsApp-verified phone: the patients registered on it plus their dependants. Returns only patientRef (opaque, per tenant), firstName, age band (0-4, 5-11, 12-17, 18-39, 40-59, 60+), relation (self, guardian, dependent) and isGuardian; never a date of birth or full name. Audited as 'patient via edge'."
      x-required-permission: authenticated
      responses:
        "200": { description: "{ members: [{ patientRef, firstName, age, relation, isGuardian }] }", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Not an aud=internal service token / no client certificate (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Tenant not allowed for this service identity (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /tenants/{tid}/appointments:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (Patient Access Edge service token)" }]
    parameters: [{ name: tid, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Queue]
      summary: "ACC-038. Book an appointment for a patient reference. Idempotency-Key (UUID) is required (400 IDEMPOTENCY_KEY_REQUIRED); a replay returns the identical status and body. Same slot rules as staff booking; the last slot raced by two patients gives one 201 and one 409 SLOT_TAKEN. Audited as 'patient via edge' with the patientRef."
      x-required-permission: authenticated
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [patientRef, doctorId, startTime], properties: { patientRef: { type: string }, doctorId: { type: string, format: uuid }, startTime: { type: string, format: date-time } } } } }
      responses:
        "201": { description: "{ appointmentId, status }", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Not an aud=internal service token / no client certificate (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Tenant not allowed, or unknown patientRef (NOT_OWNER) (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "SLOT_TAKEN (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /tenants/{tid}/appointments/{id}/{action}:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (Patient Access Edge service token)" }]
    parameters:
      - { name: tid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [confirm, reschedule, cancel] } }
    post:
      tags: [Queue]
      summary: "ACC-038. Confirm, reschedule or cancel the patient's own appointment on their behalf. reasonCode (lower-case code, 3-40 characters) is required to cancel, newStartTime to reschedule (the response then carries the new appointment id). Idempotency-Key required. Core has no separate 'confirmed' state: confirm validates ownership and status, records the confirmation in the audit trail and answers status scheduled."
      x-required-permission: authenticated
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [patientRef], properties: { patientRef: { type: string }, newStartTime: { type: string, format: date-time }, reasonCode: { type: string, pattern: "^[a-z0-9_]{3,40}$" } } } } }
      responses:
        "200": { description: "{ appointmentId, status }", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Not an aud=internal service token / no client certificate (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "Tenant not allowed, or the appointment is not this patient's (NOT_OWNER) (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "SLOT_TAKEN or APPOINTMENT_ARRIVED (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "INSIDE_CANCELLATION_WINDOW: the clinic's cancellation_window_hours policy applies (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /consents:export:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (comms-gateway service token)" }]
    get:
      tags: [Messaging]
      summary: "COM-008. Paged latest channel consent (messaging, marketing) per patient and purpose, for the Comms Gateway's nightly reconciliation (header X-Internal-Token). version is the outbox id of the latest consent.changed.v1 event (0 if none)."
      x-required-permission: public
      parameters:
        - { name: X-Internal-Token, in: header, required: true, schema: { type: string } }
        - { name: tenantId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "OK: { items: [{ patientId, purpose, granted, version, at }], nextCursor? }", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Missing or wrong service token (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/drug-knowledge-base:
    get:
      tags: [Clinical]
      summary: "CLN-018. Attribution of the licensed drug knowledge base behind the drug data ('Drug data - <source> <dataMonth>' under the Rx pad). configured=false until a licence is signed and a feed is loaded (then nothing is shown). Attribution only: no KB content is returned (licence: no bulk KB content through public APIs; the drug typeahead is capped at 20)."
      x-required-permission: "clinical:view | clinical:edit"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DrugKnowledgeBaseSource" } } } }

  /clinical/drugs/{drugId}:
    get:
      tags: [Clinical]
      summary: "CLN-019. Drug master detail from the regional drug master (generic ingredients with strengths, classes, schedule flags, pregnancy category, source KB and data month). A product retired in the KB is still returned (status retired) so existing prescriptions resolve. Reference data, no PHI."
      x-required-permission: "clinical:view | pharmacy:view"
      parameters: [{ name: drugId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DrugDetail" } } } }
        "404": { description: "DRUG_NOT_FOUND (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /clinical/drugs:
    get:
      tags: [Clinical]
      summary: "CLN-019. Typeahead over the active products of the caller's region (prefix match on brand, ingredient, strength, form). Retired products are never returned. limit 1-100 (default 20)."
      x-required-permission: "clinical:view | pharmacy:view"
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DrugSummary" } } } } }
  /pharmacy/items/{id}/drug-link:
    put:
      tags: [Pharmacy]
      summary: "CLN-019. Map a pharmacy item to a drug master product. Pricing and stock are untouched; suggestedIsRx is true when the product carries a schedule flag (a suggestion only, the clinic's isRx stays as set). Hybrid mode only. 404 DRUG_NOT_FOUND for an unknown or retired product. Audited (pharmacy.item_drug_linked)."
      x-required-permission: pharmacy:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [drugId], properties: { drugId: { type: string, maxLength: 80 } } } } }
      responses:
        "200": { description: Linked, content: { application/json: { schema: { type: object, properties: { itemId: { type: string, format: uuid }, drugId: { type: string }, suggestedIsRx: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drug-master/imports:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (platform operator token)" }]
    post:
      tags: [Clinical]
      summary: "CLN-019. Start a KB drug master import. feedUri is file:<name> inside the cell's configured feed directory (the licensed feed delivery is external). Dry run by default: parse, validate and diff only, never activatable. The same feed content returns the existing import. 202 {importId, status}; poll GET /drug-master/imports/{importId}. Audited."
      x-required-permission: kb_import:edit
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [feedUri, kind], properties: { feedUri: { type: string }, kind: { type: string, enum: [full, delta] }, dryRun: { type: boolean, default: true } } } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { type: object, properties: { importId: { type: string, format: uuid }, status: { type: string } } } } } }
        "422": { description: "FEED_INVALID or FEED_UNSUPPORTED (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: "FEED_IMPORT_DISABLED (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /drug-master/imports/{importId}:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (platform operator token)" }]
    parameters: [{ name: importId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clinical]
      summary: "CLN-019. Import status (running, validated, active, failed, superseded) with the dry-run diff {added, changed, retired, safetyRelevant, samples} once validated, or the error of a failed import."
      x-required-permission: kb_import:edit
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /drug-master/imports/{importId}/activate:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (platform operator token)" }]
    parameters: [{ name: importId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Clinical]
      summary: "CLN-019. Activate a validated, non-dry-run import in one transaction (the version switch). csoAckRef is required when the diff changes schedule, pregnancy category or ingredients of existing products (409 CSO_ACK_REQUIRED); 409 IMPORT_INVALID when the import is not validated, was a dry run, or the active version moved since validation. Re-activating the active import returns its version. Publishes clinical.drug_master.version_activated.v1 per tenant of the region. Audited."
      x-required-permission: kb_import:edit
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { csoAckRef: { type: string, maxLength: 200 } } } } }
      responses:
        "200": { description: Active, content: { application/json: { schema: { type: object, properties: { version: { type: integer } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "IMPORT_INVALID or CSO_ACK_REQUIRED (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /safety-dictionaries/{region}/versions:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (platform operator token)" }]
    parameters: [{ name: region, in: path, required: true, schema: { type: string, enum: [IN, SA, AE, QA] } }]
    get:
      tags: [Clinical]
      summary: "CLN-004. All versions of a region's dictionary, newest first (operator)."
      x-required-permission: safety_content:edit
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SafetyDictionaryVersion" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Clinical]
      summary: "CLN-004. Upload a draft dictionary version (JSON bundle). Validated (terms and stems at least 4 characters except the stem 'cef'; known classes; matchKind on pregnancyRisk/controlled; labels.controlled.en). Re-uploading content identical to an existing version returns that version (created=false). diffSummary compares with the active version. Audited (safety_dictionary.uploaded, platform chain)."
      x-required-permission: safety_content:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SafetyDictionaryBundle" } } }
      responses:
        "201": { description: Draft created (or the identical existing version), content: { application/json: { schema: { $ref: "#/components/schemas/SafetyDictionaryUpload" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Operator lacks safety_content:edit (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "BUNDLE_INVALID; errors[] lists every problem (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /safety-dictionaries/{region}/versions/{versionId}/approve:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (platform operator token)" }]
    post:
      tags: [Clinical]
      summary: "CLN-004. Record the CSO approval (reference to the signed approval record and the approver's name) for a version. Once per version; a draft becomes 'approved', a retired version keeps its status (so it can be rolled back to). Audited."
      x-required-permission: safety_content:edit
      parameters:
        - { name: region, in: path, required: true, schema: { type: string, enum: [IN, SA, AE, QA] } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csoApprovalRef, approvedBy]
              properties:
                csoApprovalRef: { type: string, maxLength: 200 }
                approvedBy: { type: string, maxLength: 200 }
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/SafetyDictionaryVersion" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "ALREADY_APPROVED (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /safety-dictionaries/{region}/versions/{versionId}/activate:
    servers: [{ url: https://api.nabd.health/internal/v1, description: "internal (platform operator token)" }]
    post:
      tags: [Clinical]
      summary: "CLN-004. Activate an approved version, or roll back to an earlier approved one (same call). csoApprovalRef must equal the recorded approval. The previous active version is retired in the same transaction; every pod reloads within app.safety-dictionary.refresh-ms (default 60 s). Audited (safety_dictionary.activated with previousVersion and reason)."
      x-required-permission: safety_content:edit
      parameters:
        - { name: region, in: path, required: true, schema: { type: string, enum: [IN, SA, AE, QA] } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csoApprovalRef, reason]
              properties:
                csoApprovalRef: { type: string, maxLength: 200 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Active
          content:
            application/json:
              schema:
                type: object
                properties:
                  region: { type: string }
                  activeVersion: { type: integer }
                  previousVersion: { type: [integer, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "NOT_APPROVED (no matching CSO approval record) or ALREADY_ACTIVE (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/prescriptions/{queueEntryId}/signing-authority:
    get:
      tags: [Clinical]
      summary: CLN-005. Whether the caller may sign this visit's prescription right now. reason is the 403 code sign would return (not-prescriber, not-licensed-clinician, licence-expired, break-glass-cannot-sign), null when canSign. The consult screen uses it to show or hide Sign.
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canSign, reason]
                properties:
                  canSign: { type: boolean }
                  reason: { type: [string, "null"], enum: [not-prescriber, not-licensed-clinician, licence-expired, break-glass-cannot-sign, null] }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/visits/{queueEntryId}/documents:
    get:
      tags: [Clinical]
      summary: Clinical documents (visit summary, referral letter, certificate) of a visit, oldest first
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ClinicalDocument" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Clinical]
      summary: Create a DRAFT document for the visit. body holds only the labelled fields of that type, as typed by the doctor (unknown keys are 400); blank values are dropped. The server fills nothing in.
      x-required-permission: clinical:edit
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocumentCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/visits/{queueEntryId}/documents/summary-prefill:
    get:
      tags: [Clinical]
      summary: Starting values for a visit summary, read from the visit's SIGNED note (diagnosis, assessment, plan) and SIGNED prescription (one line per medicine). Unsigned sources contribute nothing (noteSigned / prescriptionSigned say which). Nothing is stored; the doctor edits then creates the document.
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocumentSummaryPrefill" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/documents/{id}:
    get:
      tags: [Clinical]
      summary: One clinical document (header snapshot present once issued)
      x-required-permission: clinical:view
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Clinical]
      summary: Replace the fields of a DRAFT document (a request with no body field leaves the draft unchanged). 409 document-issued once issued.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocumentUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Conflict. 409 document-issued (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/documents/{id}/issue:
    post:
      tags: [Clinical]
      summary: Issue a draft. Requires the type's required fields (referral - referredTo, reason; certificate - purpose; visit_summary - at least one field; certificate period must not end before it starts) else 400 document-incomplete. Takes a snapshot of clinic / doctor / patient / visit values into header, stamps issuedBy / issuedAt, and from then on the document is immutable (also enforced by a database trigger). header.doctor.registrationNumber is the visit doctor's professional registration number at issue time (null when none is recorded). Only the visit's doctor or a holder of clinical:approve may issue (403 not-prescriber), as for signing a prescription; CLN-005 - the same licence rule applies (403 not-licensed-clinician, licence-expired; a break-glass session gets break-glass-cannot-sign with an audit row). Creating and editing drafts stays clinical:edit. Audited (clinical_document.issued; no clinical text in the audit row).
      x-required-permission: "clinical:edit | clinical:approve"
      x-permission-check: "visit doctor or clinical:approve, plus CLN-005 licence (see summary)"
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Issued, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalDocument" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden (problem+json). not-prescriber, not-licensed-clinician, licence-expired or break-glass-cannot-sign", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Conflict. 409 document-issued (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/note-templates:
    get:
      tags: [Clinical]
      summary: The calling doctor's own note templates (favourites first, then by name). Other doctors' templates are never returned. Nothing is pre-loaded - the list is empty until the doctor saves one.
      x-required-permission: clinical:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NoteTemplate" } } } } }
    post:
      tags: [Clinical]
      summary: Save a note template owned by the caller. Name 1-80 chars; each section at most 4000 chars (refused, never truncated); up to 10 doctor-defined tags of at most 30 chars (trimmed, case-insensitive duplicates dropped). At most 100 templates per doctor (409 note-template-limit).
      x-required-permission: clinical:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplateCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplate" } } } }
        "400": { description: "Bad request. 400 invalid-note-template (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "Conflict. 409 note-template-limit (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /clinical/note-templates/{id}:
    patch:
      tags: [Clinical]
      summary: Change one of the caller's templates. A field that is absent or null is left unchanged (send "" or [] to clear). Used to rename, edit text, edit tags and to mark or unmark a favourite. 404 for another doctor's template.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplateUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NoteTemplate" } } } }
        "400": { description: "Bad request. 400 invalid-note-template (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Clinical]
      summary: Delete one of the caller's templates (notes already written from it are unaffected). 404 for another doctor's template.
      x-required-permission: clinical:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/vitals/{queueEntryId}:
    get:
      tags: [Clinical]
      summary: Vitals recorded for a visit
      x-required-permission: clinical:view
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Vitals" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Clinical]
      summary: >
        Record or correct a visit's vitals. A field that is absent or null keeps the stored value; a measurement is
        corrected by sending the new value and cannot be blanked. At least one measurement is required
        (400 no-measurement); blood pressure is a pair (400 incomplete-blood-pressure) and systolic must exceed
        diastolic (400 invalid-blood-pressure). Values outside the plausibility bounds below are 400 validation-failed
        and are never altered. A change to an already-recorded value is audited as vitals.corrected with old and new values.
        REC-060: recording needs clinical:create or clinical:edit. Changing a value that is already recorded for the visit
        (a non-null field sent with a different value) needs clinical:edit, else 403 vitals-correction-forbidden; filling a
        still-empty field or re-sending the same value is not a correction.
      x-required-permission: "clinical:create | clinical:edit"
      x-permission-check: "correcting a recorded value: clinical:edit"
      parameters: [{ name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VitalsWrite" } } }
      responses:
        "200": { description: The vitals as stored, content: { application/json: { schema: { $ref: "#/components/schemas/Vitals" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Caller holds neither clinical:create nor clinical:edit, or changes an already-recorded value without clinical:edit (vitals-correction-forbidden)" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/vitals/patient/{patientId}/previous:
    get:
      tags: [Clinical]
      summary: A patient's vitals across visits, newest first (NUR-022). The caller drops the current visit. 404 for an unknown patient.
      x-required-permission: clinical:view
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 5, minimum: 1, maximum: 20 }, description: Values above 20 are capped at 20. }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/VitalsHistory" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinical/patients/{patientId}/dose-calculator:
    get:
      tags: [Clinical]
      summary: >
        Weight-based dose suggestion (decision support, not a prescription). total = latest recorded weight x the
        clinician-supplied mgPerKg. The rule is a named formula with no per-drug formulary, so no per-dose or daily
        maximum is returned. 400 no-weight-recorded when the patient has no recorded weight (a weight is never estimated).
        422 adult-patient when the patient is 18 or older (mg/kg dosing is out of scope). weightStale flags an old weight.
      x-required-permission: clinical:view
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mgPerKg, in: query, required: true, schema: { type: number } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DoseCalculation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { description: adult-patient (18 or older), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  # ------------------------------------------------------------ Pharmacy (Hybrid mode)
  /pharmacy/settings:
    get:
      tags: [Pharmacy]
      summary: The tenant's pharmacy mode
      x-required-permission: pharmacy:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySettings" } } } }
    patch:
      tags: [Pharmacy]
      summary: Set the pharmacy mode (external or hybrid). Items and stock are only managed in hybrid mode.
      description: >-
        PHA-006. Changing the mode requires `reason` (3-200 chars, trimmed) else 400 reason-required, and is audited as
        `pharmacy.mode_changed` (before {mode}, after {mode, reason}). Sending the current mode is a no-op (no reason needed).
        Switching to `in_house` returns 400 mode-not-available (Phase 3, not built) unless the tenant is already in_house.
      x-required-permission: pharmacy:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySettingsWrite" } } }
      responses:
        "200": { description: The settings, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /pharmacy/items:
    get:
      tags: [Pharmacy]
      summary: Pharmacy (stocked) catalogue items, active and inactive
      x-required-permission: pharmacy:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PharmacyItem" } } } } }
    post:
      tags: [Pharmacy]
      summary: Add a stocked item. `stockQty` is the opening stock and is logged as the first stock movement. 400 pharmacy-mode-not-hybrid outside Hybrid mode.
      x-required-permission: pharmacy:edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItemWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /pharmacy/items/{id}:
    patch:
      tags: [Pharmacy]
      summary: Edit an item's name, price, tax, Rx flag and HSN. `stockQty` in the body is ignored; use POST /pharmacy/items/{id}/stock-adjustments to change stock.
      x-required-permission: pharmacy:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItemWrite" } } }
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pharmacy/rx-lines/search:
    post:
      tags: [Pharmacy]
      summary: >
        PHL-001 counter "Link prescription" picker: signed prescription lines with quantity left for the patients whose phone matches
        (last 10 digits; POST so the number is never in a URL). At most 50, newest first. Fewer than 6 digits is 400 validation-failed.
      x-required-permission: billing:create
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string } } } } }
      responses:
        "200":
          description: Matching lines
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    prescriptionItemId: { type: string, format: uuid }
                    patientId: { type: string, format: uuid }
                    patientName: { type: string }
                    drugName: { type: string }
                    dosage: { type: string, nullable: true }
                    quantity: { type: number, nullable: true }
                    remainingQty: { type: number }
                    signedAt: { type: string, format: date-time, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
  /pharmacy/dispensing-queue:
    get:
      tags: [Pharmacy]
      summary: Signed prescriptions waiting to be dispensed (live query)
      x-required-permission: pharmacy:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DispensingQueueEntry" } } } } }
  /billing/otc-charges:
    get:
      tags: [Billing]
      summary: >
        Chargeable catalogue for counter sales. Each charge carries `stockQty` (PHA-011).
        409 `otc-not-available` when the pharmacy mode is `external` (hybrid and in_house are allowed; PHA-010).
      x-required-permission: billing:view
      responses:
        "409": { description: Pharmacy mode is external (problem type otc-not-available) }
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { currency: { type: string }, charges: { type: array, items: { $ref: "#/components/schemas/BillingCharge" } } } } } } }
  /billing/otc-checkout:
    post:
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      tags: [Billing]
      summary: >
        Counter sale (standalone invoice, no patient/queue entry). 409 `otc-not-available` when the pharmacy mode is `external`
        (PHA-010). Lines whose `chargeCode` is in the catalogue are priced SERVER-side (QA-OI-2): name, category, tax and unit price
        come from the catalogue and the client's values are silently ignored (no 400 on mismatch); a catalogue entry flagged
        doctorOverride keeps the client's unitPrice. Lines with no catalogue entry use the client's values (chargeName required,
        unitPrice and taxRatePercent >= 0, else 400 validation-failed). Non-zero discount needs billing.discount (403 discount-not-permitted).
        PHL-001: a line whose catalogue item is prescription-only (`isRx`, the clinic's flag) needs `prescriptionItemId` (uuid) pointing at a
        signed prescription line of the same tenant and patient with quantity left (prescribed quantity minus units on non-void invoices;
        a line with no prescribed quantity has none left). Refusals are 422 Problem+JSON: rx-required (no link, or the id is unknown in this
        tenant), rx-not-signed, rx-patient-mismatch, rx-quantity-exhausted. Each refusal writes audit `pharmacy.rx_gate_blocked` and event
        `pharmacy.rx_gate.blocked.v1` { tenantId, itemId, reason, actorId }; nothing else is written and stock is unchanged.
        A counter sale with linked Rx lines is recorded against that prescription's patient (patientId set); lines from two patients are
        rx-patient-mismatch. Sales against an outside (paper/photo) prescription are PHL-020.
      x-required-permission: billing:create
      responses:
        "200": { description: The invoice (lineItems show the price actually charged), content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
        "409": { description: "otc-not-available, item-inactive, insufficient-stock or day-closed" }
        "422": { description: "rx-required, rx-not-signed, rx-patient-mismatch, rx-quantity-exhausted (PHL-001), unknown-charge, reason-required" }
  /billing/checkout/{queueEntryId}:
    post:
      tags: [Billing]
      summary: >
        Bill a visit at a billing checkpoint (FIN-003). The client sends `lineItems: [{ chargeCode, quantity, override?: { unitPrice,
        reasonCode, note? } }]` and optionally `discounts: [{ kind: amount|percent, value, reasonCode, note? }]`; the server resolves name,
        category, price and tax from charge_catalogue and ignores any client chargeName/category/unitPrice/taxRatePercent on a catalogue line.
        A Consultation uses followUpAmount when the patient had a completed visit with the same doctor in the last 14 days; the client
        cannot choose the tier. Each line in the response carries `unitPrice` (charged), `listUnitPrice` (catalogue), `tier`
        (normal|follow_up|custom) and `overrideReason`. An override, a free-text line (a chargeCode that is not an active catalogue row,
        which then needs chargeName + unitPrice) or any discount needs the billing.discount grant (403 discount-not-permitted); an
        override or discount also needs a reason code (422 reason-required, 422 invalid-reason; goodwill, staff, price_match, waiver,
        pricing_error, other). Without billing.discount an unknown code is 422 unknown-charge. Each discount is a row in invoice_discounts and
        invoices.discount is their sum across checkpoints; more than the remaining subtotal is 422 discount-exceeds-subtotal. The legacy scalar
        `discount` still works and is booked with reason `unspecified`. Every override and discount writes an audit row. Not gated by pharmacy mode.
        Not done here: Idempotency-Key, an `emergency` tier (no catalogue column), the billing.invoice.issued.v1 event (no consumer yet).
        PHL-001: a line whose catalogue item is prescription-only (`isRx`, the clinic's flag) needs `prescriptionItemId` (uuid) pointing at a
        signed prescription line of the same tenant and patient with quantity left (prescribed quantity minus units on non-void invoices;
        a line with no prescribed quantity has none left). Refusals are 422 Problem+JSON: rx-required (no link, or the id is unknown in this
        tenant), rx-not-signed, rx-patient-mismatch, rx-quantity-exhausted. Each refusal writes audit `pharmacy.rx_gate_blocked` and event
        `pharmacy.rx_gate.blocked.v1` { tenantId, itemId, reason, actorId }; nothing else is written and stock is unchanged.
        The checkout context (GET) lists the visit's signed lines in `prescribedItems` with `prescriptionItemId`, `quantity` and
        `remainingQty`, and every charge carries `isRx`, so the screen can pre-link Rx lines.
      x-required-permission: billing:create
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: queueEntryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The invoice, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden (including discount-not-permitted)" }
        "409": { description: Conflict }
        "422": { description: "unknown-charge, reason-required, invalid-reason, discount-exceeds-subtotal, rx-required, rx-not-signed, rx-patient-mismatch or rx-quantity-exhausted" }
  /billing/quotes:
    post:
      tags: [Billing]
      summary: >
        Tax for a draft cart, nothing stored (FIN-008). Body `{ lines: [{ chargeCode, quantity, ... }], discounts?: [{ kind, value, reasonCode }], buyerGstin? }`.
        Same path as checkout, so the quote is the bill: the invoice discount is allocated to the lines pro rata (largest remainder) before
        tax, each tax component is rounded half-up to the minor unit, INR totals round to the rupee with a `roundOffMinor`, other currencies
        keep their decimals. Response `{ currency, documentType: invoice|bill_of_supply, lines: [{ chargeCode, discountMinor, taxableMinor,
        taxes: [{ type, rate, amountMinor }] }], totals: { subtotalMinor, discountMinor, taxMinor, roundOffMinor, totalMinor } }`.
        Invoices carry `documentTitle` (Invoice | Bill of Supply), `buyerGstin`, and per line `taxableMinor` and `taxes` (stored, never recomputed).
        Checkout accepts the optional `buyerGstin`. A clinic whose tax registration is on file but unregistered or without a GSTIN issues a
        Bill of Supply (no tax). Not done: 422 TAX_RULE_MISSING (a head without a rule falls back to its own rate).
      x-required-permission: billing:view
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: The quote, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
        "422": { description: "invalid-gstin, unknown-charge, reason-required, discount-exceeds-subtotal" }
  /billing/tax/guided-picker:
    get:
      tags: [Billing]
      summary: >
        Questions and outcomes of the guided tax picker (FIN-009). `?jurisdiction=IN` returns `{ jurisdiction, questions: [{ id, text,
        answers: [{ label, nextQuestion, outcome }] }], outcomes: [{ id, taxCategory, gstRate, note }] }`; a jurisdiction with no picker returns
        empty lists. Rates and classes are a starting point: Needs external verification (CA, FIN-010).
      x-required-permission: setup:view
      parameters: [{ name: jurisdiction, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: The picker, content: { application/json: { schema: { type: object } } } }
        "403": { description: Forbidden }
  /billing/day-close:
    get:
      tags: [Billing]
      summary: >
        Day-close summary for one clinic day (default today). Only the OWN-019 fields are spelled out here; the rest of
        the body (totals, methods, outstanding, pendingCheckouts, unbilled, taxBands, splitPaymentBills, close) is unchanged.
        voidedCount / voidedTotal count invoices whose voided_at (Sprint 3 void flow) falls within that clinic day,
        whenever the invoice was raised; voidedTotal sums their total. Voided bills are already excluded from totals.billed.
        Payment-gateway failures are not recorded anywhere, so there is no failed field.
      x-required-permission: billing:view
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  voidedCount: { type: integer, description: "Invoices voided on this clinic day (by voided_at)" }
                  voidedTotal: { type: number, description: "Sum of those invoices' total" }
                additionalProperties: true
        "403": { description: Forbidden }
    post:
      tags: [Billing]
      summary: >
        FIN-005: close a clinic day (date defaults to today; a past day can be closed, and a reopened day closed again,
        which recomputes expected cash and increments close.closeCount). Takes the per-tenant-day advisory lock shared with
        checkout, payment, void, package sale and refund approval, so a racing payment is either counted or refused with
        409 day-closed. The variance tolerance is the clinic policy cash_variance_tolerance (minor units; default 200 INR,
        20 SAR/AED/QAR). Writes day_close_events + audit day_close.close and publishes billing.day.closed.v1.
      x-required-permission: billing:approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedCash]
              properties:
                countedCash: { type: number, minimum: 0 }
                note: { type: string, maxLength: 1000, description: "Required when |variance| > cashTolerance" }
                date: { type: string, format: date, description: "Clinic day to close; default today; never a future day" }
      responses:
        "200": { description: DayCloseSummaryResponse (as GET; close.closeCount counts the closes) }
        "400": { description: "variance-note-required, date-in-future, validation-failed", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Forbidden }
        "409": { description: "day-already-closed, day-close-blocked", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /billing/day-close/reopen:
    post:
      tags: [Billing]
      summary: >
        Reopen a closed day with a reason (FIN-005: body date, else ?date=, else today). Writes day_close_events + audit
        day_close.reopen and publishes billing.day.reopened.v1 ({ tenantId, date }; the free-text reason stays in audit_log).
      x-required-permission: billing:approve
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                date: { type: string, format: date }
      responses:
        "200": { description: DayCloseSummaryResponse }
        "403": { description: Forbidden }
        "409": { description: day-not-closed, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /billing/day-close/history:
    get:
      tags: [Billing]
      summary: FIN-005 close/reopen history for clinic days in [from, to] (default last 31 days), newest first, keyset-paged.
      x-required-permission: billing:view
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        date: { type: string, format: date }
                        action: { type: string, enum: [close, reopen] }
                        expectedCash: { type: number, nullable: true }
                        countedCash: { type: number, nullable: true }
                        variance: { type: number, nullable: true }
                        note: { type: string, nullable: true, description: "Close note or reopen reason" }
                        actorName: { type: string, nullable: true }
                        at: { type: string, format: date-time }
                  nextCursor: { type: string, nullable: true }
        "400": { description: "invalid-cursor, invalid-range", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: Forbidden }
  /billing/invoices:
    get:
      tags: [Billing]
      summary: >
        FIN-014. Invoice list, newest first, keyset cursor. Filters: `from`/`to` (clinic dates, inclusive), `status` (unpaid, partial, paid,
        refunded, void), `doctorId`, `method` (cash, card, upi, other: a payment of that method exists), `q` (invoice number or patient name,
        literal text). `limit` is clamped to 100. `balanceDue` = total - paid - written off.
      x-required-permission: billing:view
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string } }
        - { name: doctorId, in: query, schema: { type: string, format: uuid } }
        - { name: method, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200": { description: A page, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object } }, nextCursor: { type: string, nullable: true } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /billing/dues:
    get:
      tags: [Billing]
      summary: >
        FIN-014. Patients who owe money, one row per patient, oldest debt first: `totalDue`, `oldestDays` (clinic days), `bucket` (0-7, 8-30, 31-90, 90+),
        `invoiceNumbers`, `lastRemindedAt`. Filter by `bucket`. Written-off amounts are not owed.
      x-required-permission: billing:view
      parameters:
        - { name: bucket, in: query, schema: { type: string, enum: ["0-7", "8-30", "31-90", "90+"] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200": { description: A page, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object } }, nextCursor: { type: string, nullable: true } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /billing/dues/{patientId}/remind:
    post:
      tags: [Billing]
      summary: >
        FIN-014. Send the `dues_reminder` template (names the clinic only: no amounts, no line items) through the notification port.
        409 NO_CONSENTED_CHANNEL when consent blocks it, 429 REMINDED_RECENTLY within 24 h of the last reminder, 422 PAYMENT_LINK_UNAVAILABLE
        when `includePaymentLink` is true (payment links are FIN-020), 422 TEMPLATE_NOT_SENDABLE when the clinic has no approved template, 404 when nothing is owed.
      x-required-permission: billing:edit
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [channel], properties: { channel: { type: string, enum: [whatsapp, sms] }, includePaymentLink: { type: boolean } } } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { type: object, properties: { reminderId: { type: string, format: uuid } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: NO_CONSENTED_CHANNEL }
        "422": { description: "PAYMENT_LINK_UNAVAILABLE or TEMPLATE_NOT_SENDABLE" }
        "429": { description: REMINDED_RECENTLY }
  /billing/invoices/{id}/write-off:
    post:
      tags: [Billing]
      summary: >
        FIN-014. Write off part or all of an open invoice's balance. A ledger row in invoice_write_offs plus audit `billing.write_off`; the invoice itself is not edited.
        Needs a reason code. 422 EXCEEDS_BALANCE, 409 not-open. Returns the invoice list item with the new `balanceDue`.
      x-required-permission: billing:approve
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount, reasonCode], properties: { amount: { type: number, minimum: 0.01 }, reasonCode: { type: string, maxLength: 40 }, note: { type: string, maxLength: 500 } } } } }
      responses:
        "200": { description: The invoice with its new balance, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not-open }
        "422": { description: EXCEEDS_BALANCE }
  /billing/invoices/{id}/document:
    get:
      tags: [Billing]
      summary: >
        FIN-012. The invoice or receipt as a PDF (`layout` a4 | thermal80, `kind` invoice | receipt). Rendered once per invoice version and layout and stored
        (billing_documents); every later call returns the stored bytes, so a reprint shows the values of the original issue. Audit `billing.document_rendered`.
        400 on another layout or kind, 409 `no-payment` for a receipt before any payment. Not done: secure share link (needs IDC-015).
      x-required-permission: billing:view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: layout, in: query, schema: { type: string, enum: [a4, thermal80], default: a4 } }
        - { name: kind, in: query, schema: { type: string, enum: [invoice, receipt], default: invoice } }
      responses:
        "200": { description: The PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: no-payment }
  /billing/invoices/{id}:
    get:
      tags: [Billing]
      summary: >
        An invoice with its derived balance (`balanceDue`), status (`unpaid` / `partial` / `paid`, or `void` / `cancelled` / `refunded`)
        and payments. Status is recomputed from paid vs total in the same transaction as every payment or totals change (FIN-001).
      x-required-permission: billing:view
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The invoice, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/invoices/{id}/payments:
    post:
      tags: [Billing]
      summary: >
        Record a payment against an invoice (FIN-001). The invoice row is locked, so simultaneous payments each add exactly once;
        `paid` is the sum of the payment rows and status is re-derived in the same transaction. Audit `billing.payment_recorded`;
        outbox event `billing.payment.recorded.v1`. An optional `Idempotency-Key` header makes a retry return the invoice without a
        second payment (the same key on another invoice is 409 idempotency-key-reused). 422 overpayment (body carries `balance`);
        409 invoice-not-payable (void, cancelled or refunded); 409 day-closed; 404 not-found.
      x-required-permission: billing:edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method: { type: string, enum: [cash, card, upi, other] }
                amount: { type: number, minimum: 0.01, description: "At most 2 decimals, not more than the balance" }
                reference: { type: string, maxLength: 100 }
      responses:
        "201": { description: "The invoice with its new paid, balanceDue, status and payments", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "day-closed, invoice-not-payable or idempotency-key-reused" }
        "422": { description: "overpayment: amount is more than the balance (Problem with a numeric `balance` member)" }
  /billing/invoices/{id}/void:
    post:
      tags: [Billing]
      summary: >
        Void an invoice that has taken no payment and restore its pharmacy stock (PHA-011). One transaction: invoice
        status becomes `void`, one immutable `restock` stock movement per stocked item, audit event `billing.invoice_voided`.
        Needs billing:edit and the `billing.discount` (refund/discount) grant, else 403 void-not-permitted.
        400 reason-required; 409 invoice-already-void; 409 invoice-has-payments (refund flow does not exist yet); 409 day-closed.
        Over-selling is rejected at checkout / otc-checkout with 400 insufficient-stock (unchanged, covered by tests).
      x-required-permission: billing:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1 } } } } }
      responses:
        "200": { description: The voided invoice (status `void`), content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Conflict }
  /pharmacy/items/{id}/stock-adjustments:
    post:
      tags: [Pharmacy]
      summary: >
        Change an item's stock by hand: send exactly one of `delta` (relative, +/-) or `setTo` (counted total after a stock-take),
        and a mandatory `reason`. The item row is locked, the new count is computed from the locked value, and an immutable
        stock-movement row plus an audit event (pharmacy.stock_adjusted) record who, when and why. This is the only way to change
        stock by hand: PATCH /pharmacy/items/{id} ignores `stockQty` (it edits name, price, tax, Rx flag and HSN only).
        400 insufficient-stock when the result would be below zero; 400 no-change when the count would not change;
        400 pharmacy-mode-not-hybrid outside Hybrid mode. A missing or blank `reason` is 400 validation-failed (bean validation).
      x-required-permission: pharmacy:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyStockAdjustment" } } }
      responses:
        "200": { description: The item with its new stock count, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pharmacy/items/{id}/status:
    patch:
      tags: [Pharmacy]
      summary: Activate or deactivate an item (idempotent; audited as pharmacy.item_activated / pharmacy.item_deactivated). An inactive item no longer appears at checkout; its history and stock count stay.
      x-required-permission: pharmacy:edit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
                reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pharmacy/items/{id}/stock-movements:
    get:
      tags: [Pharmacy]
      summary: Immutable stock-movement log of an item (manual adjustments and checkout dispenses), newest first, last 200
      x-required-permission: pharmacy:view
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PharmacyStockMovement" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------- Nursing (vaccine record, record-only)
  /nursing/vaccine-records:
    post:
      tags: [Nursing]
      summary: Record a vaccine given. Record-only and append-only - stores what the nurse entered (free-text vaccine name, dose, route, site, lot). There is no immunisation schedule, so nothing is validated or computed against one. Audited as nursing.vaccine_recorded. 400 queue-entry-mismatch if queueEntryId belongs to another patient.
      x-required-permission: nursing:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaccineRecordWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/VaccineRecord" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /nursing/vaccine-records/today:
    get:
      tags: [Nursing]
      summary: Vaccines recorded today (clinic day), newest first. There is no due list because no vaccine schedule reference data exists.
      x-required-permission: nursing:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VaccineRecord" } } } } }

  /nursing/worklist:
    get:
      tags: [Nursing]
      summary: "NUR-019 - the nurse worklist in one call: exactly the entries GET /queue returns with no parameters (today's clinic day, all doctors/departments, priority=false), in the same order, each with its patient and vitals. Rows are never dropped. patient is the GET /patients/{id} body, or null when the caller lacks patients:view, is not fully verified (verification-required on that endpoint) or the patient is not visible to them (consent / own-patients scope). vitals is the GET /clinical/vitals/{queueEntryId} body, or null when none are recorded or the caller lacks clinical:view. Patients and vitals are batch-loaded (IN lists); guardian fields are still read per patient that has a guardian."
      x-required-permission: queue:view
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NursingWorklist" } } } }
        "403": { description: Caller lacks queue:view }

  # ------------------------------------------------------------- Reports
  /reports/money:
    get:
      tags: [Reports]
      summary: "Reports - Today's money (OWN-01) for a period of clinic days, inclusive; from/to both default to today. 400 invalid-period when from is after to or the range exceeds a year."
      x-required-permission: reports:view
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MoneyReport" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /reports/eta-accuracy:
    get:
      tags: [Reports]
      summary: "ACC-019 - ETA accuracy per clinic day and doctor (rolled up hourly for the previous clinic day, so yesterday is in place by 06:00 local). from/to are clinic days, inclusive; default is the 14 days ending yesterday; 400 invalid-range when from is after to or the range exceeds 93 days. maeMin is the mean absolute error of the p50 time in minutes, p80HitRate the share of visits called at or before the promised p80 time, within10Pct the share within +/-10 min. lowConfidence is true when the clinic had fewer than 30 visits that day (no drift alert fires for it). Aggregates only, no patient data."
      x-required-permission: reports:view
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: doctorId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [clinicDate, doctorId, n, maeMin, p80HitRate]
                      properties:
                        clinicDate: { type: string, format: date }
                        doctorId: { type: string, format: uuid }
                        n: { type: integer }
                        maeMin: { type: number }
                        p80HitRate: { type: number }
                        within10Pct: { type: number }
                        lowConfidence: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Caller lacks reports:view }
  /reports/sources:
    get:
      tags: [Reports]
      summary: "Visits by source tag (OWN-024). Bare array; each row carries revenue (invoice totals of that source's visits) and the report-wide untaggedCount (visits with no source tag; 0 today as source is NOT NULL)."
      x-required-permission: reports:view
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    source: { type: string }
                    visitCount: { type: integer, format: int64 }
                    revenue: { type: number, description: "Sum of invoice totals for the visits in this source" }
                    untaggedCount: { type: integer, format: int64, description: "Report-wide count of untagged visits, repeated on every row" }
  /reports/packages:
    get:
      tags: [Reports]
      summary: >
        Packages report (OWN-026) for a period of clinic days (from/to inclusive; else the last `days` days to today; same
        400 invalid-period rule as /reports/money). salesByDay: every day in the period, zero-filled; count = package
        instances sold (created) that clinic day, amount = sum of their sale invoices' total (incl. tax); later refunds are
        not subtracted. redemption: over instances sold in the period (any status), sessionsSold = sum of item
        quantity_total, sessionsRedeemed = sum of quantity_consumed to date; units are all item types, the same unit as
        /packages/liability sessionsOwed. expiredWithValue: instances still `active` whose validity_end is in the period and
        today > validity_end + grace_days (the instance's computed `expired` status) with units left; expiredOn = validity_end;
        remainingValue = sum of unconsumed units x allocated per-unit price (the liability formula), rounded to 2 dp.
        Revenue recognition (deferred vs earned) is NOT provided: an accounting decision is pending.
      x-required-permission: reports:view
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  salesByDay:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }
                        amount: { type: number }
                  redemption:
                    type: object
                    properties:
                      sessionsRedeemed: { type: integer, format: int64 }
                      sessionsSold: { type: integer, format: int64 }
                  expiredWithValue:
                    type: array
                    items:
                      type: object
                      properties:
                        instanceId: { type: string, format: uuid }
                        patientName: { type: string }
                        packageName: { type: string }
                        expiredOn: { type: string, format: date }
                        remainingValue: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Forbidden }
  /reports/staff-performance:
    get:
      tags: [Reports]
      summary: "Per-staff performance (OWN-025). own_patients_only staff get only their own row (see scopeNote)."
      x-required-permission: reports:view
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopeNote: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        staffId: { type: string, format: uuid }
                        staffName: { type: string }
                        collected: { type: number }
                        paymentCount: { type: integer, format: int64 }
                        handledCount: { type: integer, format: int64, description: "Distinct visits: completed as doctor plus billed by this staff member" }
                        discountCount: { type: integer, format: int64, description: "Invoices raised with a discount" }
                        overrideCount: { type: integer, format: int64, description: "Prescription safety overrides/acknowledgements from audit_log" }
  # ------------------------------------------------- Packages: instances (DOC-R6; rest of E14 documented in code)
  /packages/instances:
    get:
      tags: [Packages]
      summary: Sold package instances for the caller's tenant, newest first. Optional patientId filters server-side (tenant-scoped; another tenant's patient id returns []). Absent = every instance in the tenant.
      x-required-permission: packages:view
      parameters:
        - { name: patientId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Package instances (InstanceResponse, without per-item lines)", content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "403": { description: "Forbidden: no packages:view" }
  # ------------------------------------------------- Packages: refund integrity (FIN-004)
  /packages/instances/{id}/refund:
    post:
      tags: [Packages]
      summary: Request a refund. One open (pending) refund per instance; the instance row is locked while checking.
      x-required-permission: packages:edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses:
        "201": { description: "RefundResponse (status pending)", content: { application/json: { schema: { $ref: "#/components/schemas/PackageRefund" } } } }
        "404": { description: Instance not found }
        "409": { description: "refund-already-open (a pending refund exists) or instance-not-refundable (refunded/cancelled)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /packages/refunds/{id}/approve:
    post:
      tags: [Packages]
      summary: >-
        Approve a pending refund (maker != checker). The amount is recomputed under the instance lock (used sessions at full
        list price). expectedAmount is the amount the approver saw; it may be omitted only when the amount is unchanged since the request.
        Publishes billing.package_refund.approved.v1.
      x-required-permission: packages:approve
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { expectedAmount: { type: number } } } } }
      responses:
        "200": { description: "RefundResponse with creditNoteNumber and recomputedAmount", content: { application/json: { schema: { $ref: "#/components/schemas/PackageRefund" } } } }
        "403": { description: "same-user (requester cannot approve) or no packages:approve", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "already-decided, or amount-changed (extras requestedAmount, currentAmount, currentAmountOwed)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /packages/refunds/{id}/reject:
    post:
      tags: [Packages]
      summary: Reject a pending refund.
      x-required-permission: packages:approve
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses:
        "200": { description: "RefundResponse (status rejected)", content: { application/json: { schema: { $ref: "#/components/schemas/PackageRefund" } } } }
        "409": { description: already-decided, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  # ------------------------------------------------- Platform console: fleet summary (LIVE-07)
  /platform/tenants/summary:
    get:
      tags: [Platform]
      summary: Fleet KPI counts. live = tenants with status 'active' (trialing excluded); trialing counted separately; byStatus has every status.
      x-required-permission: clinics_fleet:view
      responses:
        "200":
          description: Fleet summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: "Every tenant, any status" }
                  live: { type: integer, description: "Tenants whose status is 'active'" }
                  trialing: { type: integer, description: "Tenants whose status is 'trialing'" }
                  byStatus: { type: object, additionalProperties: { type: integer } }
                  regions: { type: array, items: { type: string } }
        "403": { description: "Forbidden: no clinics_fleet:view (sre)" }
  /platform/tenants/{tenantId}/region:
    patch:
      tags: [Platform]
      summary: >
        OPS-061. A clinic's region is chosen at provisioning and is immutable (database trigger V1991). Asking for the same
        region is a no-op 200; any other region answers 409 REGION_IMMUTABLE. Unknown tenant 404.
      x-required-permission: tenant_detail:edit
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [regionCode]
              properties:
                regionCode: { type: string, enum: [IN, AE, SA, QA] }
      responses:
        "200":
          description: Region unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId: { type: string, format: uuid }
                  regionCode: { type: string, enum: [IN, AE, SA, QA] }
        "404": { description: "Tenant not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "REGION_IMMUTABLE", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  # ------------------------------------------------- Platform console: support access (PLT-056, PLT-057)
  /platform/support-access/grants:
    post:
      tags: [Platform]
      summary: >
        Request a support grant for one tenant, one support ticket of that tenant and one scope, for 1-60 minutes
        (default 60). Errors 400 with code TICKET_REQUIRED, SCOPE_INVALID, DURATION_OUT_OF_RANGE, TICKET_INVALID
        (ticket missing or of another tenant); 409 REQUEST_ALREADY_OPEN (same operator and ticket). A config_only grant never opens patient records (403 scope-not-permitted).
        PLT-057: this only creates a request (status requested, 24 h deadline, no window). The clinic owner is notified in the app
        and on WhatsApp; the window starts when the owner approves (POST /support-access/requests/{id}/decision).
      x-required-permission: support_access:request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, ticketId, scope, reason]
              properties:
                tenantId: { type: string, format: uuid }
                ticketId: { type: string, format: uuid }
                scope: { type: string, enum: [config_only, redacted_patient_view] }
                reason: { type: string, maxLength: 500 }
                minutes: { type: integer, minimum: 1, maximum: 60, default: 60 }
      responses:
        "201":
          description: The grant (id, tenantId, ticketId, scope, operatorId, operatorName, operatorRole, reason, grantedAt, expiresAt, revokedAt, active, status requested|active|declined|expired|revoked, minutes, windowStartedAt, windowEndsAt, declineNote). active is true only inside an owner-approved window.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: no support_access:request (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /platform/support-access/grants/{id}/patients/{patientId}:
    get:
      tags: [Platform]
      summary: >
        PLT-057: redacted patient view. Only for the grant's own operator, scope redacted_patient_view, and only while the
        owner-approved window is open (otherwise 403 GRANT_NOT_ACTIVE). Returns initials, masked phone (+91******3210),
        birth year and MRN. No clinical field, no name, no full phone, no date of birth. Audited as patient.support_view.
      x-required-permission: support_access:view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Redacted patient
          content:
            application/json:
              schema:
                type: object
                properties:
                  initials: { type: string, example: AR }
                  maskedPhone: { type: string, example: "+91******3210" }
                  birthYear: { type: integer, example: 1990 }
                  mrn: { type: string }
        "403": { description: "GRANT_NOT_ACTIVE, not-your-grant or scope-not-permitted (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  # ------------------------------------------------- Clinic owner: support access requests (PLT-057)
  /support-access/requests:
    get:
      tags: [Compliance]
      summary: The clinic's support access requests, newest first. A request or window whose time ran out reads expired.
      x-required-permission: compliance:view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, active, declined, expired, revoked] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Requests of this clinic only
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        operatorName: { type: string }
                        reason: { type: string }
                        scope: { type: string, enum: [config_only, redacted_patient_view] }
                        minutes: { type: integer }
                        status: { type: string, enum: [requested, active, declined, expired, revoked] }
                        requestedAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        windowStartedAt: { type: string, format: date-time, nullable: true }
                        windowEndsAt: { type: string, format: date-time, nullable: true }
                        declineNote: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: no compliance:view (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /support-access/requests/{id}/decision:
    post:
      tags: [Compliance]
      summary: >
        The owner approves or declines. Approval starts the window now (at most the requested minutes, 60 at the most) and
        writes "support_access.session_started" to the clinic's audit log; decline writes support_access.declined.
        Needs an Idempotency-Key. 409 ALREADY_DECIDED, 410 EXPIRED (not answered within 24 h), 404 for another clinic's request.
      x-required-permission: compliance:approve
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, decline] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [active, declined] }
                  windowEndsAt: { type: string, format: date-time, nullable: true }
        "403": { description: "Forbidden: no compliance:approve (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: ALREADY_DECIDED (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "410": { description: EXPIRED (problem+json), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /support/tickets/redaction-preview:
    post:
      tags: [Support]
      x-required-permission: authenticated
      summary: >
        PLT-057: what the ticket form shows before submitting. Returns the subject and description as they would be stored
        (phone numbers, emails, national IDs, MRNs and this clinic's patient names replaced by [redacted]) and how many
        replacements were made. Stores nothing. POST /support/tickets stores the redacted text only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                subject: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                priority: { type: string, enum: [low, normal, high, urgent] }
      responses:
        "200":
          description: Redacted preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  redactionCount: { type: integer }
                  subject: { type: string }
                  description: { type: string }
  # ------------------------------------------------- Platform console: audit (PLT-028)
  /platform/audit-log:
    get:
      tags: [Platform]
      description: >
        LIVE-08 platform operator events. Platform scope (tenantId null) - platform_auth.signed_in (after.mfa),
        platform_auth.sign_in_failed (after.reason: invalid_credentials | inactive_account | unknown_account; actorId
        null for unknown_account; never the PIN or typed email), platform_auth.mfa_challenged, platform_auth.mfa_failed,
        platform_auth.signed_out, platform_auth.session_revoked, platform_auth.refresh_reuse_detected,
        platform_plan.created, platform_plan.updated (before/after plan terms), platform_provisioning.job_created
        (no owner contact details), platform_provisioning.job_approved, platform_provisioning.step_run,
        platform_provisioning.job_rolled_back (after.compensated: step names in undo order), audit_log.export
        (when platform rows or no rows are exported). Tenant scope - platform_tenant.lifecycle_changed (fromStatus,
        toStatus, reason; also written by billing dunning transitions), platform_billing.subscription_created,
        platform_billing.subscription_updated, platform_billing.discount_requested, platform_billing.discount_auto_approved,
        platform_billing.discount_approved, platform_billing.discount_rejected, platform_ticket.status_changed (status
        only), support_access.requested, support_access.session_started, support_access.declined, support_access.request_expired, support_access.session_ended, support_access.revoke, patient.support_view, audit_log.export.
      summary: Cross-tenant audit log search for platform operators (search_audit_log, V16/V85). Oldest first (ascending id), cursor = last id. All filters optional and additive (AND). createdAfter/createdBefore are inclusive ISO-8601 instants; createdAfter later than createdBefore is 400 invalid-date-range.
      x-required-permission: audit_compliance:view
      x-plt-056: >
        super_admin and compliance_dpo only (sre no longer holds audit_compliance:view). Every search and export writes
        a master.operator_audit_log row (operator, action audit_log.search|audit_log.export, target tenant, filters,
        row count, reason, ip) and, with a tenantId filter, an operator.audit_search event in that tenant's audit_log.
        before/after are null (CSV columns empty) unless includeValues=true is sent by compliance_dpo with a reason:
        another role gets 403 values-not-permitted, a missing reason 400 reason-required (code REASON_REQUIRED).
      parameters:
        - $ref: "#/components/parameters/PlatformAuditTenantId"
        - $ref: "#/components/parameters/PlatformAuditAction"
        - $ref: "#/components/parameters/PlatformAuditEntityType"
        - $ref: "#/components/parameters/PlatformAuditCreatedAfter"
        - $ref: "#/components/parameters/PlatformAuditCreatedBefore"
        - $ref: "#/components/parameters/PlatformAuditActorId"
        - $ref: "#/components/parameters/PlatformAuditActorType"
        - $ref: "#/components/parameters/PlatformAuditActorRole"
        - $ref: "#/components/parameters/PlatformAuditActorName"
        - name: limit
          in: query
          description: PLT-056. Outside 1..100 is 400 validation problem naming limit (code LIMIT_OUT_OF_RANGE).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PlatformAuditIncludeValues"
        - $ref: "#/components/parameters/PlatformAuditReason"
      responses:
        "200":
          description: Page of audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlatformAuditEntry" } }
                  page: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: no audit_compliance:view (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /platform/audit-log/export:
    get:
      tags: [Platform]
      summary: >
        CSV export of the filtered platform audit log (same filters and same columns as GET /platform/audit-log;
        before/after are the stored JSON text). Bounded at 10,000 rows; above that it is refused with 400
        export-too-large rather than truncated. Text cells that a spreadsheet would treat as a formula are
        prefixed with an apostrophe. Audited as audit_log.export (actor = the operator, entityType audit_log),
        written once into the audit trail of every tenant whose rows the file contains, with filters (the
        actor-name search text is recorded only as actorNameFilter=true), rowCount, totalRowCount and tenantCount.
        Platform-scope rows (tenantId null) in the file, and an export matching no rows, are recorded once in the
        platform chain (V126).
      x-required-permission: audit_compliance:view
      x-plt-056: >
        super_admin and compliance_dpo only (sre no longer holds audit_compliance:view). Every search and export writes
        a master.operator_audit_log row (operator, action audit_log.search|audit_log.export, target tenant, filters,
        row count, reason, ip) and, with a tenantId filter, an operator.audit_search event in that tenant's audit_log.
        before/after are null (CSV columns empty) unless includeValues=true is sent by compliance_dpo with a reason:
        another role gets 403 values-not-permitted, a missing reason 400 reason-required (code REASON_REQUIRED).
      parameters:
        - $ref: "#/components/parameters/PlatformAuditTenantId"
        - $ref: "#/components/parameters/PlatformAuditAction"
        - $ref: "#/components/parameters/PlatformAuditEntityType"
        - $ref: "#/components/parameters/PlatformAuditCreatedAfter"
        - $ref: "#/components/parameters/PlatformAuditCreatedBefore"
        - $ref: "#/components/parameters/PlatformAuditActorId"
        - $ref: "#/components/parameters/PlatformAuditActorType"
        - $ref: "#/components/parameters/PlatformAuditActorRole"
        - $ref: "#/components/parameters/PlatformAuditActorName"
        - $ref: "#/components/parameters/PlatformAuditIncludeValues"
        - $ref: "#/components/parameters/PlatformAuditReason"
      responses:
        "200":
          description: >
            CSV (Content-Disposition attachment, audit-log-YYYY-MM-DD-utc.csv, UTC date). Header row
            id,createdAt,tenantId,tenantName,tenantSlug,actorType,actorId,actorName,actorRole,ipAddress,action,entityType,entityId,before,after
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Forbidden: no audit_compliance:view (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /organization/invoice-series:
    get:
      tags: [Organization]
      summary: FIN-006 - list the facility's invoice, credit-note and receipt series (one row per kind and financial year)
      x-required-permission: setup:view
      responses:
        "200":
          description: Series rows
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSeriesList" } } }
        "403": { description: "Forbidden: no setup:view (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /organization/invoice-series/{kind}:
    put:
      tags: [Organization]
      summary: FIN-006 - set the prefix pattern of a series before its first use (pattern carries {FY}, e.g. SKN/{FY}/)
      x-required-permission: setup:edit
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [invoice, credit_note, receipt] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefixPattern]
              properties:
                prefixPattern: { type: string, maxLength: 40, example: "SKN/{FY}/" }
                taxRegistrationId: { type: string, format: uuid }
                fyStartMonth: { type: integer, minimum: 1, maximum: 12, description: "April in India, January elsewhere when omitted" }
      responses:
        "200":
          description: The series
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSeries" } } }
        "403": { description: "Forbidden: no setup:edit (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "SERIES_IN_USE: numbers were already issued (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "NUMBER_TOO_LONG: over 16 characters for an Indian GSTIN; INVALID_PREFIX_PATTERN; INVALID_TAX_REGISTRATION (problem+json)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /me/entitlements:
    get:
      tags: [Setup]
      summary: PLT-059. What this clinic may use (modules, killed features, seat limit) so staff-web hides navigation it does not have
      x-required-permission: isAuthenticated()
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules: { type: array, items: { type: object, properties: { code: { type: string }, enabled: { type: boolean } } } }
                  killedFeatures: { type: array, items: { type: string } }
                  seatLimit: { type: [integer, "null"] }
        "403": { description: "Not a clinic session" }
  /public/trials:
    post:
      tags: [Platform]
      summary: >
        ADM-003 (sign-up half). Start a free-trial sign-up: validates the mobile, pins the region from its country, refuses a second trial per mobile for 90 days
        (409 TRIAL_EXISTS), sends an OTP, and limits sign-ups to 5 per IP per hour (429 with Retry-After). 422 INVALID_MOBILE, MARKET_MISMATCH, MARKET_UNSUPPORTED.
        503 when OTP delivery is not wired (comms-gateway pre-tenant /otp: Needs external action). The mobile is stored only as an HMAC.
      security: []
      x-required-permission: public
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [clinicName, specialty, mobile, consentToContact], properties: { clinicName: { type: string }, specialty: { type: string, enum: [dermatology, dental, general_practice, paediatrics] }, mobile: { type: string }, market: { type: string }, consentToContact: { type: boolean } } } } }
      responses:
        "202": { description: OTP sent, content: { application/json: { schema: { type: object, properties: { signupId: { type: string, format: uuid }, otpChannel: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: TRIAL_EXISTS }
        "422": { description: "INVALID_MOBILE, MARKET_MISMATCH or MARKET_UNSUPPORTED" }
        "429": { description: Too many sign-ups (Retry-After) }
        "503": { description: Sign-up unavailable }
  /public/trials/{signupId}/verify:
    post:
      tags: [Platform]
      summary: >
        ADM-003 (sign-up half). Check the OTP (5 wrong tries burn the sign-up; 10 minutes). 400 OTP_INVALID, 410 SIGNUP_EXPIRED. Marks the sign-up verified; the provisioning job
        (`jobId`, null for now) and the demo clinic are not created yet.
      security: []
      x-required-permission: public
      parameters: [{ name: signupId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [otp], properties: { otp: { type: string } } } } }
      responses:
        "201": { description: Verified, content: { application/json: { schema: { type: object } } } }
        "400": { description: OTP_INVALID }
        "410": { description: SIGNUP_EXPIRED }
  /public/trials/{signupId}/status:
    get:
      tags: [Platform]
      summary: ADM-003 (sign-up half). Sign-up status (otp_sent, verified, provisioning, ready, expired). 410 for an unknown or expired sign-up. No login code yet.
      security: []
      x-required-permission: public
      parameters: [{ name: signupId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Status, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "410": { description: SIGNUP_EXPIRED }
  /plans/catalogue:
    get:
      tags: [Platform]
      summary: ADM-034. Public plan comparison for a market (no auth, Cache-Control public 5 min)
      security: []
      x-required-permission: public
      parameters:
        - { name: market, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Active plans offered in the market (current version)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    priceMinor: { type: integer }
                    currency: { type: string, enum: [INR, SAR, AED, QAR] }
                    pricingBasis: { type: string, enum: [per_clinic, per_doctor] }
                    modules: { type: array, items: { type: string } }
                    limits: { type: object, properties: { seats: { type: integer }, branches: { type: [integer, "null"] }, visitsPerMonth: { type: [integer, "null"] } } }
  /platform/tenants/{tenantId}/features:
    get:
      tags: [Platform]
      summary: PLT-059. A clinic's feature overrides
      x-required-permission: tenant_detail:view
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Overrides }
  /platform/tenants/{tenantId}/features/{code}:
    put:
      tags: [Platform]
      summary: >
        PLT-059. Set a per-clinic override (on, off, kill) with a reason and optional expiry; audited, effective within 60 s.
        kill answers 503 FEATURE_DISABLED on the clinic's writes, off answers 403 MODULE_NOT_IN_PLAN. Unknown code 404 UNKNOWN_FEATURE.
      x-required-permission: tenant_detail:edit
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, reason]
              properties:
                state: { type: string, enum: [on, off, kill] }
                reason: { type: string, maxLength: 500 }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: Override saved }
        "404": { description: UNKNOWN_FEATURE or unknown clinic }
  /platform/kill-switches/{code}:
    put:
      tags: [Platform]
      summary: PLT-059. Global kill switch, evaluated before any clinic override; no clinic can use the feature within 60 s
      x-required-permission: tenant_detail:edit
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active, reason]
              properties:
                active: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: Switch saved }
        "404": { description: UNKNOWN_FEATURE }
  /client-telemetry:
    post:
      tags: [Ops]
      summary: Ingest scrubbed web vitals and client errors (OPS-028)
      x-required-permission: isAuthenticated()
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, metric, route]
              properties:
                kind: { type: string, enum: [vital, error] }
                metric: { type: string, maxLength: 64 }
                value: { type: number }
                route: { type: string, maxLength: 200, description: "Path only; query string and fragment are cut" }
                message: { type: string, maxLength: 500, description: Accepted, never stored or logged }
                stackHash: { type: string, maxLength: 64 }
      responses:
        "202": { description: Accepted }
        "400": { description: Invalid report }
        "413": { description: "TOO_LARGE: body over 4096 bytes" }
        "429": { description: RATE_LIMITED }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token. Carries tenantId, staffId, roleId and permission set as
        claims — the server trusts only these, never client-supplied
        tenant/role headers.

  parameters:
    PlatformAuditIncludeValues:
      name: includeValues
      in: query
      description: PLT-056. true returns before/after; compliance_dpo only, needs reason.
      schema: { type: boolean, default: false }
    PlatformAuditReason:
      name: reason
      in: query
      description: PLT-056. Why the values are needed (1-500 chars); stored in master.operator_audit_log.reason.
      schema: { type: string, maxLength: 500 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        PLT-026. A UUID (the web client sends a UUIDv7) that is new for each user action and reused unchanged when that action is
        retried. Same key + same request replays the stored 2xx response with `Idempotent-Replayed: true` (no second side effect);
        same key + different request: 422 `IDEMPOTENCY_KEY_REUSED`; the first attempt still running: 409 `IDEMPOTENCY_IN_PROGRESS`;
        header missing or not a UUID: 400 `IDEMPOTENCY_KEY_REQUIRED`. Scoped to (tenant, staff member); only 2xx responses are kept
        (a 4xx/5xx releases the key so the retry runs again); stored responses are encrypted and purged after 24 h.
        Also required on POST /billing/invoices/{id}/payments, POST /packages/instances/items/{itemId}/book,
        POST /packages/instances/{id}/refund and POST /packages/refunds/{id}/approve.
      schema: { type: string, format: uuid }
    PlatformAuditTenantId:
      name: tenantId
      in: query
      schema: { type: string, format: uuid }
    PlatformAuditAction:
      name: action
      in: query
      description: Exact action, e.g. patient.create
      schema: { type: string }
    PlatformAuditEntityType:
      name: entityType
      in: query
      schema: { type: string }
    PlatformAuditCreatedAfter:
      name: createdAfter
      in: query
      description: Inclusive lower bound (ISO-8601 instant, e.g. 2026-10-01T00:00:00Z)
      schema: { type: string, format: date-time }
    PlatformAuditCreatedBefore:
      name: createdBefore
      in: query
      description: Inclusive upper bound (ISO-8601 instant)
      schema: { type: string, format: date-time }
    PlatformAuditActorId:
      name: actorId
      in: query
      description: Exact actor id (staff id or operator id)
      schema: { type: string, format: uuid }
    PlatformAuditActorType:
      name: actorType
      in: query
      description: Any other value is 400 invalid-actor-type
      schema: { type: string, enum: [staff, operator, system] }
    PlatformAuditActorRole:
      name: actorRole
      in: query
      description: Case-insensitive exact match on the role label snapshot (e.g. Doctor, super_admin)
      schema: { type: string }
    PlatformAuditActorName:
      name: actorName
      in: query
      description: Case-insensitive substring of the actor name snapshot; % and _ match literally. audit_log stores no actor email.
      schema: { type: string }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    DbUnavailable:
      description: >-
        OPS-003. Any endpoint can return this: the database cancelled the request (code DB_TIMEOUT, statement
        timeout 5 s / lock timeout 3 s) or no connection was free within 3 s (code DB_UNAVAILABLE). Safe to retry.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimited:
      description: >-
        PLT-008. Any endpoint except the OTP ones (always 202) can return this: a token bucket in Valkey is empty, per
        tenant (default 600/min, burst 1,200, raised per plan), per user (120/min) or, before sign-in, per client IP
        (20/min). type .../rate_limited, extra members dimension (tenant | user | ip) and retryAfterSeconds. Retry after
        the Retry-After seconds, with jitter.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    PatientNotFound:
      description: >-
        IDC-001. type .../patient-not-found. The patient (or the visit/document's patient) is unknown, has withdrawn
        data_processing consent, or is outside an own_patients_only caller's scope (no appointment or queue entry with her).
        Same body in every case; no patient data. An unverified caller (email or mobile) gets 403 verification-required first,
        exactly as on /patients/registry.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Not found (or out of scope — see per-endpoint note)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    BadRequest:
      description: Validation failed
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    StaffPage:
      description: Page of staff
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Staff" } }
              page: { $ref: "#/components/schemas/PageMeta" }
    StaffCreated:
      description: Invite created
      content: { application/json: { schema: { $ref: "#/components/schemas/Staff" } } }
    PatientPage:
      description: Page of patients
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Patient" } }
              page: { $ref: "#/components/schemas/PageMeta" }

  schemas:
    DuplicateBrief:
      type: object
      required: [patientId, mrn, displayName, dob, sex, phone]
      properties:
        patientId: { type: string, format: uuid }
        mrn: { type: string }
        displayName: { type: string }
        dob: { type: string, format: date }
        sex: { type: string }
        phone: { type: string }
        lastVisitAt: { type: string, format: date-time, nullable: true }
    UiPreferences:
      type: object
      properties:
        uiLocale: { type: string, nullable: true, enum: [en, hi, kn, te, ta, ml, bn, ar] }
        uiTheme: { type: string, enum: [system, dark, light] }
        digitStyle: { type: string, nullable: true, enum: [latn, arab] }
    UiPreferencesRead:
      allOf:
        - $ref: "#/components/schemas/UiPreferences"
        - type: object
          properties:
            clinicDefaultLocale: { type: string, nullable: true, enum: [en, hi, kn, te, ta, ml, bn, ar] }
    UiPreferencesWrite:
      type: object
      required: [uiTheme]
      properties:
        uiLocale: { type: string, nullable: true }
        uiTheme: { type: string, enum: [system, dark, light] }
        digitStyle: { type: string, nullable: true }
    DoctorSession:
      type: object
      required: [state]
      properties:
        sessionId: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [in, paused, out] }
        since: { type: [string, "null"], format: date-time }
    InvoiceSeries:
      type: object
      required: [id, kind, prefix, fiscalYear, nextNumber, prefixPattern, fyStartMonth, pad]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [invoice, credit_note, receipt] }
        prefix: { type: string, example: "SKN/25-26/" }
        fiscalYear: { type: string, example: "25-26" }
        nextNumber: { type: integer, format: int64 }
        taxRegistrationId: { type: string, format: uuid, nullable: true }
        prefixPattern: { type: string, nullable: true }
        fyStartMonth: { type: integer }
        pad: { type: integer }
    InvoiceSeriesList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InvoiceSeries" } }
    ClinicalDocumentCreate:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [visit_summary, referral, certificate] }
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
    NoteTemplate:
      type: object
      required: [id, name, subjective, objective, assessment, plan, tags, favourite, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subjective: { type: string }
        objective: { type: string }
        assessment: { type: string }
        plan: { type: string }
        tags: { type: array, items: { type: string } }
        favourite: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteTemplateCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        subjective: { type: [string, "null"], maxLength: 4000 }
        objective: { type: [string, "null"], maxLength: 4000 }
        assessment: { type: [string, "null"], maxLength: 4000 }
        plan: { type: [string, "null"], maxLength: 4000 }
        tags: { type: [array, "null"], maxItems: 10, items: { type: string, maxLength: 30 } }
        favourite: { type: [boolean, "null"] }
    NoteTemplateUpdate:
      type: object
      properties:
        name: { type: [string, "null"], maxLength: 80 }
        subjective: { type: [string, "null"], maxLength: 4000 }
        objective: { type: [string, "null"], maxLength: 4000 }
        assessment: { type: [string, "null"], maxLength: 4000 }
        plan: { type: [string, "null"], maxLength: 4000 }
        tags: { type: [array, "null"], maxItems: 10, items: { type: string, maxLength: 30 } }
        favourite: { type: [boolean, "null"] }
    ClinicalDocumentUpdate:
      type: object
      properties:
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
    ClinicalDocumentBody:
      type: object
      description: >
        Plain text fields typed by the doctor, max 4000 characters each. Allowed keys per type -
        visit_summary - diagnosis, assessment, plan, medicines, patientInstructions;
        referral - referredTo, department, reason, findings, notes;
        certificate - purpose, findings, restFrom (yyyy-mm-dd), restTo (yyyy-mm-dd), remarks.
      additionalProperties: { type: string }
    ClinicalDocumentSummaryPrefill:
      type: object
      properties:
        noteSigned: { type: boolean }
        prescriptionSigned: { type: boolean }
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
    ClinicalDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        type: { type: string, enum: [visit_summary, referral, certificate] }
        status: { type: string, enum: [draft, issued] }
        body: { $ref: "#/components/schemas/ClinicalDocumentBody" }
        header:
          type: [object, "null"]
          description: Snapshot taken at issue time; null while a draft. Never changes afterwards.
          properties:
            clinic: { type: object, properties: { name: { type: [string, "null"] }, region: { type: [string, "null"] } } }
            doctor: { type: object, properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } } }
            patient: { type: object, properties: { name: { type: string }, mrn: { type: string }, dob: { type: string, format: date }, gender: { type: string } } }
            visit: { type: object, properties: { queueEntryId: { type: string, format: uuid }, date: { type: string, format: date } } }
            issuedBy: { type: object, properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } } }
        issuedBy: { type: [string, "null"], format: uuid }
        issuedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VaccineRecordWrite:
      type: object
      required: [patientId, vaccineName, dose, route]
      properties:
        patientId: { type: string, format: uuid }
        queueEntryId: { type: [string, "null"], format: uuid }
        vaccineName: { type: string, maxLength: 200 }
        dose: { type: string, maxLength: 100 }
        route: { type: string, enum: [IM, IV, SC, infusion, oral, topical] }
        site: { type: [string, "null"], maxLength: 100 }
        lotNumber: { type: [string, "null"], maxLength: 100 }
        expiryDate: { type: [string, "null"], format: date }
        notes: { type: [string, "null"], maxLength: 1000 }
    VaccineRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        queueEntryId: { type: [string, "null"], format: uuid }
        vaccineName: { type: string }
        dose: { type: string }
        route: { type: string }
        site: { type: [string, "null"] }
        lotNumber: { type: [string, "null"] }
        expiryDate: { type: [string, "null"], format: date }
        notes: { type: [string, "null"] }
        recordedByName: { type: string }
        administeredAt: { type: string, format: date-time }
    Allergy:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        substance: { type: string }
        category: { type: [string, "null"], enum: [drug, food, environmental, other, null] }
        severity: { type: string, enum: [mild, moderate, severe] }
        reaction: { type: [string, "null"] }
        source: { type: [string, "null"], enum: [clinician, patient_reported, outside_record, null] }
        active: { type: boolean }
        recordedBy: { type: string, format: uuid }
        recordedByName: { type: [string, "null"] }
        recordedAt: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        deactivatedReason: { type: [string, "null"], description: "Why the entry was removed; null while active" }
        deactivatedAt: { type: [string, "null"], format: date-time }
        deactivatedByName: { type: [string, "null"] }
        unconfirmed: { type: boolean, description: "ADM-012: imported from a legacy list, a doctor still has to confirm it; a clinician correction clears it" }
    AllergyWrite:
      type: object
      required: [substance, severity]
      properties:
        substance: { type: string, maxLength: 200 }
        category: { type: string, enum: [drug, food, environmental, other] }
        severity: { type: string, enum: [mild, moderate, severe] }
        reaction: { type: string, maxLength: 500 }
        source: { type: string, enum: [clinician, patient_reported, outside_record] }
    AllergyCorrection:
      type: object
      required: [reason]
      properties:
        substance: { type: string, maxLength: 200 }
        category: { type: string, enum: [drug, food, environmental, other] }
        severity: { type: string, enum: [mild, moderate, severe] }
        reaction: { type: string, maxLength: 500 }
        source: { type: string, enum: [clinician, patient_reported, outside_record] }
        reason: { type: string, maxLength: 500 }
    AllergyEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        allergyId: { type: [string, "null"], format: uuid }
        event: { type: string }
        substance: { type: [string, "null"] }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }
        reason: { type: [string, "null"] }
        actorId: { type: string, format: uuid }
        actorName: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
    AllergyStatus:
      type: object
      properties:
        state: { type: string, enum: [recorded, none_documented, not_assessed] }
        activeCount: { type: integer }
        documentedBy: { type: [string, "null"], format: uuid }
        documentedByName: { type: [string, "null"] }
        documentedAt: { type: [string, "null"], format: date-time }
    PregnancyStatus:
      type: object
      properties:
        status: { type: string, enum: [not_documented, not_pregnant, pregnant, lactating, unknown] }
        expectedDeliveryDate: { type: [string, "null"], format: date }
        recordedBy: { type: [string, "null"], format: uuid }
        recordedByName: { type: [string, "null"] }
        recordedAt: { type: [string, "null"], format: date-time }
    RxWarningDecision:
      type: object
      required: [kind, reasonCode]
      properties:
        kind: { type: string, enum: [allergy, pregnancy, controlled] }
        reasonCode: { type: string, description: One of the codes offered in the warning's reasonOptions }
        note: { type: string, maxLength: 500 }
    PrescriptionItemWrite:
      type: object
      required: [drugName]
      properties:
        drugName: { type: string }
        dosage: { type: string }
        frequency: { type: string }
        duration: { type: string }
        instructions: { type: string }
        overrides: { type: array, items: { $ref: "#/components/schemas/RxWarningDecision" } }
        brandName: { type: [string, "null"], maxLength: 200, description: "DOC-033. Brand/product text. The safety checks (allergy, pregnancy, controlled) run on drugName AND brandName." }
        sigPattern: { type: [string, "null"], maxLength: 40, description: "DOC-033. Morning-noon-night pattern as entered, e.g. 1-0-1. `frequency` stays the free-text sig." }
        route: { type: [string, "null"], maxLength: 40, description: "DOC-033. Route as entered (oral, topical, ...); not interpreted by the server." }
        quantity: { type: [number, "null"], exclusiveMinimum: 0, description: "DOC-033. Quantity to dispense, as entered by the doctor; never derived or converted by the server." }
        quantityUnit: { type: [string, "null"], maxLength: 40, description: "DOC-033. Unit of quantity as entered (tablets, ml, ...); never converted." }
    DrugSuggestion:
      type: object
      description: "DOC-033. A type-ahead suggestion from the tenant's own data. Not a clinical formulary: no dose, strength or class."
      properties:
        name: { type: string }
        source: { type: string, enum: [pharmacy, history], description: "pharmacy = the tenant's pharmacy item master; history = a name this tenant has prescribed before" }
        code: { type: [string, "null"], description: "Pharmacy item code (pharmacy only)" }
        inStock: { type: [boolean, "null"] }
        prescriptionOnly: { type: [boolean, "null"] }
    FavouriteRxSet:
      type: object
      description: "DOC-035. scope is relative to the caller. staleCheckAvailable false = the tenant has no active pharmacy items, so staleness is unknown (staleItemCount 0 does not mean up to date)."
      properties:
        id: { type: string, format: uuid }
        doctorId: { type: [string, "null"], format: uuid, description: "null = clinic standard" }
        ownerName: { type: [string, "null"] }
        name: { type: string }
        scope: { type: string, enum: [mine, shared, standard] }
        shared: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        staleCheckAvailable: { type: boolean }
        staleItemCount: { type: integer }
        canEdit: { type: boolean, description: "caller is the owner or holds clinical:approve" }
        items:
          type: array
          items:
            type: object
            properties:
              drugName: { type: string }
              dosage: { type: [string, "null"] }
              frequency: { type: [string, "null"] }
              duration: { type: [string, "null"] }
              instructions: { type: [string, "null"] }
              brandName: { type: [string, "null"] }
              sigPattern: { type: [string, "null"] }
              route: { type: [string, "null"] }
              quantity: { type: [number, "null"] }
              quantityUnit: { type: [string, "null"] }
              stale: { type: [boolean, "null"] }
    RxWarning:
      type: object
      properties:
        kind: { type: string, enum: [allergy, pregnancy, controlled] }
        severity: { type: string, description: "mild|moderate|severe for allergies, caution otherwise" }
        message: { type: string }
        matched: { type: [string, "null"] }
        requiresDecision: { type: boolean }
        resolved: { type: boolean }
        reasonOptions:
          type: array
          items: { type: object, properties: { code: { type: string }, label: { type: string } } }
        decision:
          type: [object, "null"]
          properties:
            kind: { type: string }
            reasonCode: { type: string }
            reasonLabel: { type: string }
            note: { type: [string, "null"] }
            by: { type: string, format: uuid }
            byName: { type: [string, "null"] }
            at: { type: string, format: date-time }
    PrescriptionWarning:
      type: object
      required: [itemIndex, kind, severity, message]
      properties:
        itemIndex: { type: integer, minimum: 0, description: "0-based index into the response's items" }
        kind: { type: string, enum: [allergy, pregnancy, controlled], description: "pregnancy also covers lactation. Each kind that requires a decision uses the same items[].overrides[] reason flow and is audited with warningKind (DOC-032)." }
        severity: { type: string, enum: [mild, moderate, severe, caution], description: "mild|moderate|severe for allergies; caution for pregnancy/controlled (severe when raised by a recorded pregnant/lactating status)" }
        message: { type: string }
    PrescriptionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        drugName: { type: string }
        dosage: { type: [string, "null"] }
        frequency: { type: [string, "null"] }
        duration: { type: [string, "null"] }
        instructions: { type: [string, "null"] }
        allergyOverrideReason: { type: [string, "null"] }
        displayOrder: { type: integer }
        allergyWarning: { type: [string, "null"] }
        pregnancyWarning: { type: [string, "null"] }
        controlledSubstanceWarning: { type: [string, "null"] }
        warnings: { type: array, items: { $ref: "#/components/schemas/RxWarning" } }
        brandName: { type: [string, "null"] }
        sigPattern: { type: [string, "null"] }
        route: { type: [string, "null"] }
        quantity: { type: [number, "null"] }
        quantityUnit: { type: [string, "null"] }
    PharmacySettings:
      type: object
      properties:
        mode: { type: string, enum: [external, hybrid, in_house] }
    PharmacySettingsWrite:
      type: object
      properties:
        mode: { type: string, enum: [external, hybrid, in_house] }
        reason: { type: string, minLength: 3, maxLength: 200, description: Required when mode changes. }
    PharmacyItemWrite:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1 }
        isRx: { type: boolean }
        hsnCode: { type: [string, "null"] }
        price: { type: number, minimum: 0 }
        taxRatePercent: { type: [number, "null"], minimum: 0, description: Defaults to 0 }
        stockQty: { type: [integer, "null"], minimum: 0, description: Opening stock on POST; ignored on PATCH }
    BillingCharge:
      type: object
      description: Row of the checkout / OTC charge lists (ChargeResponse).
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        baseAmount: { type: number }
        followUpAmount: { type: [number, "null"] }
        taxRatePercent: { type: number }
        stockQty: { type: [integer, "null"], description: "Units on hand; null when the item is not stock-tracked. PHA-011." }

    DispensingQueueEntry:
      type: object
      properties:
        prescriptionId: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        doctorName: { type: string }
        signedAt: { type: string, format: date-time }
        token: { type: integer, description: "The visit's queue token number (same value as QueueEntry.tokenNumber). PHA-003." }
        items:
          type: array
          items:
            type: object
            properties:
              stockQty:
                type: [integer, "null"]
                description: "Current stock of the active pharmacy item whose name equals drugName (case-insensitive); null when no stocked item matches. Prescription items carry no catalogue link, so this is a name match. PHA-003."
              drugName: { type: string }
              dosage: { type: [string, "null"] }
              frequency: { type: [string, "null"] }
              duration: { type: [string, "null"] }
              instructions: { type: [string, "null"] }
    VitalsWrite:
      type: object
      description: Every field optional; null or absent keeps the stored value. Bounds are plausibility limits, not clinical normal ranges.
      properties:
        heightCm: { type: [number, "null"], minimum: 20, maximum: 250 }
        weightKg: { type: [number, "null"], minimum: 0.2, maximum: 400 }
        bpSystolic: { type: [integer, "null"], minimum: 20, maximum: 300 }
        bpDiastolic: { type: [integer, "null"], minimum: 10, maximum: 200 }
        pulseBpm: { type: [integer, "null"], minimum: 20, maximum: 300 }
        tempCelsius: { type: [number, "null"], minimum: 20, maximum: 45 }
        spo2Percent: { type: [integer, "null"], minimum: 1, maximum: 100 }
        bloodSugar: { type: [number, "null"], exclusiveMinimum: 0, maximum: 9999.99, description: "Display unit mg/dL is a UI constant, not stored (needs clinical sign-off). No clinical range is enforced." }
        painScore: { type: [integer, "null"], minimum: 0, maximum: 10, description: "0-10 numeric rating scale; outside 0-10 is 400." }
    NursingWorklist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [entry, patient, vitals]
            properties:
              entry: { $ref: "#/components/schemas/QueueEntry" }
              patient: { oneOf: [{ $ref: "#/components/schemas/PatientDetail" }, { type: "null" }] }
              vitals: { oneOf: [{ $ref: "#/components/schemas/Vitals" }, { type: "null" }] }
    Vitals:
      type: object
      properties:
        id: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        heightCm: { type: [number, "null"] }
        weightKg: { type: [number, "null"] }
        bpSystolic: { type: [integer, "null"] }
        bpDiastolic: { type: [integer, "null"] }
        pulseBpm: { type: [integer, "null"] }
        tempCelsius: { type: [number, "null"] }
        spo2Percent: { type: [integer, "null"] }
        bloodSugar: { type: [number, "null"] }
        painScore: { type: [integer, "null"], minimum: 0, maximum: 10 }
        recordedBy: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
        abnormalFlags: { type: array, items: { type: string } }
    VitalsHistory:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Vitals" } }
    DoseCalculation:
      type: object
      properties:
        weightKg: { type: number }
        mgPerKg: { type: number }
        totalDoseMg: { type: number }
        ruleSource: { type: string }
        weightRecordedAt: { type: [string, "null"], format: date-time, description: When the weight used was recorded. Null when unknown (weight saved before the date was tracked); never estimated from the visit row time. Clients should treat null as stale. }
        weightStale: { type: boolean, description: "True when the weight is older than the policy window (30 days under 2 years of age, 90 days otherwise; CSO to confirm) or its date is unknown." }
    DrugDetail:
      type: object
      properties:
        id: { type: string }
        brand: { type: string }
        generic: { type: array, items: { type: string } }
        strength: { type: [string, "null"] }
        form: { type: [string, "null"] }
        route: { type: [string, "null"] }
        schedule: { type: array, items: { type: string } }
        pregnancyCategory: { type: [string, "null"] }
        lactationNote: { type: [string, "null"] }
        status: { type: string, enum: [active, retired] }
        ingredients: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, amount: { type: [number, "null"] }, unit: { type: [string, "null"] } } } }
        classes: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
        source: { type: object, properties: { kb: { type: [string, "null"] }, month: { type: [string, "null"] } } }
    DrugSummary:
      type: object
      properties:
        id: { type: string }
        brand: { type: string }
        strength: { type: [string, "null"] }
        form: { type: [string, "null"] }
        generic: { type: array, items: { type: string } }
        schedule: { type: array, items: { type: string } }
    PharmacyItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isRx: { type: boolean }
        hsnCode: { type: [string, "null"] }
        price: { type: number }
        taxRatePercent: { type: number }
        stockQty: { type: integer, minimum: 0 }
        active: { type: boolean }
        drugId: { type: [string, "null"], description: "CLN-019: linked drug master product" }
    PharmacyStockAdjustment:
      type: object
      required: [reason]
      description: Exactly one of delta or setTo.
      properties:
        delta: { type: [integer, "null"], minimum: -1000000, maximum: 1000000, description: Relative change; negative removes units }
        setTo: { type: [integer, "null"], minimum: 0, maximum: 10000000, description: Counted total after a stock-take }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PharmacyStockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [adjustment, dispense, restock] }
        delta: { type: integer }
        qtyBefore: { type: integer }
        qtyAfter: { type: integer }
        reason: { type: string }
        actorId: { type: [string, "null"], format: uuid }
        actorName: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
    PrescriptionPrintHeader:
      type: object
      properties:
        prescriptionId: { type: string, format: uuid }
        signedAt: { type: [string, "null"], format: date-time }
        clinicName: { type: string }
        clinicRegion: { type: string, enum: [IN, KSA] }
        clinicPhone: { type: [string, "null"], description: "Clinic WhatsApp number from clinic setup" }
        prescriberId: { type: [string, "null"], format: uuid, description: "Who signed (the visit's doctor or a clinical:approve holder)" }
        prescriberName: { type: [string, "null"] }
        professionalRegistrationNo: { type: [string, "null"], description: "From the staff record; null when not set" }
    StaffClinicalLicence:
      type: object
      required: [staffId, isClinician, hasRegistrationNo]
      properties:
        staffId: { type: string, format: uuid }
        isClinician: { type: boolean }
        hasRegistrationNo: { type: boolean }
        licenceExpiresOn: { type: [string, "null"], format: date }
        licenceOverrideUntil: { type: [string, "null"], format: date-time }
    Prescription:
      type: object
      properties:
        id: { type: string, format: uuid }
        queueEntryId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        signedAt: { type: [string, "null"], format: date-time }
        signedBy: { type: [string, "null"], format: uuid, description: "CLN-005: staff id of the signer; null on a draft" }
        signedByRegistrationNo: { type: [string, "null"], description: "CLN-005: the registration number the signer signed under" }
        items: { type: array, items: { $ref: "#/components/schemas/PrescriptionItem" } }
        unresolvedWarnings: { type: integer }
        warnings:
          type: array
          description: >-
            DOC-031. Flat structured allergy matches across all lines (same check as items[].warnings and the legacy
            allergyWarning strings, which are kept). Recomputed on every read. Pregnancy/lactation and controlled-substance
            warnings (DOC-032) are included too, with severity "caution"; the decision state (requiresDecision, resolved, reasonOptions, decision) is on items[].warnings.
            A severe match still blocks signing (409 warning-unresolved) until an override reason is recorded.
          items: { $ref: "#/components/schemas/PrescriptionWarning" }
        allergySnapshot:
          description: >-
            DOC-R3: the allergy statement captured when this prescription was signed (what the sign gate checked).
            Never recomputed, so later allergy-register changes do not alter it. Null for a draft, and null for a
            prescription signed before this snapshot existed (migration V79); a signed prescription with a null
            snapshot must be shown as "allergy status at signing not recorded", never filled from the current register.
          oneOf:
            - { $ref: "#/components/schemas/PrescriptionAllergySnapshot" }
            - { type: "null" }
        safetyDictionaryVersion:
          type: [string, "null"]
          description: "CLN-004. Safety dictionary version active when the prescription was signed (e.g. 'IN v1'); null for a draft or a prescription signed before V1211."
    DrugKnowledgeBaseSource:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        source: { type: [string, "null"], description: "Licensed KB name as agreed in the licence attribution clause" }
        dataMonth: { type: [string, "null"], pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-10" }
    SafetyDictionaryActive:
      type: object
      properties:
        region: { type: string, enum: [IN, SA, AE, QA] }
        version: { type: integer }
        label: { type: string, description: "e.g. 'IN v1'" }
        approvedBy: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        source: { type: string }
        controlledLabel: { type: object, additionalProperties: { type: string }, description: "Controlled-substance warning label per language (en always; ar/hi when supplied by the CSO)" }
    SafetyDictionaryVersion:
      type: object
      properties:
        versionId: { type: string, format: uuid }
        region: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, approved, active, retired] }
        checksum: { type: string }
        csoApprovalRef: { type: [string, "null"] }
        approvedBy: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    SafetyDictionaryUpload:
      type: object
      properties:
        versionId: { type: string, format: uuid }
        region: { type: string }
        version: { type: integer }
        status: { type: string }
        checksum: { type: string }
        created: { type: boolean }
        diffSummary: { type: object, description: "comparedTo, added/removed counts per kind, addedEntries/removedEntries (up to 200 each)" }
    SafetyDictionaryItem:
      type: object
      required: [value]
      properties:
        classId: { type: [string, "null"], description: "terms and stems only" }
        value: { type: string, minLength: 3, maxLength: 100 }
        lang: { type: [string, "null"], description: "e.g. en, ar, hi" }
        matchKind: { type: [string, "null"], enum: [term, stem, null], description: "pregnancyRisk and controlled only (required there)" }
    SafetyDictionaryBundle:
      type: object
      required: [classes, labels]
      properties:
        classes:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              crossReactsTo: { type: array, items: { type: string }, description: "one direction only" }
        terms: { type: array, items: { $ref: "#/components/schemas/SafetyDictionaryItem" }, description: "whole words" }
        stems: { type: array, items: { $ref: "#/components/schemas/SafetyDictionaryItem" }, description: "fragments matched anywhere in a word" }
        exclusions: { type: array, items: { $ref: "#/components/schemas/SafetyDictionaryItem" }, description: "not-the-stem words blanked before stem matching" }
        pregnancyRisk: { type: array, items: { $ref: "#/components/schemas/SafetyDictionaryItem" } }
        controlled: { type: array, items: { $ref: "#/components/schemas/SafetyDictionaryItem" } }
        labels:
          type: object
          properties:
            controlled: { type: object, additionalProperties: { type: string }, description: "lang -> label; en required" }
    PrescriptionAllergySnapshot:
      type: object
      required: [state, allergies]
      properties:
        state:
          type: string
          enum: [recorded, none_documented, not_assessed]
          description: Same meaning as AllergyStatus.state, at the moment of signing.
        allergies:
          type: array
          description: Active register entries at signing (empty unless state is recorded).
          items:
            type: object
            properties:
              substance: { type: string }
              severity: { type: string }
              reaction: { type: [string, "null"] }
        documentedBy: { type: [string, "null"], format: uuid, description: "Who documented no known allergies; null unless none_documented" }
        documentedByName: { type: [string, "null"] }
        documentedAt: { type: [string, "null"], format: date-time }
    PackageRefund:
      type: object
      description: FIN-004 RefundResponse. refundAmount is the request-time amount; recomputedAmount is set at approval.
      properties:
        id: { type: string, format: uuid }
        instanceId: { type: string, format: uuid }
        patientName: { type: string }
        packageName: { type: string }
        reason: { type: string }
        usedListValue: { type: number }
        refundAmount: { type: number }
        amountOwed: { type: number }
        status: { type: string, enum: [pending, approved, rejected] }
        creditNoteNumber: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        recomputedAmount: { type: [number, "null"] }
    Problem:
      type: object
      description: RFC 7807
      properties:
        type: { type: string, format: uri, example: "https://api.nabd.health/errors/validation-failed" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        traceId: { type: string }
        retryAfterSeconds: { type: integer, description: "423 account-locked only" }
        code: { type: string, description: "Stable machine code on 503s (DB_TIMEOUT, DB_UNAVAILABLE); absent elsewhere", example: DB_TIMEOUT }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PlatformAuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: [string, "null"], format: uuid, description: "null = platform-scope event (no single clinic; V126 platform chain)" }
        tenantName: { type: [string, "null"] }
        tenantSlug: { type: [string, "null"] }
        actorType: { type: string, enum: [staff, operator, system] }
        actorId: { type: [string, "null"], format: uuid }
        actorName: { type: string }
        actorRole: { type: string }
        ipAddress: { type: [string, "null"] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, "null"], format: uuid }
        before: { description: Prior state as stored (JSON), null for a create }
        after: { description: New state as stored (JSON), null for a delete }
        createdAt: { type: string, format: date-time }
    PageMeta:
      type: object
      properties:
        nextCursor: { type: [string, "null"] }
        limit: { type: integer }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        refreshExpiresIn: { type: integer, example: 2592000, description: "FEF-009: seconds until the refresh token (session) expires; the BFF uses it as the refresh cookie's Max-Age" }

    PendingWorkspaceToken:
      type: object
      description: Not a session — only usable against /owners/me/workspaces and /owners/workspaces/select.
      properties:
        pendingToken: { type: string }
        expiresIn: { type: integer, example: 300 }

    ClinicSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        region: { type: string, enum: [IN, KSA] }
        status: { type: string, enum: [provisioning, trialing, active, overdue, suspended, offboarding, offboarded] }

    BrandWorkspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        clinics: { type: array, items: { $ref: "#/components/schemas/ClinicSummary" } }

    WorkspaceList:
      type: object
      properties:
        brands: { type: array, items: { $ref: "#/components/schemas/BrandWorkspace" } }

    MfaSetupRequired:
      type: object
      description: PLT-005 / NB-042 - policy requires MFA and none is enrolled; the token only reaches the enrol/confirm endpoints.
      properties:
        setupToken: { type: string }
        expiresIn: { type: integer, example: 300 }

    OwnerWorkspaceToken:
      type: object
      properties:
        workspaceToken: { type: string, description: "owner_select token for /owners/me/workspaces and /owners/workspaces/select" }
        expiresIn: { type: integer, example: 300 }
        remainingRecoveryCodes: { type: integer, nullable: true }

    MfaChallenge:
      type: object
      properties:
        challengeId: { type: string, description: "Opaque signed token, not a UUID" }
        method: { type: string, enum: [totp, sms] }
        expiresIn: { type: integer, example: 300 }

    StepUpToken:
      type: object
      description: PLT-007 - bound to the minting session (sid) and tenant; any other access token gets 403 STEP_UP_INVALID
      properties:
        stepUpToken: { type: string }
        expiresIn: { type: integer, example: 300 }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        device: { type: string }
        ip: { type: string }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }

    StaffInviteRequest:
      type: object
      required: [email, name, mobilePhone, roleId]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        mobilePhone: { type: string, description: "Required for WhatsApp OTP login and mobile verification (NB-041)" }
        roleId: { type: string, format: uuid }
        scope: { type: string, enum: [own_patients_only, all_clinic_patients], default: all_clinic_patients }

    StaffPatch:
      type: object
      properties:
        roleId: { type: string, format: uuid }
        scope: { type: string, enum: [own_patients_only, all_clinic_patients] }
        fieldGrants:
          type: array
          items: { type: string, example: "no_financial_fields" }
        departmentId: { type: [string, "null"], format: uuid }
        professionalRegistrationNo:
          type: [string, "null"]
          pattern: "^$|^[A-Za-z0-9][A-Za-z0-9 ./-]{0,39}$"
          description: "DOC-N1. Omitted/null = unchanged; empty string = clear; otherwise 1-40 characters of letters, digits, space . / -. Audited (the audit row records set/changed/cleared, not the value). Requires staff:edit."
        clinician:
          type: [boolean, "null"]
          description: "PLT-016. Omitted/null = unchanged, except that recording a new registration number sets it. true needs a registration number (400 clinician-needs-registration). Audited (staff.clinician_set / staff.clinician_cleared)."

    Staff:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        mobilePhone: { type: [string, "null"] }
        roleId: { type: string, format: uuid }
        status: { type: string, enum: [invited, active, suspended] }
        scope: { type: string, enum: [own_patients_only, all_clinic_patients] }
        emailVerified: { type: boolean }
        mobileVerified: { type: boolean, description: "Patient data is unreachable until both this and emailVerified are true (NB-041)" }
        lastSeenAt: { type: [string, "null"], format: date-time }
        professionalRegistrationNo: { type: [string, "null"], description: "DOC-N1. Medical council / SCFHS registration number; null when not set" }
        loginMethod:
          type: string
          readOnly: true
          enum: [owner_account, invite_pending, authenticator, authenticator_setup_required, pin_or_whatsapp_otp, pin, whatsapp_otp, none]
          description: >
            OWN-034. Derived from stored credentials, first match wins: owner_account (Owner-linked row; signs in
            through /owners/auth/login with the Owner's email + PIN), invite_pending (invite not accepted), authenticator
            (MFA enrolled; every sign-in ends with a TOTP code), authenticator_setup_required (role requires MFA, not yet
            enrolled; next sign-in forces enrolment), then the first factors available: pin_or_whatsapp_otp, pin,
            whatsapp_otp, none. Which first factor was actually used at a sign-in is not recorded, so it is never guessed.
            Independent of status (a suspended account keeps its method but cannot sign in).
        loginFactors:
          type: array
          readOnly: true
          items: { type: string, enum: [pin, whatsapp_otp, authenticator] }
          description: "OWN-034. Factors this staff row can use: pin (PIN set), whatsapp_otp (mobile on file), authenticator (MFA enrolled). Empty for invite_pending and owner_account."
        clinician: { type: boolean, description: "PLT-016 (staff.is_clinician): drives doctor pickers, schedules and queue assignment instead of role names" }

    RoleWrite:
      type: object
      required: [name, grants]
      properties:
        name: { type: string }
        grants:
          type: array
          description: One entry per module the role touches
          items: { $ref: "#/components/schemas/ModuleGrant" }
        mfaRequired:
          type: boolean
          description: >
            Optional; omitted keeps the current value (false on create). PLT-005: on a Role this is the effective value,
            always true for the built-in Owner role and any role with :approve or :refundDiscount; sending false for such
            a role is 422 mfa-required-by-policy.

    Role:
      allOf:
        - $ref: "#/components/schemas/RoleWrite"
        - type: object
          properties:
            id: { type: string, format: uuid }
            builtIn: { type: boolean }
            presetCode: { type: [string, "null"], enum: [owner, owner_doctor, doctor, nurse, receptionist, frontdesk_vitals, null], description: "PLT-016: null for a custom role" }
            presetVersion: { type: [integer, "null"], description: "PLT-016: preset definition version the grants were last set from" }

    ModuleGrant:
      type: object
      required: [module]
      properties:
        module:
          type: string
          enum: [patients, queue, clinical, billing, packages, pharmacy, reports, staff, setup, compliance]
        view: { type: boolean, default: false }
        create: { type: boolean, default: false }
        edit: { type: boolean, default: false }
        delete: { type: boolean, default: false }
        approve: { type: boolean, default: false }
        refundDiscount:
          type: boolean
          default: false
          description: On the billing module this also puts the string `billing.discount` in the JWT/session permissions list; POST /v1/billing/checkout/{queueEntryId} and /v1/billing/otc-checkout return 403 (discount-not-permitted) for a non-zero discount without it.
        export: { type: boolean, default: false }
        breakGlass: { type: boolean, default: false, description: "Only on module clinical: puts clinical:breakGlass in the permissions list (PLT-012)" }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        region: { type: string, enum: [IN, KSA] }
        plan: { type: string }
        status: { type: string, enum: [provisioning, trialing, active, overdue, suspended, offboarding, offboarded] }

    BranchWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }

    Branch:
      allOf:
        - $ref: "#/components/schemas/BranchWrite"
        - type: object
          properties: { id: { type: string, format: uuid } }

    PatientWrite:
      type: object
      required: [name, phone, dob, gender]
      properties:
        name: { type: string, description: "Stored/searched as-entered; any script" }
        phone: { type: string }
        dob: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        guardianId: { type: [string, "null"], format: uuid, description: "Required if patient is a minor" }
        address: { type: string }
        nationalId:
          type: [string, "null"]
          description: "Aadhaar/Iqama — column-level encrypted at rest (NB-140), never returned in list responses"
        confirmedNotDuplicate:
          type: [boolean, "null"]
          description: "Set after staff reviewed the 409 duplicate candidates and confirmed this is a different person; skips the duplicate check"
        guardianConsent:
          type: object
          description: >
            CGV-005. Required whenever guardianId is supplied, else 400 `guardian-consent-required`
            (also when confirmed is not true or channel is not one of the listed values). Stored with the
            guardian_access consent (captured_by = calling staff, capture_channel, granted_at) and audited
            in `patient.guardian_grant` (consentChannel). PATCH guardian changes are unchanged.
          required: [confirmed, channel]
          properties:
            confirmed: { type: boolean, description: "Must be true" }
            channel: { type: string, enum: [in_person, phone, written] }
        synthetic:
          type: [boolean, "null"]
          description: "ADM-002. true marks a demo patient. While the clinic's data gate is demo_only only synthetic patients can be created; a real one returns 403 DPA_REQUIRED and writes nothing."

    PatientPatch:
      type: object
      description: >
        True partial update. Only properties present in the body are written; absent ones are left
        unchanged (so revoking a guardian is {"guardianId": null} and cannot touch address/nationalId).
        guardianId, address and nationalId accept an explicit null to clear. name/phone/dob/gender
        cannot be null. A minor (computed from the resulting dob) must keep a guardian.
        A blank ("" or whitespace) address or nationalId is 400 validation-failed: clear with an explicit null, never with an empty string.
      properties:
        name: { type: string }
        phone: { type: string }
        dob: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        guardianId: { type: [string, "null"], format: uuid }
        address: { type: [string, "null"] }
        nationalId: { type: [string, "null"], description: "Column-level encrypted at rest; never returned" }

    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        mrn: { type: string }
        name: { type: string }
        phone: { type: string }
        dob: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        status: { type: string, enum: [active, merged] }
        matchedOn: { type: string, enum: [phone, mrn, name], description: "Search results only (OPS-009): which index branch found the patient" }

    PatientDetail:
      allOf:
        - $ref: "#/components/schemas/Patient"
        - type: object
          properties:
            allergies: { type: array, items: { type: string } }
            chronicConditions: { type: array, items: { type: string } }
            activePackages: { type: integer }
            outstandingBalance: { type: number }
            lastVisit: { type: [string, "null"], format: date, description: "LIVE-03: last visit, SAME definition as PatientRegistryRow.lastVisit — the latest queue_date (tenant-local day) of any queue entry for this patient whose status is not no_show (a visit in progress today counts). Omitted when the patient has no such entry. Use this for display." }
            lastVisitAt: { type: [string, "null"], format: date-time, deprecated: true, description: "NB-074, deprecated by LIVE-03: updated_at of the latest COMPLETED queue entry — a different definition from lastVisit / the registry; do not display alongside the registry value." }
            guardianReviewKeptAt: { type: [string, "null"], format: date-time, description: "CGV-002: when staff chose keep-proxy at the age-18 review; cleared if the guardian changes" }

    PatientRegistryRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        mrn: { type: string }
        name: { type: string }
        phone: { type: string }
        age: { type: integer }
        gender: { type: string }
        minor: { type: boolean }
        lastVisit: { type: [string, "null"], format: date, description: "LIVE-03: latest queue_date (tenant-local day) of any queue entry for this patient whose status is not no_show; same definition as PatientDetail.lastVisit" }
        nextAppointment: { type: [string, "null"], format: date-time }
        nextDoctorName: { type: [string, "null"] }
        nextDoctorId: { type: [string, "null"], format: uuid }
        nextAppointmentId: { type: [string, "null"], format: uuid }
        nextAppointmentToday: { type: boolean }
        packageSessionsUsed: { type: [integer, "null"] }
        packageSessionsTotal: { type: [integer, "null"] }
        condition: { type: [string, "null"] }
        followUpDue: { type: boolean }
        allergy: { type: [string, "null"] }
        balanceDue: { type: boolean }
        duplicate: { type: boolean }
        archived: { type: boolean }
        queueToken: { type: [integer, "null"] }
        queueStatus: { type: [string, "null"] }
        tags: { type: array, items: { type: string, enum: [recent, followup, package, balance, duplicate, archived] } }

    PatientMatchCandidate:
      type: object
      description: >
        A likely duplicate returned with the 409 on registration. Never carries the national ID
        (it is not compared and not returned).
      properties:
        patientId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        matchScore:
          type: number
          minimum: 0
          maximum: 1
          description: >
            0..1, not a percentage. 1.0 when the mobile number matches (digits only); otherwise the
            trigram similarity of the names when the date of birth matches. Candidates are returned
            highest score first (at most 5).
        matchedFields:
          type: array
          description: >
            REC-038: which compared fields agreed, in this order: phone (same digits), dob (same date),
            name (trigram similarity above 0.3). Only these three fields are compared.
          items: { type: string, enum: [phone, dob, name] }

    WorkingHoursWrite:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday..6=Saturday" }
        startTime: { type: string, example: "09:00" }
        endTime: { type: string, example: "17:00" }
        slotMinutes: { type: integer, default: 15, minimum: 1 }
        maxPatients: { type: [integer, "null"], minimum: 1, description: "Session cap shared by scheduled + walk-in patients together; null = uncapped (NB-098)" }

    WorkingHours:
      allOf:
        - $ref: "#/components/schemas/WorkingHoursWrite"
        - type: object
          properties: { id: { type: string, format: uuid } }

    DoctorLeaveWrite:
      type: object
      required: [dateFrom, dateTo]
      properties:
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        reason: { type: string }

    DoctorLeave:
      allOf:
        - $ref: "#/components/schemas/DoctorLeaveWrite"
        - type: object
          properties: { id: { type: string, format: uuid } }

    AppointmentWrite:
      type: object
      required: [patientId, doctorId, startTime]
      properties:
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }

    WaitlistEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        joinedAt: { type: string, format: date-time }
        status: { type: string, enum: [waiting, offered, booked, expired, cancelled] }
        offeredSlotStart: { type: [string, "null"], format: date-time }
        offerExpiresAt: { type: [string, "null"], format: date-time }
        bookedAppointmentId: { type: [string, "null"], format: uuid }

    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, arrived, cancelled, completed, no_show] }
        isFollowUp: { type: boolean }
        cancelReason: { type: [string, "null"], description: "QA-06: the reason given on cancel (\"rescheduled\" for the old slot of a reschedule); null unless cancelled" }

    DelayAnnounceRequest:
      type: object
      required: [delayMinutes]
      properties:
        delayMinutes: { type: integer, minimum: 1, maximum: 240 }
        reason: { type: string, maxLength: 200 }
    DoctorDelay:
      type: object
      properties:
        id: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        delayMinutes: { type: integer }
        reason: { type: string, nullable: true }
        announcedBy: { type: string, format: uuid }
        announcedAt: { type: string, format: date-time }
        clearedBy: { type: string, format: uuid, nullable: true }
        clearedAt: { type: string, format: date-time, nullable: true }
        clinicDate: { type: string, format: date, description: "Clinic-timezone day the delay was announced; it lapses at the end of that day" }
        active: { type: boolean, description: "Uncleared AND clinicDate is today" }
    CheckInRequest:
      type: object
      required: [patientId, doctorId]
      properties:
        appointmentId: { type: [string, "null"], format: uuid, description: "Omit for a walk-in" }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        source: { type: [string, "null"], enum: [walk_in, referral, online, social_media, returning, other], description: "Defaults to walk_in" }
        presentingComplaint: { type: [string, "null"] }
        paymentMode: { type: [string, "null"], enum: [cash, card, upi, other] }

    QueueEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        appointmentId: { type: [string, "null"], format: uuid }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        queueDate: { type: string, format: date }
        tokenNumber: { type: integer }
        status: { type: string, enum: [checked_in, waiting, vitals_pending, vitals_done, in_consult, checkout_pending, completed, no_show] }
        source: { type: string, enum: [walk_in, referral, online, social_media, returning, other, internal_transfer] }
        presentingComplaint: { type: [string, "null"] }
        paymentMode: { type: [string, "null"], enum: [cash, card, upi, other] }
        priority: { type: boolean }
        priorityReason: { type: [string, "null"] }
        ageYears: { type: [integer, "null"], description: "Whole years at queueDate (NUR-012)" }
        gender: { type: [string, "null"], enum: [male, female, other, null] }
        doctorName: { type: [string, "null"] }
        waitMinutes: { type: integer, description: "Minutes since check-in on the server clock, >= 0" }
        visitType: { type: string, enum: [appointment, follow_up, walk_in, transfer] }
        appointmentStatus: { type: [string, "null"], description: "Status of the linked appointment (arrived after check-in); null for walk-ins (ACC-003)" }
        transferReason: { type: [string, "null"], enum: [wrong_department, doctor_unavailable, patient_request, other, null], description: "Set on legs opened by a transfer (REC-021)" }
        transferReasonNote: { type: [string, "null"], maxLength: 200 }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorStaffId: { type: string, format: uuid }
        action: { type: string, example: "patient.merge" }
        resourceType: { type: string }
        resourceId: { type: string }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }

    SetupChecklistItem:
      type: object
      properties:
        step: { type: string, enum: [welcome, profile, tax, doctors, schedule, charges, pharmacy, whatsapp, go_live] }
        status: { type: string, enum: [pending, skipped, done] }
        skippedAt: { type: [string, "null"], format: date-time }
        doneAt: { type: [string, "null"], format: date-time }

    DpaStatus:
      type: object
      required: [version, marketCode, html, dataGate, blockers]
      properties:
        version: { type: string }
        marketCode: { type: string, description: "IN, KSA, AE or QA: IN says data fiduciary / data processor, the others controller / processor" }
        html: { type: string, description: "The DPA text, server-escaped HTML" }
        accepted:
          type: [object, "null"]
          properties:
            version: { type: string }
            at: { type: string, format: date-time }
            by: { type: [string, "null"] }
            method: { type: string }
            acceptanceId: { type: string, format: uuid }
        dataGate: { type: string, enum: [demo_only, live] }
        blockers: { type: array, items: { type: string, enum: [DPA_REQUIRED, PLAN_REQUIRED] } }
        reacceptDueBy: { type: [string, "null"], format: date-time, description: "Set when a newer DPA than the accepted one exists: show a non-blocking banner; the gate is never reset" }

    DpaOtpChallenge:
      type: object
      required: [otpChallengeId, expiresAt]
      properties:
        otpChallengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }

    DpaAcceptRequest:
      type: object
      required: [version, otpChallengeId, otp]
      properties:
        version: { type: string, minLength: 1 }
        otpChallengeId: { type: string, format: uuid }
        otp: { type: string, pattern: "^\\d{6}$" }
        eSignRef: { type: [string, "null"], description: "Reserved for Aadhaar eSign / Nafath / UAE Pass; not built, a value is refused" }

    DpaAcceptResponse:
      type: object
      required: [acceptanceId, dataGate, pdfUrl, blockers]
      properties:
        acceptanceId: { type: string, format: uuid }
        dataGate: { type: string, enum: [demo_only, live] }
        pdfUrl: { type: string }
        blockers: { type: array, items: { type: string, enum: [PLAN_REQUIRED] } }

    SetupProgressUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [skipped, done] }

    ClinicProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        region: { type: string, enum: [IN, KSA] }
        timezone: { type: string }
        taxId: { type: [string, "null"] }
        taxIdType: { type: [string, "null"], enum: [GSTIN, VAT] }
        whatsappNumber: { type: [string, "null"] }
        specialties: { type: array, items: { type: string } }
        status: { type: string }
        setupCompletedAt: { type: [string, "null"], format: date-time }

    ClinicProfileWrite:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string }
        timezone: { type: string }
        taxIdType: { type: [string, "null"], enum: [GSTIN, VAT] }
        taxId: { type: [string, "null"] }
        whatsappNumber: { type: [string, "null"] }
        specialties: { type: array, items: { type: string } }

    ChargeHead:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        baseAmount: { type: number }
        followUpAmount: { type: [number, "null"] }
        emergencyAmount: { type: [number, "null"] }
        taxCode: { type: [string, "null"] }
        doctorOverride: { type: boolean }
        active: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
        displayOrder: { type: integer }

    ChargeHeadWrite:
      type: object
      required: [code, name, category, baseAmount, effectiveFrom]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        baseAmount: { type: number, minimum: 0 }
        followUpAmount: { type: [number, "null"], minimum: 0 }
        emergencyAmount: { type: [number, "null"], minimum: 0 }
        taxCode: { type: [string, "null"] }
        doctorOverride: { type: boolean, default: false }
        active: { type: boolean, default: true }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
        displayOrder: { type: integer, default: 0 }

    Policy:
      type: object
      properties:
        id: { type: string, format: uuid }
        policyKey: { type: string }
        value: { type: string }
        version: { type: integer }

    PolicyWrite:
      type: object
      required: [value]
      properties:
        value: { type: string }

    PrivacyNoticeVersions:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            type: object
            required: [version, language, effectiveFrom, mandatoryHash, templateKey, legalReviewed, current]
            properties:
              version: { type: string }
              language: { type: string }
              effectiveFrom: { type: string, format: date-time }
              mandatoryHash: { type: string }
              templateKey: { type: string }
              legalReviewed: { type: boolean, description: "false until the DPO has approved the template wording" }
              current: { type: boolean }
              bodyMd: { type: [string, "null"], description: "Only on the current version" }
              lockedClauses: { type: [array, "null"], items: { type: string } }
    PrivacyNoticePublishRequest:
      type: object
      required: [language, bodyMd, basedOnTemplate]
      properties:
        language: { type: string }
        bodyMd: { type: string, maxLength: 50000 }
        basedOnTemplate: { type: string }
        baseVersion: { type: string, description: "The version being edited; a different current version is 409" }
    PrivacyNoticePublished:
      type: object
      required: [version]
      properties: { version: { type: string } }
    PrivacyNoticeStatus:
      type: object
      required: [needsReAcknowledgement]
      properties:
        needsReAcknowledgement: { type: boolean }
        acceptedVersion: { type: [string, "null"] }
        currentVersion: { type: [string, "null"] }
        language: { type: [string, "null"] }
    AbdmSettings:
      type: object
      required: [enabled, hfrVerified]
      properties:
        enabled: { type: boolean }
        hfrVerified: { type: boolean }
        hfrId: { type: [string, "null"] }
    AbdmSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        hfrId: { type: string, maxLength: 40 }
    StaffHprRequest:
      type: object
      required: [hprId]
