components:
  schemas:
    AcceptInviteRequest:
      type: object
      properties:
        pin:
          type: string
          pattern: "^[0-9]{6,8}$"
      required:
      - pin
    AcceptOwnerInviteRequest:
      type: object
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
      required:
      - pin
    ActiveStaff:
      type: object
      properties:
        departmentName:
          type: string
        inConsult:
          type: boolean
        name:
          type: string
        roleName:
          type: string
        signedInAt:
          type: string
          format: date-time
        staffId:
          type: string
          format: uuid
    ActivityEntryResponse:
      type: object
      properties:
        activity:
          type: string
        kind:
          type: string
        occurredAt:
          type: string
          format: date-time
        patientName:
          type: string
    AdministerRequest:
      type: object
      properties:
        witnessedByStaffId:
          type: string
          format: uuid
      required:
      - witnessedByStaffId
    AdministrationOrderRequest:
      type: object
      properties:
        dose:
          type: string
        drugName:
          type: string
        queueEntryId:
          type: string
          format: uuid
        route:
          type: string
          pattern: IM|IV|SC|infusion|oral|topical
        site:
          type: string
      required:
      - dose
      - drugName
      - queueEntryId
    AdministrationOrderResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        dose:
          type: string
        drugName:
          type: string
        id:
