; OPS-026: SSO for platform operators only; no local login, no sign-up, no anonymous. Read access is audited via the request log
; (router_logging) shipped to the audit log stream. Grafana Enterprise "auditing" would replace this; not assumed here.
[server]
protocol = https
router_logging = true
[auth]
disable_login_form = true
[auth.anonymous]
enabled = false
[users]
allow_sign_up = false
auto_assign_org_role = None
[auth.generic_oauth]
enabled = true
name = Nabd SSO
allow_sign_up = false
client_id = $__file{/etc/grafana/secrets/oidc_client_id}
client_secret = $__file{/etc/grafana/secrets/oidc_client_secret}
scopes = openid profile groups
auth_url = $__env{GF_SSO_AUTH_URL}
token_url = $__env{GF_SSO_TOKEN_URL}
api_url = $__env{GF_SSO_API_URL}
; Only members of the platform-operators group get in; everyone else is refused (no default role).
role_attribute_path = contains(groups[*], 'platform-operators') && 'Viewer' || 'None'
role_attribute_strict = true
[log]
mode = console
level = info

