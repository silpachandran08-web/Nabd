apiVersion: 1
datasources:
  - { name: Prometheus, uid: prometheus, type: prometheus, url: "https://prometheus.obs.cell.internal:9090", isDefault: true }
  - { name: Loki, uid: loki, type: loki, url: "https://loki.obs.cell.internal:3100" }
  - { name: Tempo, uid: tempo, type: tempo, url: "https://tempo.obs.cell.internal:3200", jsonData: { tracesToLogsV2: { datasourceUid: loki } } }
  # OPS-060: RDS, ElastiCache and Nabd/PgBouncer metrics for the capacity review dashboard. The Grafana task role reads CloudWatch
  # in the cell's own region only (needs external action: the IAM policy cloudwatch:GetMetricData/ListMetrics on the Grafana role).
  - { name: CloudWatch, uid: cloudwatch, type: cloudwatch, jsonData: { authType: default, defaultRegion: "$CELL_REGION" } }
