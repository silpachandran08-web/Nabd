# OPS-027: IN cell routing. Pages only reach the on-call during clinic hours 07:00-23:00 local (Asia/Kolkata); outside them page-severity alerts
# become tickets. Another cell copies this file with its own time zone (from the OPS-061 region data). Secrets are mounted files, never inline.
global:
  resolve_timeout: 5m
time_intervals:
  - name: clinic-hours
    time_intervals: [{ times: [{ start_time: "07:00", end_time: "23:00" }], location: Asia/Kolkata }]
route:
  receiver: ticket
  group_by: [alertname, slo]
  group_wait: 30s        # fast burn must page within 5 min: Prometheus eval 30 s + 30 s here
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - { matchers: ['severity="page"'], receiver: oncall-primary, active_time_intervals: [clinic-hours], continue: false }
    - { matchers: ['severity="page"'], receiver: ticket }            # out of hours: ticket only
    - { matchers: ['severity="warning"'], receiver: ticket }
receivers:
  - name: oncall-primary
    opsgenie_configs:
      - api_key_file: /etc/alertmanager/secrets/opsgenie_api_key
        responders: [{ name: platform-primary, type: schedule }]
        priority: P1
        message: '{{ .CommonLabels.alertname }} {{ .CommonLabels.slo }}'
        description: '{{ .CommonAnnotations.summary }} Runbook: {{ .CommonAnnotations.runbook }}'
  - name: ticket
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket_webhook_url
