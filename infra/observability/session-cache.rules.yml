# OPS-020: Prometheus alert rules for the Valkey session-revocation cache (SessionLivenessCache, /actuator/prometheus).
# Wiring this file into the cell's Prometheus/Alertmanager is Needs external action (no Prometheus in the repo yet).
# Fires on the first evaluation after a request fell back to the Postgres liveness check.
groups:
  - name: nabd-session-cache
    rules:
      - alert: NabdSessionCacheFallback
        expr: sum(increase(nabd_session_cache_fallback_total[1m])) > 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "Session revocation cache unreachable: every request checks sessions in Postgres (revoked sessions still refused, DB load up)"
          runbook: docs/architecture/valkey.md
      - alert: NabdSessionCacheHitRatioLow
        expr: >
          sum(rate(nabd_session_cache_lookups_total{outcome="hit"}[15m]))
          / clamp_min(sum(rate(nabd_session_cache_lookups_total[15m])), 1e-9) < 0.8
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Session cache hit ratio under 80% for 30 min; check-in DB load is back near the pre-OPS-020 level"
          runbook: docs/architecture/valkey.md
