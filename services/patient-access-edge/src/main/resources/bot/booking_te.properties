other.info=ఇతర పెద్దలు తమ ఫోన్ నుండి మాకు సందేశం పంపి తమ సమ్మతి ఇవ్వాలి, కాబట్టి ఇక్కడ వారి కోసం బుక్ చేయలేము. క్లినిక్ నుండి ఒకరు మీకు సహాయం చేస్తారు.
