change=సమయం మార్చండి
done.confirmed=మీ అపాయింట్‌మెంట్ నిర్ధారించబడింది: %s, %s %s, %s.
done.requested=%s, %s %s కోసం మీ అభ్యర్థన అందింది. %d నిమిషాల్లో నిర్ధారిస్తాము.
taken=క్షమించండి, ఆ సమయం ఇప్పుడే నిండిపోయింది. దగ్గరి ఖాళీ సమయాలు ఇక్కడ ఉన్నాయి.
checking=మీ బుకింగ్‌ను తనిఖీ చేస్తున్నాము, త్వరలో సందేశం పంపుతాము. దయచేసి మళ్లీ బుక్ చేయవద్దు.
fail=క్షమించండి, బుక్ చేయలేకపోయాము. క్లినిక్ నుండి ఒకరు ఇక్కడే మీకు జవాబిస్తారు.
unknown.phone=ఈ నంబర్ మా రికార్డుల్లో కనపడలేదు. క్లినిక్ నుండి ఒకరు ఇక్కడే మీకు జవాబిస్తారు.
handoff=క్లినిక్ నుండి ఒకరు త్వరలో ఇక్కడే మీకు జవాబిస్తారు.
emergency=ఇది అత్యవసర పరిస్థితి కావచ్చు. దయచేసి ఇప్పుడే %s కు కాల్ చేయండి లేదా సమీప అత్యవసర విభాగానికి వెళ్లండి.
