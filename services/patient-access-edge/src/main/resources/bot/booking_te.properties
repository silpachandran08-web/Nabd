child.dob=పిల్ల పుట్టిన తేదీ ఏమిటి? దయచేసి ఇలా రాయండి: 25-12-2019.
child.dob.bad=క్షమించండి, ఆ తేదీ చదవలేకపోయాము. దయచేసి ఇలా రాయండి: 25-12-2019.
child.notminor=పిల్లకు 18 ఏళ్ల లోపు వయస్సు ఉండాలి. దయచేసి తేదీని చూసి మళ్లీ రాయండి.
