doc.ask=మీరు ఏ డాక్టర్‌ను కలవాలనుకుంటున్నారు?
day.ask=ఏ రోజు అనుకూలం?
day.none=క్షమించండి, రాబోయే రోజుల్లో ఖాళీ సమయాలు లేవు. క్లినిక్ నుండి ఒకరు ఇక్కడే మీకు జవాబిస్తారు.
time.ask=%s తో %s కి సమయం ఎంచుకోండి.
time.none=ఆ రోజు ఖాళీ సమయాలు లేవు. దయచేసి మరో రోజు ఎంచుకోండి.
card=దయచేసి మీ అపాయింట్‌మెంట్‌ను నిర్ధారించండి:\nడాక్టర్: %s\nతేదీ: %s\nసమయం: %s\nక్లినిక్: %s
