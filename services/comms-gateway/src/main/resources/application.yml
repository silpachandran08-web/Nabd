server:
  port: ${PORT:3809}
spring:
  application.name: comms-gateway
  # comms_app (DML only). Flyway runs as comms_migrator in the migrate job, never in the serving pods.
  datasource:
    url: ${COMMS_DB_URL:jdbc:postgresql://localhost:5432/comms}
    username: ${COMMS_DB_USER:comms_app}
    password: ${COMMS_DB_PASSWORD:}
    hikari: { maximum-pool-size: 10 }
  flyway:
    enabled: false
    url: ${COMMS_MIGRATE_DB_URL:${COMMS_DB_URL:jdbc:postgresql://localhost:5432/comms}}
    user: ${COMMS_MIGRATE_DB_USER:comms_migrator}
    password: ${COMMS_MIGRATE_DB_PASSWORD:}
  data.redis.url: ${VALKEY_URL:redis://localhost:6379}   # rediss:// in prod
  data.redis.timeout: 500ms
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db,streams
comms:
  region: ${COMMS_REGION:in}
  consumer:
    enabled: true
    batch-size: 50
    max-attempts: 5
    claim-idle-ms: 60000
# Optional, set per environment (leave unset to keep the feature off; an empty value would switch it on):
#   comms.core.base-url + comms.core.token   COM-023 scheduler and claim check against Core /internal/v1 (CORE_INTERNAL_URL, CORE_COMMS_TOKEN)
#   comms.scheduler.tick-ms (15000), comms.scheduler.batch (500)
#   comms.field-key (base64, 32 bytes) + comms.internal-token   COM-030 inbox (COMMS_FIELD_KEY, COMMS_INTERNAL_TOKEN)
