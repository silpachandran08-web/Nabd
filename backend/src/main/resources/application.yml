spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: hms-backend
  # PLT-032: Tomcat requests, @Async and @Scheduled run on virtual threads (Java 21); pinning review in the PLT-032 report
  threads:
    virtual:
      enabled: true
  # PLT-032: Jackson 3 with Boot's Jackson 2 defaults, so request/response JSON stays as it was (e.g. absent primitives -> 0/false)
  jackson:
    use-jackson2-defaults: true
  # PLT-008: Valkey is wired only by com.nabd.hms.common.valkey (app.valkey.*), never Boot's localhost default
  autoconfigure:
    exclude: org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nabd}
    username: ${DB_USER:nabd_app}
    password: ${DB_PASSWORD:nabd_app}
    hikari:
      # OPS-003: fixed pool, fail fast. A request that cannot get a connection in 3 s is a 503 (DbFailureAdvice), not a 30 s queue.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  flyway:
    # OPS-003: the API runs as nabd_app (DML only) and never migrates; the separate migrate job runs MigrateMain as nabd_migrator.
    enabled: false
    # migrations live at repo root (db/migrations), shared with any future
    # non-Java tooling — not duplicated into src/main/resources
    locations: filesystem:../db/migrations
  mail:
    # No default host: EmailSender's @Bean factory (MailConfig) picks LoggingEmailSender over
    # SmtpEmailSender whenever this is blank, which is exactly every local/test run today —
    # nothing here ever needs mocking out for tests, same as WhatsAppOtpSender/WabaProvisioningGateway.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Render blocks outbound SMTP on its network — without these, a blocked connection hangs
          # on the OS's own TCP timeout (60s+) instead of failing fast. ProvisioningStepRunner
          # already treats a send failure as best-effort, but the request shouldn't hang either way.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# OPS-034: the spec is generated by OpenApiSpecApiTest, never served by the running API.
springdoc:
  api-docs:
    enabled: false
    # PLT-032: springdoc 3 defaults to OpenAPI 3.1; keep core.yaml on 3.0 so the OPS-035 drift gate and client generator see no churn
    version: openapi_3_0
  swagger-ui:
    enabled: false

# OPS-025: actuator lives on its own port, never routed by the ingress. Readiness = DB + outbox dispatcher freshness.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        readiness:
          include: readinessState,db,outbox

server:
  port: 8080
  # OPS-053/OPS-025: on SIGTERM finish in-flight requests (phase timeout above, 25s) before exit, so a rolling restart drops none
  shutdown: graceful
  # PLT-003: the client IP is the TCP peer unless the peer is a trusted proxy. Tomcat's RemoteIpValve only
  # honours X-Forwarded-For from internal-proxies; empty (the default here) = trust nobody. Set per cell,
  # e.g. APP_TRUSTED_PROXIES='10\.0\.0\.\d+' (regex).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      internal-proxies: ${APP_TRUSTED_PROXIES:}

logging:
  pattern:
    # [reqId=...] ties every line for one request together and matches the traceId returned in
    # RFC 7807 error bodies (RequestCorrelationFilter + GlobalExceptionHandler share the value)
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [reqId=%X{requestId:-none}] %logger{35} - %mask%n"
  level:
    root: INFO
    # ponytail: no PHI-redaction scanner on top of this yet (NB-158) — logging code is
    # hand-disciplined to pass IDs, not patient name/phone/DOB/national-ID: read PatientService
    # before adding a new log line there.
    com.nabd.hms: INFO

app:
  cors:
    # Comma-separated; overridable via APP_CORS_ALLOWED_ORIGINS without a redeploy. The deployed
    # web app's origin is a public value (not a secret), so it's safe to default it here rather
    # than requiring every environment to set it by hand.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://nabd-nu.vercel.app}
  # Public value, same reasoning as allowed-origins above — used to build the owner-invite link
  # inside the email body server-side (the frontend builds the same link client-side from
  # window.location.origin for the manual-relay banner; this is that same value for SmtpEmailSender).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  auth:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    absolute-session-hours: 12    # PLT-007: a refresh family ends one shift after sign-in
    mfa-challenge-ttl-minutes: 5
    lockout-threshold: 5          # failed attempts before backoff kicks in
    rate-limit-per-ip-per-minute: 20
    mfa:
      enforce-privileged: ${MFA_ENFORCE_PRIVILEGED:true}  # PLT-005: false is refused at boot under the prod profile
    otp:  # PLT-006 (OtpSendLimiter)
      tenant-hourly-cap: ${OTP_TENANT_HOURLY_CAP:200}   # default when the tenant's plan has no otp_hourly_cap
      phone-hmac-key: ${OTP_PHONE_HMAC_KEY:}            # base64 pepper from the secret manager; required under prod
  jwt:
    # Documented env var names (APP_JWT_KEYS_* still win via relaxed binding).
    keys-file: ${JWT_KEYS_FILE:}
    keys-json: ${JWT_KEYS_JSON:}
  outbox:
    poll-interval-ms: 2000
    batch-size: 20
    lease-seconds: 60
    # OPS-014: at least the slowest handler's connect + read timeout (Meta 2 s + 5 s, app.integration below, with
    # headroom). 20 x 15 s > 60 s, so the lease is
    # renewed before each event; OutboxProperties refuses to boot a config where a batch can outlive its lease.
    per-event-timeout-ms: 15000
    extend-lease-per-event: true
    metrics-interval-ms: 15000
  # PLT-008 (docs/architecture/valkey.md): unset VALKEY_URL = no Valkey, the API limits nothing and still serves.
  # Under prod the URL must be rediss:// (TLS). Timeouts stay short: a slow Valkey must never slow the API.
  valkey:
    url: ${VALKEY_URL:}
    connect-timeout-ms: 500
    command-timeout-ms: 250
  # OPS-017 consumer groups on ev:<region>:<domain> (docs/architecture/events.md section 7). Inert without VALKEY_URL.
  # Every replica runs every group; set false on pods that must not consume. Other knobs: ConsumerProperties.
  events:
    consumer:
      enabled: ${EVENT_CONSUMERS_ENABLED:true}
  # PLT-008 token buckets (per minute, burst = bucket size). The tenant pair is the default when the tenant's plan
  # (master.plans.api_requests_per_minute / api_burst) has none; plan values are re-read every plan-refresh-seconds.
  rate-limit:
    tenant-per-minute: 600
    tenant-burst: 1200
    user-per-minute: 120
    user-burst: 120
    ip-per-minute: 20
    ip-burst: 20
    plan-refresh-seconds: 30
  # OPS-012: every outbound HTTP call goes through shared.integration.ResilientHttpClient. Defaults: connect 2 s,
  # read 5 s. Per-provider overrides: app.integration.providers.<name>.connect-timeout-ms / read-timeout-ms
  # (providers today: meta-whatsapp, on the defaults). Keep connect + read of the slowest provider at or below
  # app.outbox.per-event-timeout-ms. The breaker opens after 5 consecutive failures (IO, timeout, 429, 5xx) for 30 s.
  integration:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    circuit-failure-threshold: 5
    circuit-open-seconds: 30
    providers: {}
  whatsapp:
    # Meta WhatsApp Cloud API. Blank access token = LoggingWhatsAppClient (logs, never sends) —
    # every local/test run, same as spring.mail.host above.
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}       # blank = webhook rejects every POST
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}   # blank = webhook subscription handshake always fails
    otp-template: ${WHATSAPP_OTP_TEMPLATE:nabd_login_otp}
    otp-language: ${WHATSAPP_OTP_LANGUAGE:en}
    log-otp: ${WHATSAPP_LOG_OTP:false}         # OtpLoggingGuard refuses to boot in prod when true; the sender no longer logs codes
  crypto:
    # base64, 32 bytes (AES-256) each, no code defaults (FieldCipher refuses to boot without a key).
    # PLT-044: legacy key: reads pre-PLT-044 values and, outside prod with no keyring, doubles as kid 1.
    key: ${APP_CRYPTO_KEY:}
    # PLT-044: "kid:base64,kid:base64" (kid 1-255) + the kid new writes use. Required under the prod profile.
    keyring: ${APP_CRYPTO_KEYRING:}
    active-kid: ${APP_CRYPTO_ACTIVE_KID:}
