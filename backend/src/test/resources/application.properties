management.server.port=0
management.prometheus.metrics.export.enabled=true
# PLT-005: the shared fixtures sign in full-access (Owner-like) staff, owners and operators with a PIN only;
# the forced-MFA suites (ForcedMfaPolicyApiTest, OwnerMfaFlowApiTest) turn enforcement back on for their own context.
app.auth.mfa.enforce-privileged=false
# PLT-019: a *Repository call outside a transaction that touches an RLS table throws IllegalStateException (RepositoryTransactionGuard).
nabd.tenancy.strict-repositories=true
