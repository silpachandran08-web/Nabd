# PLT-052 data classification: one tier per column of the public, identity and consent schemas.
# Standard and handling rules: docs/security/data-classification.md. Reviewed like schema (CODEOWNERS).
# Tiers: phi | pii | financial | operational. A column that combines tiers takes the strictest.
# Partitions (phi_read_log_yYYYYmMM, ..._default) inherit their parent's tags and are not listed.
# CI: scripts/ci/classification_check.py fails a migration that adds an untagged column (static) and, after the
# migrate job, any drift between this file and the migrated schema (--db).
# Lines marked "uncertain" are judgement calls awaiting DPO review (see the PLT-052 report).
version: 1

# Fields of every structured log line (PhiJsonEncoder, prod profile). message and stack_trace are free text: they must
# never carry PHI or PII (PLT-037); PhiMasker is the safety net, not the control.
log_fields:
  timestamp: operational
  level: operational
  logger: operational
  thread: operational
  traceId: operational
  message: operational
  stack_trace: operational

