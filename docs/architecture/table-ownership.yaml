# OPS-033 SQL ownership (ARCH §11.2, ADR-02). A module writes only the tables it owns and reads only its own tables
# plus its reads allow-list. Checked by scripts/ci/arch.py (stage 2). Every table created in db/migrations must be listed
# under exactly one owner; a new table not listed here is reported as a violation.
# PLT-033: a module may span several Java packages (`packages:`, default its own name); every table in public, identity
# and consent must have exactly one owner (arch.py reports a gap or a second owner as a sql-ownership violation).
# doc06 §4.4 also assigns tenants (projection), brands, legal_entities, tax_registrations and invoice_series to organization;
# they stay with platform/owner/billing until their writers move, so the frozen baseline does not grow.
# Initial owners were drafted from the current writers (module with most write statements, domain owner on ties) and
# need confirmation at the architecture review. Read allow-lists start empty on purpose: today's cross-module reads are
# in ci/architecture-baseline.json as debt; add a table to `reads` only when the review accepts that read.
modules:
  billing:
    owns: [charge_catalogue, day_close_events, day_closes, invoice_discounts, invoice_line_items, invoice_line_taxes, invoice_payments, invoices, tax_rules]
    reads: []
  clinical:
    owns: [chronic_conditions, clinical_documents, clinical_notes, dental_chart_entries, dental_chart_events, drug_classes, drug_ingredients, drug_master, drug_master_imports, drug_master_stage, favourite_rx_set_items, ingredients, favourite_rx_sets, note_amendments, note_templates, patient_allergies, patient_allergy_assessments, patient_allergy_events, patient_pregnancy_events, patient_pregnancy_status, prescription_items, prescription_signer_backfill, prescriptions, safety_dictionary_entries, safety_dictionary_versions, vitals]
    reads: []
  common:
    owns: [audit_chain_heads, audit_chain_seals, audit_log, crypto_reencrypt_progress, outbox_events, phi_read_batches, phi_read_log, phi_read_volume_alerts]
    reads: []
  identity:
    # IDC-016 (ADR-08): national rails (ABDM). staff.hpr_id is written through iam, not here.
    owns: [tenant_integrations_abdm]
    reads: []
  iam:
    # PLT-033 (doc06 §4.4): staff, roles, sessions, login_attempts, delegations, break-glass. Java packages auth and staff
    # are this module until they move under com.nabd.hms.iam; other modules look staff up via iam.api.ActorDirectory
    # (remaining direct staff reads elsewhere are baseline debt).
    packages: [iam, auth, staff]
    owns: [break_glass_alerts, break_glass_grants, login_attempts, mfa_recovery_codes, otp_requests, otp_send_counters, owner_mfa_recovery_codes, role_delegations, roles, session_cache_revocations, sessions, staff, staff_clinician_review, staff_preferences]
    reads: []
  messaging:
    owns: [comms_cutover_flags, messaging_suppressions, notification_requests, template_catalogue, template_lint_rules, whatsapp_inbound_events, whatsapp_messages, whatsapp_templates]
    reads: [consents, outbox_events, patients]  # COM-008: consent export version; COM-004: consent check and recipient phone; replaced by patient.api.ConsentRegistry (IDC-002) when it lands
  nursing:
    owns: [administration_orders, administration_records, procedure_orders, vaccine_records]
    reads: []
  organization:
    # PLT-033: departments, service points, workflow definitions, clinic policies and setup (packages
    # organization.department / organization.setup); other modules use organization.api.
    owns: [attendance_records, booking_policy_versions, clinic_holidays, clinic_policies, clinic_setup_progress, data_export_jobs, data_import_jobs, data_import_rows, data_import_uploads, department_transfers, department_workflow_selection, departments, dpa_acceptances, invoice_series, licence_registry, regions, service_points, staff_shifts, workflow_definitions]
    reads: [tenants]  # FIN-006: InvoiceSeriesService checks the tenant's tax_registration_id (needs architecture review)
  owner:
    owns: [legal_entities, owners, tax_registrations]
    reads: []
  packages:
    owns: [package_eligible_doctors, package_instance_events, package_instance_items, package_instances, package_items, package_redemptions, package_refunds, package_settings, packages]
    reads: []
  patient:
    owns: [consents, internal_patient_refs, notice_templates, patient_duplicate_dismissals, patient_merges, patient_registry_summary, patients, privacy_notices, registry_dirty]
    reads: [tenants]  # IDC-003: the clinic's name, region and grievance contact fill the notice; the public page finds the clinic by slug
  pharmacy:
    owns: [pharmacy_settings, pharmacy_stock_movements]
    reads: []
  platform:
    owns: [brands, master.discount_requests, master.login_attempts, master.operator_audit_log, master.kill_switches, master.operators, master.plan_entitlements, master.plan_versions, master.plans, master.provisioning_job_steps, master.provisioning_jobs, master.sessions, master.subscriptions, master.support_access_grants, master.support_tickets, master.tenant_feature_overrides, tenant_lifecycle_events, tenants]
    reads: []
  reports:
    # OPS-010: rollups written by the reporting-rollup consumer; the recompute reads source tables through ReportsRepository (baseline debt)
    owns: [doctor_daily_metrics, tenant_daily_metrics]
    reads: [appointments, invoice_payments, invoices, package_instances, queue_entries]  # OPS-010: the recompute-from-source of one tenant-day
  queue:
    owns: [appointments, booking_request_details, booking_request_offers, booking_routing_settings, doctor_delays, doctor_leave, doctor_session_pauses, doctor_sessions, doctor_working_hours, eta_accuracy_daily, eta_prediction_log, queue_entries, queue_entry_events, service_time_stats, session_reserved_slots, specialty_service_defaults, waitlist_entries]
    reads: []
  shared:
    owns: [idempotency_keys, projector_applied_events, shedlock]
    reads: []
