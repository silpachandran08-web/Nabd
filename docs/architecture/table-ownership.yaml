# OPS-033 SQL ownership (ARCH §11.2, ADR-02). A module writes only the tables it owns and reads only its own tables
# plus its reads allow-list. Checked by scripts/ci/arch.py (stage 2). Every table created in db/migrations must be listed
# under exactly one owner; a new table not listed here is reported as a violation.
# Initial owners were drafted from the current writers (module with most write statements, domain owner on ties) and
# need confirmation at the architecture review. Read allow-lists start empty on purpose: today's cross-module reads are
# in ci/architecture-baseline.json as debt; add a table to `reads` only when the review accepts that read.
modules:
  auth:
    owns: [break_glass_alerts, break_glass_grants, login_attempts, mfa_recovery_codes, sessions]
    reads: []
  billing:
    owns: [charge_catalogue, day_closes, invoice_discounts, invoice_line_items, invoice_payments, invoice_series, invoices]
    reads: []
  clinical:
    owns: [chronic_conditions, clinical_documents, clinical_notes, dental_chart_entries, favourite_rx_set_items, favourite_rx_sets, note_amendments, note_templates, patient_allergies, patient_allergy_assessments, patient_allergy_events, patient_pregnancy_events, patient_pregnancy_status, prescription_items, prescriptions, vitals]
    reads: []
  common:
    owns: [audit_log, outbox_events]
    reads: []
  department:
    owns: [department_transfers, department_workflow_selection, departments, service_points, workflow_definitions]
    reads: []
  messaging:
    owns: [whatsapp_messages, whatsapp_templates]
    reads: []
  nursing:
    owns: [administration_orders, administration_records, procedure_orders, vaccine_records]
    reads: []
  owner:
    owns: [legal_entities, owners, tax_registrations]
    reads: []
  packages:
    owns: [package_eligible_doctors, package_instance_events, package_instance_items, package_instances, package_items, package_redemptions, package_refunds, package_settings, packages]
    reads: []
  patient:
    owns: [consents, patient_merges, patient_registry_summary, patients, registry_dirty]
    reads: []
  pharmacy:
    owns: [pharmacy_settings, pharmacy_stock_movements]
    reads: []
  platform:
    owns: [brands, master.discount_requests, master.login_attempts, master.operators, master.plans, master.provisioning_job_steps, master.provisioning_jobs, master.sessions, master.subscriptions, master.support_access_grants, master.support_tickets, tenant_lifecycle_events, tenants]
    reads: []
  queue:
    owns: [appointments, doctor_delays, doctor_leave, doctor_working_hours, queue_entries, waitlist_entries]
    reads: []
  setup:
    owns: [attendance_records, clinic_holidays, clinic_policies, clinic_setup_progress, data_export_jobs, data_import_jobs, licence_registry, staff_shifts]
    reads: []
  shared:
    owns: [idempotency_keys]
    reads: []
  staff:
    owns: [role_delegations, roles, staff]
    reads: []
