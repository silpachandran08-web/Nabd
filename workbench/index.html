<title>Nabd Engineering Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail of views, a filter bar, the active view, and a right-hand story drawer.
   Engineering tool: dense, scannable, IDs and contracts in mono. Teal accent from the Nabd brand. */
:root {
  --bg: #F5F7F8; --surface: #FFFFFF; --surface-2: #EEF2F4; --surface-3: #E3E9EC;
  --line: #D9E0E4; --line-strong: #BFC9CF;
  --fg: #12181C; --fg-2: #4A565E; --fg-3: #6B777F;
  --accent: #0B7F8B; --accent-fill: #2ED3E0; --accent-ink: #04231F; --accent-tint: rgba(11,127,139,.10);
  --ok: #0B7A52; --ok-t: rgba(11,122,82,.10); --warn: #946200; --warn-t: rgba(148,98,0,.11);
  --crit: #C8283E; --crit-t: rgba(200,40,62,.09); --info: #1C68AA; --info-t: rgba(28,104,170,.10);
  --violet: #6B43B8; --violet-t: rgba(107,67,184,.10);
  --shadow: 0 10px 30px rgba(10,20,25,.12);
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1013; --surface: #12191D; --surface-2: #182126; --surface-3: #1F2A30;
  --line: #24323A; --line-strong: #344650;
  --fg: #EEF3F5; --fg-2: #A9B6BD; --fg-3: #7F8D95;
  --accent: #45DDE8; --accent-fill: #2ED3E0; --accent-ink: #04231F; --accent-tint: rgba(46,211,224,.12);
  --ok: #34D399; --ok-t: rgba(52,211,153,.13); --warn: #E8B33C; --warn-t: rgba(232,179,60,.13);
  --crit: #FF6B7D; --crit-t: rgba(255,107,125,.13); --info: #6CB8F6; --info-t: rgba(108,184,246,.13);
  --violet: #B79BF2; --violet-t: rgba(183,155,242,.13);
  --shadow: 0 12px 36px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1013; --surface: #12191D; --surface-2: #182126; --surface-3: #1F2A30;
  --line: #24323A; --line-strong: #344650;
  --fg: #EEF3F5; --fg-2: #A9B6BD; --fg-3: #7F8D95;
  --accent: #45DDE8; --accent-fill: #2ED3E0; --accent-ink: #04231F; --accent-tint: rgba(46,211,224,.12);
  --ok: #34D399; --ok-t: rgba(52,211,153,.13); --warn: #E8B33C; --warn-t: rgba(232,179,60,.13);
  --crit: #FF6B7D; --crit-t: rgba(255,107,125,.13); --info: #6CB8F6; --info-t: rgba(108,184,246,.13);
  --violet: #B79BF2; --violet-t: rgba(183,155,242,.13);
  --shadow: 0 12px 36px rgba(0,0,0,.5); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 16px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-fill); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px/1 var(--mono); }
.brand b { display: block; font-size: 14.5px; letter-spacing: -.1px; }
.brand small { display: block; color: var(--fg-3); font-size: 11.5px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--fg-2); cursor: pointer; font-weight: 500; }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn.on { background: var(--accent-tint); color: var(--accent); }
.nav-btn .count { margin-left: auto; font: 500 11.5px/1 var(--mono); color: var(--fg-3); }
.rail-sep { height: 1px; background: var(--line); margin: 10px 4px; }
.rail-foot { margin-top: auto; padding: 10px 6px 0; font-size: 12px; color: var(--fg-3); display: flex; flex-direction: column; gap: 8px; }
.me { display: flex; align-items: center; gap: 8px; color: var(--fg-2); }
.mode { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 99px; background: var(--fg-3); display: inline-block; flex: none; }
.dot.live { background: var(--ok); } .dot.local { background: var(--warn); }

.main { min-width: 0; padding-block: 20px 48px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; }
.head h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -.2px; text-wrap: balance; }
.head p { margin: 2px 0 0; color: var(--fg-2); max-width: 75ch; }
.head .grow { flex: 1; min-width: 200px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.filters select, .filters input { height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 0 8px; font-size: 13px; max-width: 190px; min-width: 0; }
.filters input[type=search] { flex: 1; min-width: 160px; max-width: 320px; }
.filters .clear { margin-left: auto; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent-fill); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip.persona { background: var(--violet-t); color: var(--violet); border-color: transparent; }
.chip.svc { background: var(--info-t); color: var(--info); border-color: transparent; font-family: var(--mono); font-size: 11px; }
.chip.p0 { background: var(--crit-t); color: var(--crit); border-color: transparent; font-weight: 600; }
.chip.p1 { background: var(--warn-t); color: var(--warn); border-color: transparent; font-weight: 600; }
.chip.p2, .chip.p3 { font-weight: 600; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: 99px; background: var(--fg-3); }
.st.ready i { background: var(--info); } .st.inprogress i { background: var(--accent); } .st.review i { background: var(--violet); }
.st.blocked i { background: var(--crit); } .st.done i { background: var(--ok); }
.st.blocked { color: var(--crit); } .st.done { color: var(--ok); }
.av { width: 22px; height: 22px; border-radius: 99px; object-fit: cover; flex: none; background: var(--surface-3); }
.av-empty { width: 22px; height: 22px; border-radius: 99px; border: 1.5px dashed var(--line-strong); flex: none; }

/* Overview */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.tile .v { font: 600 24px/30px var(--font); font-variant-numeric: tabular-nums; }
.tile .l { color: var(--fg-2); font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel h2 small { color: var(--fg-3); font-weight: 500; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.prog { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; font-size: 13px; }
.prog .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; display: flex; }
.bar span { height: 100%; }
.bar .s-done { background: var(--ok); } .bar .s-review { background: var(--violet); } .bar .s-inprogress { background: var(--accent); } .bar .s-blocked { background: var(--crit); } .bar .s-ready { background: var(--info); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--fg-2); margin-top: 10px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(6, minmax(250px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 2px; font-size: 12.5px; font-weight: 600; }
.col-h .n { margin-left: auto; font: 500 11.5px/1 var(--mono); color: var(--fg-3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; text-align: start; width: 100%; }
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.card .t { font-weight: 500; line-height: 18px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.card .foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); }
.card .foot .sub { margin-left: auto; }
.more { font-size: 12px; color: var(--fg-3); padding: 4px; text-align: center; }

/* Tables */
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: start; font-size: 11.5px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: .5px; padding: 9px 12px; background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; font-size: 13px; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
tr.grp td { background: var(--surface-2); font-weight: 600; font-size: 12.5px; }
td.r, th.r { text-align: end; font-variant-numeric: tabular-nums; }

/* Persona & service cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; text-align: start; display: flex; flex-direction: column; gap: 6px; }
.pcard:hover { border-color: var(--accent); }
.pcard b { font-size: 14.5px; }
.pcard p { margin: 0; color: var(--fg-2); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--fg-2); cursor: pointer; font-weight: 500; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-color: var(--accent); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(5,10,12,.35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 100vw); background: var(--surface); z-index: 50; box-shadow: var(--shadow); display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dh { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.dh-top { display: flex; align-items: flex-start; gap: 10px; }
.dh-top h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; flex: 1; text-wrap: balance; min-width: 0; }
.dh-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dh-ctrl select { height: 32px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 0 8px; font-size: 13px; }
.db { flex: 1; overflow-y: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.sec h3 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--fg-3); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.sec h3 .n { font-family: var(--mono); }
.story { font-size: 15px; line-height: 22px; background: var(--violet-t); border-radius: 8px; padding: 12px 14px; }
.ctx { color: var(--fg-2); max-width: 78ch; white-space: pre-line; margin: 0; }
.ac { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ac li { padding: 8px 10px 8px 12px; border-left: 3px solid var(--ok); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13.5px; }
.ac b { color: var(--fg-3); font-weight: 600; font-size: 11.5px; margin-right: 6px; font-family: var(--mono); }
.contract { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.contract + .contract { margin-top: 8px; }
.contract-h { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--surface-2); flex-wrap: wrap; }
.method { font: 600 11.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px; background: var(--info-t); color: var(--info); }
.method.POST { background: var(--ok-t); color: var(--ok); } .method.PUT, .method.PATCH { background: var(--warn-t); color: var(--warn); } .method.DELETE { background: var(--crit-t); color: var(--crit); }
.contract-b { padding: 8px 10px; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 10px; font-size: 12.5px; }
.contract-b dt { color: var(--fg-3); } .contract-b dd { margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.subs { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.subrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 9px 10px; border-top: 1px solid var(--line); align-items: start; }
.subrow:first-child { border-top: 0; }
.subrow input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--accent); }
.subrow .tt { font-weight: 500; }
.subrow.done .tt { text-decoration: line-through; color: var(--fg-3); }
.subrow .dd { color: var(--fg-2); font-size: 12.5px; margin-top: 2px; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; min-width: 0; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.linkchip { font: 500 12px/1 var(--mono); padding: 5px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); cursor: pointer; text-decoration: none; }
.linkchip:hover { border-color: var(--accent); }
.comment { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.comment:first-child { border-top: 0; }
.comment .body { white-space: pre-wrap; word-break: break-word; }
.comment .who { font-size: 12px; color: var(--fg-3); }
.composer { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.composer textarea { min-height: 70px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--surface); resize: vertical; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-t); font-size: 13px; }
.note.info { background: var(--info-t); }
.empty { padding: 40px 16px; text-align: center; color: var(--fg-3); }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 8px; padding: 10px 14px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.picker { position: relative; }
.picker-menu { position: absolute; top: 36px; left: 0; z-index: 70; width: 260px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; }
.picker-menu input { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; margin-bottom: 6px; background: var(--surface); }
.picker-menu button { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; padding: 6px; border-radius: 6px; cursor: pointer; text-align: start; }
.picker-menu button:hover { background: var(--surface-2); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand { width: 100%; padding-bottom: 6px; }
  .nav-btn { width: auto; }
  .nav-btn .count, .rail-sep { display: none; }
  .rail-foot { width: 100%; flex-direction: row; flex-wrap: wrap; margin-top: 6px; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .contract-b, .kv { grid-template-columns: minmax(0, 1fr); }
  .prog { grid-template-columns: minmax(0, 1fr) auto; }
  .prog .bar { grid-column: 1 / -1; }
}
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Views"></nav>
  <main class="main" id="main" aria-live="polite">
    <div class="empty">Loading the engineering plan…</div>
  </main>
</div>
<div id="overlay"></div>

<script src="app.js"></script>
