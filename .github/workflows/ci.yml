# OPS-031: stages 1 (static), 2 (unit), 3 (integration), 6 (build and scan). Required checks on main:
# stage1-static, stage2-unit, stage3-integration, stage6-build-and-scan (see .github/branch-protection.json).
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'db/**'
              - 'api/**'
              - 'Dockerfile'
              - '.github/**'
            frontend:
              - 'frontend/**'
              - '.github/**'

  stage1-static:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (fails the PR on a committed secret)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --redact --exit-code 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: baseline entries valid and unexpired
        run: python3 scripts/ci/baseline.py validate
      - name: Semgrep (new High/Critical only vs base)
        run: |
          pip install -q semgrep==1.97.0
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          semgrep scan --config p/ci --config p/java --config p/typescript --severity ERROR --error --metrics=off \
            --baseline-commit "$base" --exclude node_modules --exclude target
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: needs.changes.outputs.frontend == 'true'
        name: next typegen, tsc, ESLint, permission rendering
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run -s typecheck
          npx eslint .
          npm run -s check:permissions
      - name: OpenAPI valid
        run: pip install -q openapi-spec-validator && python3 -m openapi_spec_validator api/openapi.yaml

  stage2-unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: needs.changes.outputs.frontend == 'true'
        name: unit tests incl. consult flow
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - if: needs.changes.outputs.backend == 'true'
        name: JUnit unit tests (no Docker; ApiTestBase classes run in stage 3)
        working-directory: backend
        run: mvn -B -q test -Dtest='!*ApiTest,!*IT' -Dsurefire.failIfNoSpecifiedTests=false

  stage3-integration:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - if: needs.changes.outputs.backend == 'true'
        name: Testcontainers integration tests + JaCoCo (parallel by class)
        working-directory: backend
        run: |
          mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent verify \
            org.jacoco:jacoco-maven-plugin:0.8.12:report \
            -Dtest='*ApiTest,*IT' -Dsurefire.failIfNoSpecifiedTests=false -DforkCount=2 -DreuseForks=true
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with: { name: jacoco, path: backend/target/site/jacoco }
      # OPS-032: coverage comment + gates (ci/quality-gates.json; gates stay report-only until enabled_from is set)
      - if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
        name: JaCoCo summary comment and coverage gates
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git fetch -q origin ${{ github.base_ref }} --depth=200
          base=$(git merge-base HEAD origin/${{ github.base_ref }})
          python3 scripts/ci/quality.py summary backend/target/site/jacoco/jacoco.xml "$base" | tee cov.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file cov.md || true
          python3 scripts/ci/quality.py gate backend/target/site/jacoco/jacoco.xml "$base"
      - if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request' && vars.PIT_BLOCKED == 'true'
        name: PIT drop gate (nightly mutation score fell more than 2 points)
        run: |
          git fetch -q origin ${{ github.base_ref }} --depth=200
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^backend/src/main/java/com/nabd/hms/(clinical|billing|auth)/'; then
            echo "Blocked: nightly PIT score dropped by more than 2 points; restore mutation tests (see docs/ops/ci.md)"; exit 1
          fi

  # OPS-034 stage 5: report only. Never a required check (test_ci.py: required contexts = stage* jobs), failures never block the PR.
  api-contract-report:
    name: stage5-api-contract (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: oasdiff base vs head (api/openapi/core.yaml)
        env:
          GH_TOKEN: ${{ github.token }}
          OASDIFF_VERSION: "1.10.23"
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar xz oasdiff
          git show "origin/${{ github.base_ref }}:api/openapi/core.yaml" > "$RUNNER_TEMP/base.yaml" || { echo "no base spec yet"; exit 0; }
          {
            echo "<!-- api-contract-report -->"
            echo "### API contract report (oasdiff, non-blocking)"
            echo '```'
            ./oasdiff changelog "$RUNNER_TEMP/base.yaml" api/openapi/core.yaml | head -c 60000
            echo '```'
            echo "Breaking changes only:"
            echo '```'
            ./oasdiff breaking "$RUNNER_TEMP/base.yaml" api/openapi/core.yaml | head -c 20000
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file "$RUNNER_TEMP/report.md"

  stage6-build-and-scan:
    needs: [changes, stage1-static, stage2-unit, stage3-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC for keyless cosign; no long-lived secrets
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - name: package jar (tests already ran in stages 2 and 3 of this run)
        run: mvn -B -q -f backend/pom.xml package -Dmaven.test.skip=true
      - uses: docker/setup-buildx-action@v3
      - name: build image once
        run: docker build -t "$IMAGE:${{ github.sha }}" .
      - name: Trivy image scan (fail on new High/Critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: OWASP Dependency-Check (fail on CVSS >= 7)
        uses: dependency-check/Dependency-Check_Action@main
        env: { JAVA_HOME: /opt/jdk }
        with:
          project: nabd-hms
          path: backend
          format: HTML
          args: --failOnCVSS 7 --suppression ci/dependency-check-suppressions.xml --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: npm audit (new High/Critical only, baseline with owners)
        working-directory: frontend
        run: |
          npm audit --audit-level=high --json > "$RUNNER_TEMP/audit.json" || true
          python3 ../scripts/ci/baseline.py npm-audit "$RUNNER_TEMP/audit.json" ../.github/security-baseline.json
      - name: CycloneDX SBOMs
        run: |
          mvn -B -q -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.8.1:makeAggregateBom -DoutputFormat=json -DoutputName=sbom-backend
          (cd frontend && npm ci --no-audit --no-fund -q && npx --yes @cyclonedx/cyclonedx-npm@1.19.3 --output-file ../sbom-frontend.json)
      # Publish only on merge to main: push, sign, attach SBOM, expose digest. Deploys must reference the digest.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.7.0
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: push, sign, attach SBOM
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          cosign sign --yes "$digest"
          cosign attach sbom --sbom backend/target/sbom-backend.json --type cyclonedx "$digest"
          cosign attest --yes --type cyclonedx --predicate backend/target/sbom-backend.json "$digest"
          echo "$digest" | tee image-digest.txt
          echo "Deploy ref: $digest" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: image-digest, path: "image-digest.txt\nsbom-frontend.json" }
