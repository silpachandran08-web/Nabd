# OPS-031: stages 1 (static), 2 (unit), 3 (integration), 6 (build and scan); OPS-036: stage 7 (preview + smoke). Required checks on main:
# stage1-static, stage2-unit, stage3-integration, stage6-build-and-scan, stage7-preview-e2e (see .github/branch-protection.json).
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: { contents: read, pull-requests: read }  # dorny/paths-filter lists the PR files through the API
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'db/**'
              - 'api/**'
              - 'Dockerfile'
              - '.github/**'
            frontend:
              - 'frontend/**'
              - '.github/**'
              - 'scripts/api/**'

  stage1-static:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (fails the PR on a committed secret)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --redact --exit-code 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: baseline entries valid and unexpired
        run: python3 scripts/ci/baseline.py validate
      - name: Semgrep (new High/Critical only vs base)
        run: |
          pip install -q semgrep==1.97.0
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          semgrep scan --config p/ci --config p/java --config p/typescript --severity ERROR --error --metrics=off \
            --baseline-commit "$base" --exclude node_modules --exclude target
      - if: needs.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      # FEF-012: Turborepo cache stays on the CI runner (actions/cache), no SaaS remote cache holds build output.
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/cache@v4
        with: { path: frontend/.turbo/cache, key: "turbo-static-${{ github.sha }}", restore-keys: "turbo-static-" }
      - if: needs.changes.outputs.frontend == 'true'
        name: next typegen, tsc, ESLint (incl. boundaries), permission rendering (turbo; unchanged packages hit the cache)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run typecheck lint check:permissions check:raw-api
      - name: OpenAPI valid
        run: pip install -q openapi-spec-validator && python3 -m openapi_spec_validator api/openapi.yaml
      - name: Event schemas (OPS-015 catalogue, PHI denylist, envelope < 2 KB) and the gate's own tests
        run: python3 scripts/ci/events.py check && python3 scripts/ci/test_events.py
      - name: Golden tax pack sign-off (FIN-010) - fails with 'golden pack not re-signed' when tax rules or cases changed unsigned; the gate's own tests
        run: python3 scripts/ci/golden_pack.py check && python3 -m unittest scripts/ci/test_golden_pack.py
      - name: No brand-visibility widening (PLT-021) - new migrations and Java must not use the removed visible/accessible tenant-id GUCs; the gate's own tests
        run: python3 scripts/ci/brand_visibility_gate.py && python3 scripts/ci/test_brand_visibility_gate.py
      - name: No cache value in logs or metrics (OPS-020 static scan) and the scan's own tests
        run: python3 scripts/ci/cache_values.py check && python3 scripts/ci/test_cache_values.py
      - name: Pilot UAT pack complete (OPS-049) and its tools
        run: python3 scripts/ci/uat_pack.py check && python3 scripts/ci/test_ops049_uat.py

  stage2-unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # OPS-033 architecture report comment
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      # FEF-012: Turborepo cache stays on the CI runner (actions/cache), no SaaS remote cache holds build output.
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/cache@v4
        with: { path: frontend/.turbo/cache, key: "turbo-unit-${{ github.sha }}", restore-keys: "turbo-unit-" }
      - if: needs.changes.outputs.frontend == 'true'
        name: unit tests incl. consult flow
        working-directory: frontend
        run: |
          # staff-web unit tests also read api/, .github/, perf/ and renovate.json: their git hashes key the turbo cache
          export NABD_REPO_INPUTS="$(git rev-parse HEAD:api HEAD:.github HEAD:perf HEAD:renovate.json | tr '\n' ' ')"
          pnpm install --frozen-lockfile && pnpm turbo run test
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - if: needs.changes.outputs.backend == 'true'
        name: JUnit unit tests (no Docker; ApiTestBase classes run in stage 3)
        working-directory: backend
        run: mvn -B -q test -Dtest='!*ApiTest,!*IT' -Dsurefire.failIfNoSpecifiedTests=false
      # OPS-033: ArchitectureRulesTest (above) writes Modulith + ArchUnit findings; arch.py adds the SQL scans and the gate
      - if: "!cancelled() && needs.changes.outputs.backend == 'true'"
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: "!cancelled() && needs.changes.outputs.backend == 'true'"
        name: architecture report (Modulith, ArchUnit, SQL ownership, tenant predicate; counts by module)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          pip install -q pyyaml
          python3 scripts/ci/arch.py summary backend/target/architecture-violations.json architecture-report.json > arch.md
          cat arch.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = pull_request ]; then
            pr="${{ github.event.pull_request.number }}"
            id=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate --jq '[.[] | select(.body | startswith("<!-- architecture-report -->"))] | last | .id // empty') || true
            if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@arch.md || true
            else gh pr comment "$pr" --body-file arch.md || true; fi
          fi
      - if: "!cancelled() && needs.changes.outputs.backend == 'true'"
        name: tenant-parameter metric (PLT-019 AC5, report only; target 0 in migrated modules by S6)
        continue-on-error: true
        run: |
          python3 scripts/ci/tenant_params.py | tee tenant-params.json
          { echo "### Explicit tenantId service parameters (PLT-019)"; echo '```json'; cat tenant-params.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: "!cancelled() && needs.changes.outputs.backend == 'true'"
        uses: actions/upload-artifact@v4
        with: { name: architecture-report, path: "architecture-report.json\narch.md\ntenant-params.json" }
      - if: "!cancelled() && needs.changes.outputs.backend == 'true'"
        name: architecture gate (mode from ci/architecture-gate.json; report only until its dates are set)
        run: python3 scripts/ci/arch.py gate backend/target/architecture-violations.json

  stage3-integration:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - if: needs.changes.outputs.backend == 'true'
        name: Testcontainers integration tests + JaCoCo (parallel by class)
        working-directory: backend
        run: |
          mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent verify \
            org.jacoco:jacoco-maven-plugin:0.8.12:report \
            -Dtest='*ApiTest,*IT' -Dsurefire.failIfNoSpecifiedTests=false -DforkCount=2 -DreuseForks=true
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with: { name: jacoco, path: backend/target/site/jacoco }
      - if: needs.changes.outputs.backend == 'true'
        name: every event the producer tests published validates (OPS-015, samples from DomainEventContractApiTest)
        run: pip install -q jsonschema && python3 scripts/ci/events.py check --samples backend/target/event-samples
      - if: needs.changes.outputs.backend == 'true'
        name: no cached value in the captured logs or Prometheus scrape (OPS-020, samples from Ops020CacheApiTest)
        run: python3 scripts/ci/cache_values.py check --samples backend/target/cache-scan
      # OPS-032: coverage comment + gates (ci/quality-gates.json; gates stay report-only until enabled_from is set)
      - if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
        name: JaCoCo summary comment and coverage gates
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git fetch -q origin ${{ github.base_ref }} --depth=200
          base=$(git merge-base HEAD origin/${{ github.base_ref }})
          python3 scripts/ci/quality.py summary backend/target/site/jacoco/jacoco.xml "$base" | tee cov.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file cov.md || true
          python3 scripts/ci/quality.py gate backend/target/site/jacoco/jacoco.xml "$base"
      - if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request' && vars.PIT_BLOCKED == 'true'
        name: PIT drop gate (nightly mutation score fell more than 2 points)
        run: |
          git fetch -q origin ${{ github.base_ref }} --depth=200
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^backend/src/main/java/com/nabd/hms/(clinical|billing|auth)/'; then
            echo "Blocked: nightly PIT score dropped by more than 2 points; restore mutation tests (see docs/ops/ci.md)"; exit 1
          fi

  # OPS-034 stage 5: report only. Never a required check (test_ci.py: required contexts = stage* jobs), failures never block the PR.
  api-contract-report:
    name: stage5-api-contract (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: oasdiff base vs head (api/openapi/core.yaml)
        env:
          GH_TOKEN: ${{ github.token }}
          OASDIFF_VERSION: "1.10.23"
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar xz oasdiff
          git show "origin/${{ github.base_ref }}:api/openapi/core.yaml" > "$RUNNER_TEMP/base.yaml" || { echo "no base spec yet"; exit 0; }
          {
            echo "<!-- api-contract-report -->"
            echo "### API contract report (oasdiff, non-blocking)"
            echo '```'
            ./oasdiff changelog "$RUNNER_TEMP/base.yaml" api/openapi/core.yaml | head -c 60000
            echo '```'
            echo "Breaking changes only:"
            echo '```'
            ./oasdiff breaking "$RUNNER_TEMP/base.yaml" api/openapi/core.yaml | head -c 20000
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          # own marker, so this report never overwrites the coverage comment (which uses --edit-last)
          sed -i '1i <!-- oasdiff-report -->' "$RUNNER_TEMP/report.md"
          pr="${{ github.event.pull_request.number }}"
          id=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate --jq '[.[] | select(.body | startswith("<!-- oasdiff-report -->"))] | last | .id // empty')
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$RUNNER_TEMP/report.md"
          else gh pr comment "$pr" --body-file "$RUNNER_TEMP/report.md"; fi

  # OPS-035 stage 5 (blocking, required): spec drift, permission reflection, oasdiff breaking rule, generated client up to date.
  # The api-contract-report job above stays the non-blocking PR comment.
  stage5-api-contract:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - name: undocumented / phantom operations and x-required-permission == @PreAuthorize (0 allowed)
        working-directory: backend
        run: mvn -B -q test -Dtest=ApiContractGateTest -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: generated types, Zod schemas, MSW handlers and Permission union (frontend/packages/api-client/src/generated) match api/openapi/core.yaml
        run: pip install -q pyyaml && python3 scripts/api/generate_client.py --check
      - name: oasdiff breaking changes block unless deprecated with a Sunset (x-sunset)
        if: github.event_name == 'pull_request'
        env: { OASDIFF_VERSION: "1.10.23" }
        shell: bash   # -eo pipefail: the tee below must not hide the gate's exit code
        run: |
          git show "origin/${{ github.base_ref }}:api/openapi/core.yaml" > "$RUNNER_TEMP/base.yaml" || { echo "no base spec yet"; exit 0; }
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar xz oasdiff
          ./oasdiff breaking "$RUNNER_TEMP/base.yaml" api/openapi/core.yaml -f json > "$RUNNER_TEMP/breaking.json"
          python3 scripts/ci/api_contract.py breaking "$RUNNER_TEMP/breaking.json" api/openapi/core.yaml | tee -a "$GITHUB_STEP_SUMMARY"

  # OPS-036 / FEF-049 stage 7: preview per PR + browser smoke and axe. Off until the preview cluster exists (vars.PREVIEW_ENABLED).
  preview:
    needs: stage6-build-and-scan
    if: github.event_name == 'pull_request' && vars.PREVIEW_ENABLED == 'true'
    uses: ./.github/workflows/preview.yml
    secrets: inherit
    permissions:           # a called workflow can only narrow these; exactly what preview.yml requests
      contents: read
      packages: write      # GHCR preview images
      id-token: write      # OIDC login to the preview cluster
      pull-requests: write # URL + logins comment
  stage7-preview-e2e:
    needs: preview
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: preview deploy, smoke journeys and axe must pass
        run: |
          if [ "${{ vars.PREVIEW_ENABLED }}" != true ]; then echo "::notice::stage 7 preview disabled (vars.PREVIEW_ENABLED); see docs/ops/preview.md"; exit 0; fi
          [ "${{ needs.preview.result }}" = success ] || { echo "stage 7 failed: preview ${{ needs.preview.result }}"; exit 1; }

  stage6-build-and-scan:
    needs: [changes, stage1-static, stage2-unit, stage3-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC for keyless cosign; no long-lived secrets
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - name: package jar (tests already ran in stages 2 and 3 of this run)
        run: mvn -B -q -f backend/pom.xml package -Dmaven.test.skip=true
      - uses: docker/setup-buildx-action@v3
      - name: build image once
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker build --target migrate -t "$IMAGE-migrate:${{ github.sha }}" .
      - name: Container structure test (non-root, no shell, JVM flags, migrate entrypoint)
        run: infra/ci/check-image.sh "$IMAGE:${{ github.sha }}" "$IMAGE-migrate:${{ github.sha }}"
      - name: Trivy image scan (fail on new High/Critical)
        run: |
          scripts/ci/install-trivy.sh
          ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore "$IMAGE:${{ github.sha }}"
      - name: OWASP Dependency-Check (fail on CVSS >= 7)
        uses: dependency-check/Dependency-Check_Action@main
        env: { JAVA_HOME: /opt/jdk }
        with:
          project: nabd-hms
          path: backend
          format: HTML
          args: --failOnCVSS 7 --suppression ci/dependency-check-suppressions.xml --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: pnpm audit (new High/Critical only, baseline with owners)
        working-directory: frontend
        run: |
          pnpm audit --audit-level=high --json > "$RUNNER_TEMP/audit.json" || true
          python3 ../scripts/ci/baseline.py npm-audit "$RUNNER_TEMP/audit.json" ../.github/security-baseline.json
      - name: CycloneDX SBOMs
        run: |
          mvn -B -q -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.8.1:makeAggregateBom -DoutputFormat=json -DoutputName=sbom-backend
          (cd frontend && pnpm install --frozen-lockfile && npx --yes @cyclonedx/cdxgen@12.8.5 -t pnpm -o ../sbom-frontend.json .)
      # Publish only on merge to main: push, sign, attach SBOM, expose digest. Deploys must reference the digest.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.7.0
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: push, sign, attach SBOM
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE-migrate:${{ github.sha }}"   # deploys run the migrate image to completion before rolling out the API
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          cosign sign --yes "$digest"
          cosign attach sbom --sbom backend/target/sbom-backend.json --type cyclonedx "$digest"
          cosign attest --yes --type cyclonedx --predicate backend/target/sbom-backend.json "$digest"
          echo "$digest" | tee image-digest.txt
          echo "Deploy ref: $digest" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: image-digest, path: "image-digest.txt\nsbom-frontend.json" }
