name: eta-accuracy
# ACC-019 (T-091): nightly ETA accuracy gate. Replays the golden dataset through the predictor and fails when P80 coverage
# is more than 3 points below src/test/resources/eta/reference-baseline.json. Also runs on engine changes.
# Offline: no database, no secrets, no production data. The summary is uploaded as an artefact.
on:
  schedule: [{ cron: "20 1 * * *" }]
  pull_request:
    paths: ['backend/src/main/java/com/nabd/hms/queue/sim/**', 'backend/src/test/resources/eta/**', 'backend/src/test/java/com/nabd/hms/queue/sim/**']
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Replay golden dataset and check the gate
        working-directory: backend
        run: mvn -B -q test -Dtest=Acc019EtaSimulatorTest
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: eta-accuracy-summary, path: backend/target/eta-accuracy/summary.json, if-no-files-found: warn }
