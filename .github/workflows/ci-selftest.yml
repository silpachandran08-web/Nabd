# OPS-031 CI self-test: run on a throwaway canary branch (workflow_dispatch). It must FAIL
# at both seeded defects; the job passes only if every seeded defect was caught.
name: ci-selftest
on: workflow_dispatch
permissions:
  contents: read
jobs:
  seeded-secret-is-caught:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: seed fake AWS key and commit it locally
        run: |
          git config user.email ci@example.invalid && git config user.name ci
          # generated at run time, never stored in the repo
          printf 'aws_access_key_id = AKIA%s\n' "$(head -c 40 /dev/urandom | tr -dc 'A-Z2-7' | head -c 16)" > seeded-secret.txt
          git add seeded-secret.txt && git commit -qm "seed secret"
      - name: gitleaks must exit non-zero
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          if ./gitleaks detect --config .gitleaks.toml --redact --exit-code 1 --log-opts="-1"; then echo "gitleaks MISSED the seeded secret"; exit 1; fi
  seeded-failing-test-is-caught:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: a failing node test must fail the runner
        run: |
          echo 'import {test} from "node:test"; test("seeded", () => { throw new Error("seeded failure") })' > seeded.test.mjs
          if node --test seeded.test.mjs; then echo "runner MISSED the seeded failing test"; exit 1; fi
