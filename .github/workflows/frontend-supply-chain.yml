name: frontend-supply-chain
# CI stage 6 (doc 06 s7.1) for staff-web: audit gates + CycloneDX SBOM.
on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-supply-chain.yml"]
  push:
    branches: [develop-initial, main]
  schedule:
    - cron: "17 3 * * *" # daily: new advisories against an unchanged lockfile

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit gate (high/critical, allowlist with expiry)
        run: node apps/staff-web/scripts/audit-gate.mjs
      - name: pnpm audit runtime deps
        run: pnpm audit --prod --audit-level=high
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: nabd-staff-web
          path: frontend
          format: HTML
          args: --failOnCVSS 7 --disableAssembly
      - name: CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12.8.5 -t pnpm --required-only -o ../sbom-staff-web.cdx.json .
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-staff-web-${{ github.sha }}
          path: sbom-staff-web.cdx.json
          retention-days: 365
