name: frontend-supply-chain
# CI stage 6 (doc 06 s7.1) for staff-web: audit gates + CycloneDX SBOM.
on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-supply-chain.yml"]
  push:
    branches: [develop-initial, main]
  schedule:
    - cron: "17 3 * * *" # daily: new advisories against an unchanged lockfile

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit gate (high/critical, allowlist with expiry)
        run: node scripts/audit-gate.mjs
      - name: npm audit runtime deps
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: nabd-staff-web
          path: frontend
          format: HTML
          args: --failOnCVSS 7 --disableAssembly
      - name: CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@2.1.0 --omit dev --output-format JSON --output-file ../sbom-staff-web.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-staff-web-${{ github.sha }}
          path: sbom-staff-web.cdx.json
          retention-days: 365
